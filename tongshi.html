<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC课导通识刷题 · Day1/Day2/Day6</title>
<meta name="description" content="课导新人训通识题库，Day1/Day2/Day6 三大板块 270 题，随机抽题训练，答错即时讲解">
<meta name="theme-color" content="#1e3c72">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    color: #333;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  .header { text-align: center; color: #fff; padding: 24px 0 8px; }
  .header h1 { font-size: 30px; letter-spacing: 2px; }
  .header p { opacity: .85; margin-top: 8px; font-size: 14px; }
  .card {
    background: #fff; border-radius: 16px; padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); margin-top: 20px;
  }
  .page { display: none; }
  .page.active { display: block; }

  /* 首页知识点卡片 */
  .topic-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .topic-card {
    border: 2px solid #e5eaf3; border-radius: 12px; padding: 16px;
    cursor: pointer; transition: all .15s; background: #fafbff;
  }
  .topic-card:hover { border-color: #2a5298; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(42,82,152,.15); }
  .topic-card .num { font-size: 12px; color: #2a5298; font-weight: bold; }
  .topic-card .name { font-size: 17px; font-weight: bold; margin: 6px 0 4px; }
  .topic-card .cnt { font-size: 12px; color: #888; }
  .topic-card .desc { font-size: 12px; color: #667; margin-top: 2px; line-height: 1.5; }

  /* 题目区 */
  .q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .q-progress { font-size: 14px; color: #2a5298; font-weight: bold; }
  .quit-btn {
    font-size: 12px; color: #999; border: 1px solid #ddd; background: #fff;
    border-radius: 20px; padding: 4px 14px; cursor: pointer;
  }
  .quit-btn:hover { color: #d33; border-color: #d33; }
  .q-tag { display: inline-block; font-size: 12px; background: #eef3ff; color: #2a5298; border-radius: 6px; padding: 2px 10px; margin-bottom: 10px; }
  .q-text { font-size: 17px; line-height: 1.6; font-weight: 600; margin-bottom: 6px; white-space: pre-wrap; }
  pre.code {
    background: #282c34; color: #abb2bf; border-radius: 10px; padding: 14px 16px;
    font-family: Consolas, "Courier New", monospace; font-size: 14px; line-height: 1.55;
    overflow-x: auto; margin: 10px 0; white-space: pre;
  }
  .options { margin-top: 16px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px;
    border: 2px solid #e5eaf3; border-radius: 10px; padding: 12px 14px;
    margin-bottom: 10px; cursor: pointer; transition: all .12s; font-size: 15px; line-height: 1.5;
  }
  .opt:hover { border-color: #2a5298; background: #f6f9ff; }
  .opt .letter { font-weight: bold; color: #2a5298; min-width: 22px; }
  .opt.correct { border-color: #2eaf64; background: #eafaf1; }
  .opt.correct .letter { color: #2eaf64; }
  .opt.wrong { border-color: #e05252; background: #fdeeee; }
  .opt.wrong .letter { color: #e05252; }
  .opt.disabled { pointer-events: none; opacity: .92; }

  .feedback { border-radius: 10px; padding: 14px 16px; margin-top: 14px; font-size: 14px; line-height: 1.7; display: none; }
  .feedback.ok { background: #eafaf1; border: 1px solid #9adcb8; color: #1d7a47; display: block; }
  .feedback.bad { background: #fdeeee; border: 1px solid #f0b3b3; color: #b03030; display: block; }
  .feedback .verdict { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .next-btn {
    display: none; width: 100%; margin-top: 16px; padding: 12px;
    background: #2a5298; color: #fff; border: none; border-radius: 10px;
    font-size: 16px; font-weight: bold; cursor: pointer;
  }
  .next-btn:hover { background: #1e3c72; }
  .next-btn.show { display: block; }

  /* 结果页 */
  .result-head { text-align: center; padding: 8px 0 4px; }
  .score-ring {
    width: 160px; height: 160px; border-radius: 50%; margin: 18px auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: conic-gradient(#2eaf64 var(--p, 0%), #eef1f6 0);
  }
  .score-ring .inner {
    width: 130px; height: 130px; border-radius: 50%; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score-ring .score { font-size: 44px; font-weight: bold; color: #2a5298; line-height: 1; }
  .score-ring .unit { font-size: 13px; color: #999; margin-top: 4px; }
  .result-stats { display: flex; justify-content: center; gap: 28px; margin: 14px 0 6px; }
  .result-stats .item { text-align: center; }
  .result-stats .v { font-size: 24px; font-weight: bold; color: #333; }
  .result-stats .k { font-size: 12px; color: #999; margin-top: 2px; }
  .result-msg { text-align: center; font-size: 15px; margin: 10px 0 4px; line-height: 1.7; }
  .wrong-list { margin-top: 18px; }
  .wrong-list h3 { font-size: 15px; color: #666; margin-bottom: 10px; }
  .wrong-item {
    border: 1px solid #f0d3d3; background: #fdf7f7; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; font-size: 13px; line-height: 1.7;
  }
  .wrong-item .wq { font-weight: bold; color: #333; }
  .wrong-item pre.code { font-size: 12px; padding: 10px 12px; margin: 6px 0; }
  .result-btns { display: flex; gap: 12px; margin-top: 20px; }
  .result-btns button {
    flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer;
    border: 2px solid #2a5298;
  }
  .btn-again { background: #2a5298; color: #fff; }
  .btn-home { background: #fff; color: #2a5298; }

  .type-tag { display:inline-block; font-size:11px; border-radius:6px; padding:2px 8px; margin-right:6px; font-weight:bold; }
  .tt-single { background:#e8f0fe; color:#2a5298; }
  .tt-multi { background:#fef3e2; color:#b45309; }
  .tt-judge { background:#f3e8ff; color:#7c3aed; }
  .opt.sel { border-color:#2a5298; background:#eef3ff; }
  .opt.disabled { pointer-events:none; }
  .hint-multi { font-size:12px; color:#999; margin-top:8px; }
  .submit-btn {
    display:block; width:100%; margin-top:12px; padding:12px; border:none; border-radius:10px;
    background:#2a5298; color:#fff; font-size:15px; font-weight:bold; cursor:pointer;
  }
  .submit-btn:disabled { background:#c7d2e8; cursor:default; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>通识刷题</h1>
    <p>Day1 / Day2 / Day6 · 每次随机 30 题 · 答错即时讲解 · 最后出分（含正确率）</p>
  </div>

  <!-- 页面1：选择板块 -->
  <div id="page-home" class="page active">
    <div class="card">
      <div style="font-size:16px;font-weight:bold;margin-bottom:4px;">今天想刷哪个板块？</div>
      <div style="font-size:13px;color:#999;margin-bottom:14px;">点击板块进入，再选知识点，每次随机抽 25 题</div>
      <div id="topic-list" class="topic-list"></div>
    </div>
  </div>


  <!-- 页面1.5：输入姓名 -->
  <div id="page-name" class="page">
    <div class="card" style="text-align:center;">
      <div style="font-size:18px;font-weight:bold;margin-bottom:6px;">开始刷题前，请输入你的姓名</div>
      <div style="font-size:13px;color:#999;margin-bottom:16px;">姓名会显示在成绩单上</div>
      <input id="student-name" type="text" placeholder="请输入姓名" maxlength="20"
        onkeydown="if(event.key==='Enter') confirmName()"
        style="width:70%;padding:12px 16px;font-size:16px;border:2px solid #2a5298;border-radius:10px;outline:none;text-align:center;">
      <div style="margin-top:16px;">
        <button id="name-btn" onclick="confirmName()" style="padding:12px 40px;border:none;border-radius:10px;font-size:16px;font-weight:bold;background:#2a5298;color:#fff;cursor:pointer;">确认，开始答题</button>
      </div>
    </div>
  </div>

  <!-- 页面2：答题 -->
  <div id="page-quiz" class="page">
    <div class="card">
      <div class="q-top">
        <span class="q-progress" id="q-progress"></span>
        <button class="quit-btn" onclick="quitQuiz()">结束本次刷题</button>
      </div>
      <span class="type-tag" id="q-type"></span><span class="q-tag" id="q-tag"></span>
      <div class="q-text" id="q-text"></div>
      <div class="options" id="options"></div>
      <button class="submit-btn" id="submit-btn" style="display:none;" onclick="submitMulti()">确认答案</button>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- 页面3：成绩 -->
  <div id="page-result" class="page">
    <div class="card">
      <div class="result-head" id="result-topic" style="font-weight:bold;font-size:18px;"></div>
      <div class="result-head" id="result-student" style="font-size:14px;color:#666;margin-top:4px;"></div>
      <div class="score-ring" id="score-ring"><div class="inner">
        <div class="score" id="score-num">0</div><div class="unit">分</div>
      </div></div>
      <div class="result-stats">
        <div class="item"><div class="v" id="stat-total">30</div><div class="k">题目总数</div></div>
        <div class="item"><div class="v" id="stat-right" style="color:#2eaf64;">0</div><div class="k">答对</div></div>
        <div class="item"><div class="v" id="stat-wrong" style="color:#e05252;">0</div><div class="k">答错</div></div>
        <div class="item"><div class="v" id="stat-acc" style="color:#e6a23c;">0%</div><div class="k">正确率</div></div>
      </div>
      <div class="result-stats" style="margin-top:2px;">
        <div class="item"><div class="v" id="stat-time-start" style="font-size:15px;">--</div><div class="k">开始时间</div></div>
        <div class="item"><div class="v" id="stat-time-end" style="font-size:15px;">--</div><div class="k">结束时间</div></div>
        <div class="item"><div class="v" id="stat-time-used" style="font-size:15px;color:#2a5298;">--</div><div class="k">总用时</div></div>
      </div>
      <div class="result-msg" id="result-msg"></div>
      <div class="wrong-list" id="wrong-list"></div>
      <div class="result-btns">
        <button class="btn-again" onclick="retakeQuiz()">再刷一组</button>
        <button class="btn-home" onclick="showPage('page-home')">换个板块</button>
      </div>
    </div>
  </div>
</div>

<script>
const TOPICS = [
  { id: 1, num: "01", name: "Day1通识刷题", color: "#2a5298", questions: [
    {"q": "信奥赛（CSP-J/S）唯一指定的编程语言是？", "opts": ["图形化编程", "Python", "C++", "Java"], "ans": 2, "exp": "C++是竞赛语言、含金量最高，是信奥赛（CSP-J/S）唯一指定语言，也是升学加分硬通货。", "type": "single"},
    {"q": "图形化编程、Python、C++三种语言的定位，下列说法正确的是？", "opts": ["图形化拖拽积木培养兴趣，Python语法简单应用广，C++是信奥赛唯一指定语言", "Python是信奥赛唯一指定语言", "C++语法最简单、最适合零基础入门", "图形化编程可直接对接信奥赛"], "ans": 0, "exp": "图形化=拖拽积木、培养兴趣；Python=代码入门、语法简单、应用广；C++=竞赛语言、信奥赛唯一指定。", "type": "single"},
    {"q": "科特C1入口的班型价格是？", "opts": ["4399元/阶段", "4999元/阶段", "4899元/阶段", "12999元/期"], "ans": 0, "exp": "科特C1入口为4399元/阶段（三年6个阶段）。", "type": "single"},
    {"q": "科特C1入口的课程周期是？", "opts": ["半年", "1.5年（3个阶段）", "三年（6个阶段）", "1年"], "ans": 2, "exp": "科特C1入口课程周期为三年（6个阶段）；1.5年（3个阶段）是集训N线的周期。", "type": "single"},
    {"q": "科特C1&C2阶段的课程形式是？", "opts": ["大班直播+小组辅导", "纯录播课", "线下封闭集训", "AI实操课+直播课"], "ans": 3, "exp": "C1&C2为AI实操课+直播课；大班直播+小组辅导是C3-C6的形式。", "type": "single"},
    {"q": "C3-C6阶段的课程形式是？", "opts": ["AI实操课+直播课", "大班直播+小组辅导", "纯实操课", "1对1辅导"], "ans": 1, "exp": "C3-C6为大班直播+小组辅导。", "type": "single"},
    {"q": "科特C1阶段的课程目标（考级）是？", "opts": ["CTL 1级", "CTL 2级", "GESP 1级", "GESP 2级"], "ans": 1, "exp": "科特C1（竞赛线入口）阶段目标：CTL 2级；注意与趣味C1（趣味C++第一阶段，考级目标 CTL 1级）区分。", "type": "single"},
    {"q": "C2阶段的课程目标是？", "opts": ["GESP2级", "GESP5、6级", "CTL2级", "GESP7、8级"], "ans": 0, "exp": "C2目标为GESP2级，并尝试CSP-J二三等奖。", "type": "single"},
    {"q": "C3阶段的课程目标是？", "opts": ["GESP2、3级", "GESP3、4级", "GESP5、6级", "GESP7、8级"], "ans": 1, "exp": "C3目标为GESP3、4级，赛事目标CSP-J一等奖、CSP-S二三等奖。", "type": "single"},
    {"q": "C6阶段的课程目标是？", "opts": ["GESP5、6级", "GESP6、7级", "GESP7、8级", "CTL2级"], "ans": 2, "exp": "C4目标GESP5、6级，C5目标GESP6、7级，C6目标GESP7、8级。", "type": "single"},
    {"q": "C4-C6阶段的赛事目标是？", "opts": ["CSP-J二等奖", "CSP-J一等奖、CSP-S二等奖", "NOIP一等奖", "CSP-J二三等奖"], "ans": 1, "exp": "C4-C6赛事目标为CSP-J一等奖、CSP-S二等奖；NOIP一等奖是N线目标方向。", "type": "single"},
    {"q": "竞赛A线的定价规则是？", "opts": ["A1 A班-A3 A班为4999元，A4-A6为5499元", "全线统一4999元", "A1 A班-A3 A班为5499元，A4-A6为4999元", "全线统一3399元"], "ans": 0, "exp": "A线按班型分层定价：A1A班-A3A班4999元，A4-A6为5499元（S班为小班直播）。", "type": "single"},
    {"q": "A班与S班的授课形式是？", "opts": ["A班大班直播，S班小班直播", "A班小班直播，S班大班直播", "均为1对1", "均为线下小班"], "ans": 0, "exp": "A班为大班直播，S班为小班直播。", "type": "single"},
    {"q": "集训N线系统课的课程周期是？", "opts": ["半年", "1年", "1.5年（3个阶段）", "三年（6个阶段）"], "ans": 2, "exp": "N线为1.5年（3个阶段），N1/N2/N3；三年6阶段是科特C1入口的周期。", "type": "single"},
    {"q": "集训N线的价格是？", "opts": ["原价4899元，实付5899元", "原价5899元，实付4899元", "统一5499元", "统一3399元"], "ans": 1, "exp": "N线原价5899元，实付4899元。", "type": "single"},
    {"q": "夏冬令营“0基础语法速通班大核桃营”的价格是？", "opts": ["12999元/期", "14999元/期", "8699元/期", "5899元/期"], "ans": 0, "exp": "大核桃营为12999元/期；三个小核桃营为14999元/期。", "type": "single"},
    {"q": "三个“小核桃营”（CSP-J提高班/CSP-J一等奖/CSP-S一等奖）的价格是？", "opts": ["12999元/期", "14999元/期", "15999元/期", "9699元/期"], "ans": 1, "exp": "三个小核桃营均为14999元/期；大核桃营为12999元/期。", "type": "single"},
    {"q": "趣味C++（QC）优惠后的价格是？", "opts": ["6499元/期", "4999元/阶段", "4899元/阶段", "4399元/阶段"], "ans": 3, "exp": "趣味C++优惠后4399元/阶段，首通时用户已支付4399。", "type": "single"},
    {"q": "趣味C++的班容与师资是？", "opts": ["30人左右小班，课导老师授课", "20人小班，清北名师双师", "50人大班，班主任授课", "1对1私教"], "ans": 0, "exp": "趣味C++为30人左右小班，面向大众学员，师资为课导老师；20人小班清北名师是集训队。", "type": "single"},
    {"q": "QC的课程模式是？", "opts": ["纯大班直播无互动", "纯录播自学", "线下面授", "直播+实操+实时跟课（实时监课+视频/语音/文字连麦）"], "ans": 3, "exp": "课程模式=直播+实操+实时跟课，含课前直播+赛考直播，实时监课+视频/语音/文字连麦。", "type": "single"},
    {"q": "趣味C++（QC）的课程目标是？", "opts": ["替代校内数学课", "只培养兴趣不参赛", "过渡到Python竞赛", "让孩子以第一语言学习C++，参加C++相关赛事考级"], "ans": 3, "exp": "趣味C++目标：让孩子以第一语言学习C++，参加C++相关赛事考级，面向大众学员。", "type": "single"},
    {"q": "面对家长“孩子学不会怎么办”，正确的回答思路是？", "opts": ["承诺保分→降价→送课", "归因→报价→催单→成交", "否认→辩解→转移话题", "共情→归因→亮方案→给信心"], "ans": 3, "exp": "四步：共情（理解担心）→归因（90%不是智商是方法和专注力）→亮方案（四重保障）→给信心（零基础都能学会）。", "type": "single"},
    {"q": "C++作为竞赛语言的优势包括？", "opts": ["含金量最高", "信奥赛（CSP-J/S）唯一指定语言", "底层思维，锻炼逻辑能力最强", "升学加分硬通货"], "ans": [0, 1, 2, 3], "exp": "四项均为课件中C++的语言定位。", "type": "multi"},
    {"q": "课程体系的“三大支柱”是指？", "opts": ["课程模式（直播+实操+实操监课）", "因材施教（分支教学+课前自动复习）", "学练考一体（每节课对标赛考题型）", "额外价值（科普+学科结合+英语跟读）"], "ans": [0, 1, 2], "exp": "三大支柱=课程模式、因材施教、学练考一体；“额外价值”属于三层保障。", "type": "multi"},
    {"q": "课程体系的“三层保障”是指？", "opts": ["愿意学", "学得会", "额外价值", "课程模式"], "ans": [0, 1, 2], "exp": "三层保障=愿意学（剧情闯关+金币+软硬件）、学得会（时间轴+专注力训练）、额外价值（科普+学科结合+英语跟读）；课程模式属于三大支柱。", "type": "multi"},

const LETTERS = ['A','B','C','D','E','F'];
let quizList = [], current = 0, rightCnt = 0, wrongList = [];
let currentTopic = null;
let studentName = "", startTime = null, endTime = null;

let chosen = new Set();

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function renderHome(){
  const el = document.getElementById('topic-list');
  el.innerHTML = TOPICS.map(t =>
    '<div class="topic-card" style="--c:'+t.color+'" onclick="openTopic('+t.id+')">'
    + '<div class="name">'+esc(t.name)+'</div>'
    + '<div class="desc">'+esc(t.desc||'')+'</div>'
    + '<div class="cnt">'+t.questions.length+' 题</div></div>').join('')
;
}

function openTopic(id){
  currentTopic = TOPICS.find(t=>t.id===id);
  showPage('page-name');
  document.getElementById('student-name').value = studentName || "";
  setTimeout(()=>document.getElementById('student-name').focus(), 50);
}

function confirmName(){
  const name = document.getElementById('student-name').value.trim();
  if(!name){ alert('请输入你的姓名哦～'); return; }
  studentName = name;
  startQuiz();
}

function startQuiz(){
  quizList = shuffle(currentTopic.questions.slice()).slice(0, 30);
  current = 0; rightCnt = 0; wrongList = [];
  startTime = new Date(); endTime = null;
  showPage('page-quiz');
  renderQuestion();
}

function retakeQuiz(){ openTopic(currentTopic.id); }

function renderQuestion(){
  const q = quizList[current];
  chosen = new Set();
  document.getElementById('q-progress').textContent = '第 '+(current+1)+' / '+quizList.length+' 题　已答对 '+rightCnt+' 题';
  const tname = {single:'单选',multi:'多选',judge:'判断'}[q.type] || '单选';
  const tcls = {single:'tt-single',multi:'tt-multi',judge:'tt-judge'}[q.type] || 'tt-single';
  document.getElementById('q-type').textContent = tname;
  document.getElementById('q-type').className = 'type-tag '+tcls;
  document.getElementById('q-tag').textContent = esc(currentTopic.name);
  document.getElementById('q-text').textContent = q.q;
  const multi = q.type === 'multi';
  document.getElementById('options').innerHTML = q.opts.map((o,i)=>
    '<div class="opt" data-i="'+i+'" onclick="pickOpt('+i+')"><span class="key">'+LETTERS[i]+'.</span><span>'+esc(o)+'</span></div>').join('');
  const sb = document.getElementById('submit-btn');
  sb.style.display = multi ? 'block' : 'none';
  sb.disabled = true;
  if (multi) {
    const hint = document.createElement('div');
    hint.className = 'hint-multi'; hint.id = 'hint-multi';
    hint.textContent = '多选题：选出所有正确选项后点「确认答案」';
    document.getElementById('options').after(hint);
  } else {
    const h = document.getElementById('hint-multi'); if (h) h.remove();
  }
  const fb = document.getElementById('feedback');
  fb.style.display='none'; fb.innerHTML='';
  document.getElementById('next-btn').classList.remove('show');
}

function pickOpt(i){
  const q = quizList[current];
  const opts = document.querySelectorAll('#options .opt');
  if (q.type === 'multi') {
    chosen.has(i) ? chosen.delete(i) : chosen.add(i);
    opts[i].classList.toggle('sel');
    document.getElementById('submit-btn').disabled = chosen.size === 0;
  } else {
    lockAnswer(new Set([i]));
  }
}

function submitMulti(){
  if (chosen.size === 0) return;
  lockAnswer(new Set(chosen));
}

function lockAnswer(picked){
  const q = quizList[current];
  const opts = document.querySelectorAll('#options .opt');
  opts.forEach(o=>o.classList.add('disabled'));
  const ansSet = new Set(Array.isArray(q.ans) ? q.ans : [q.ans]);
  opts.forEach((o,idx)=>{ if(ansSet.has(idx)) o.classList.add('correct'); });
  const isRight = picked.size === ansSet.size && [...picked].every(x=>ansSet.has(x));
  const fb = document.getElementById('feedback');
  const ansText = [...ansSet].sort().map(i=>LETTERS[i]+'. '+q.opts[i]).join('；');
  if (isRight) {
    rightCnt++;
    fb.className = 'feedback ok';
    fb.innerHTML = '<div class="verdict">✓ 回答正确！</div>'+esc(q.exp);
  } else {
    picked.forEach(i=>{ if(!ansSet.has(i)) opts[i].classList.add('wrong'); });
    wrongList.push({q, picked:[...picked].sort()});
    fb.className = 'feedback bad';
    fb.innerHTML = '<div class="verdict">✗ 回答错误，正确答案是 '+esc(ansText)+'</div>'+esc(q.exp);
  }
  fb.style.display = 'block';
  const nb = document.getElementById('next-btn');
  nb.classList.add('show');
  nb.textContent = current === quizList.length - 1 ? '查看成绩 →' : '下一题 →';
  nb.onclick = nextQuestion;
  window.scrollTo(0, document.body.scrollHeight);
}

function nextQuestion(){
  if (current === quizList.length - 1) { showResult(); return; }
  current++;
  renderQuestion();
}

function quitQuiz(){
  if (confirm('确定结束本次刷题？将直接出成绩')) {
    endTime = new Date();
    if (quizList.length) { // grade remaining as wrong (unanswered)
      showResult(true);
    }
  }
}

function fmtTime(d){
  const pad = n => String(n).padStart(2,'0');
  return pad(d.getHours())+':'+pad(d.getMinutes());
}
function fmtDuration(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m > 0 ? m+' 分 '+s+' 秒' : s+' 秒';
}

function showResult(quitEarly){
  const total = quizList.length;
  const right = rightCnt;
  const score = Math.round(right/total*100);
  endTime = endTime || new Date();
  document.getElementById('result-topic').textContent = currentTopic.name;
  document.getElementById('result-student').textContent = studentName ? '答题人：'+studentName : '';
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-right').textContent = right;
  document.getElementById('stat-wrong').textContent = total - right;
  document.getElementById('stat-acc').textContent = score + '%';
  document.getElementById('stat-time-start').textContent = fmtTime(startTime);
  document.getElementById('stat-time-end').textContent = fmtTime(endTime);
  document.getElementById('stat-time-used').textContent = fmtDuration(Math.max(0, Math.round((endTime-startTime)/1000)));
  const ring = document.getElementById('score-ring');
  ring.style.setProperty('--p', score+'%');
  const scoreNum = document.getElementById('score-num');
  let cur = 0;
  const timer = setInterval(()=>{
    cur += Math.max(1, Math.round(score/30));
    if (cur >= score) { cur = score; clearInterval(timer); }
    scoreNum.textContent = cur;
  }, 30);
  let msg;
  if (score === 100) msg = '满分！这个板块已经拿捏了，可以换个板块继续～';
  else if (score >= 90) msg = '非常棒！只差一点点，再刷一组冲满分！';
  else if (score >= 80) msg = '不错不错，基础扎实，看看错题解析补齐小漏洞。';
  else if (score >= 60) msg = '及格啦，但还有提升空间，建议重刷一组巩固错题。';
  else msg = '这个板块还需要加强，仔细看看下面的错题讲解，再战一轮！';
  if (quitEarly) msg = '本次为提前结束的成绩，建议完整刷完一组再战！';
  document.getElementById('result-msg').textContent = msg;

  const wl = document.getElementById('wrong-list');
  if (wrongList.length === 0) {
    wl.innerHTML = '<div style="text-align:center;color:#2eaf64;font-size:14px;padding:10px 0;">🎉 全对，一道错题都没有！</div>';
  } else {
    wl.innerHTML = '<h3>错题解析（'+wrongList.length+' 道）</h3>' + wrongList.map((w,idx)=>{
      const q = w.q;
      const ansSet = new Set(Array.isArray(q.ans)?q.ans:[q.ans]);
      const ansText = [...ansSet].sort().map(i=>LETTERS[i]+'. '+q.opts[i]).join('；');
      const yourText = w.picked && w.picked.length ? w.picked.map(i=>LETTERS[i]+'. '+q.opts[i]).join('；') : '未作答';
      const tname = {single:'单选',multi:'多选',judge:'判断'}[q.type]||'';
      return '<div class="wrong-item"><div class="wq">'+(idx+1)+'. 【'+tname+'】'+esc(q.q)+'</div>'
        + (q.code?'<pre class="code">'+esc(q.code)+'</pre>':'')
        + '<div>你的答案：'+esc(yourText)+'</div>'
        + '<div style="color:#2eaf64;">正确答案：'+esc(ansText)+'</div>'
        + '<div style="color:#666;margin-top:4px;">解析：'+esc(q.exp)+'</div></div>';
    }).join('');
  }
  showPage('page-result');
}

renderHome();
</script>
</body>
</html>
