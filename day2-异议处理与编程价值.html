const TYPE_LABEL = {single:"单选", multi:"多选", judge:"判断"};
const JOPTS = ["√ 正确","× 错误"];
let answered = 0, right = 0;
const answers = {};

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function letters(arr){ return arr.map(i=>String.fromCharCode(65+i)).sort().join(""); }

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  DATA.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.idx = idx;
    card.dataset.type = item.t;
    const opts = item.t === 'judge' ? JOPTS : item.o;
    let html = `<span class="qtype ${item.t}">${idx+1}. ${TYPE_LABEL[item.t]}${item.t==='multi'?'（多选）':''}</span>
      <div class="qtext">${esc(item.q)}</div>`;
    opts.forEach((opt, oi) => {
      html += `<div class="opt" data-oi="${oi}" data-idx="${idx}">${String.fromCharCode(65+oi)}. ${esc(opt)}</div>`;
    });
    if (item.t === 'multi') {
      html += `<div style="text-align:right;margin-top:4px"><button class="confirm-btn" data-idx="${idx}" style="border:none;border-radius:8px;padding:7px 16px;background:#059669;color:#fff;cursor:pointer;font-size:13px">确认答案</button></div>`;
    }
    html += `<div class="exp" id="exp-${idx}">💡 解析：${esc(item.e)}</div>`;
    card.innerHTML = html;
    list.appendChild(card);
  });
  bind();
}

function bind(){
  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      const idx = +el.dataset.idx;
      if (answers[idx] !== undefined) return;
      const item = DATA[idx];
      if (item.t === 'multi') {
        el.classList.toggle('sel');
      } else {
        document.querySelectorAll(`.opt[data-idx="${idx}"]`).forEach(o=>o.classList.remove('sel'));
        el.classList.add('sel');
        check(idx);
      }
    });
  });
  document.querySelectorAll('.confirm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.idx;
      if (answers[idx] === undefined) check(idx);
    });
  });
}

function getSel(idx){
  return [...document.querySelectorAll(`.opt[data-idx="${idx}"].sel`)].map(e=>+e.dataset.oi);
}

function check(idx){
  const item = DATA[idx];
  const sel = getSel(idx);
  const selKey = letters(sel), ansKey = letters(item.a);
  const correct = selKey === ansKey && sel.length === item.a.length;
  answers[idx] = correct;
  answered++; if (correct) right++;
  document.querySelectorAll(`.opt[data-idx="${idx}"]`).forEach(o=>{
    o.classList.add('disabled');
    const oi = +o.dataset.oi;
    if (item.a.includes(oi)) o.classList.add('right');
    else if (o.classList.contains('sel')) o.classList.add('wrong');
  });
  document.getElementById(`exp-${idx}`).classList.add('show');
  updateStats();
  if (answered === DATA.length) setTimeout(showResult, 400);
}

function updateStats(){
  document.getElementById('s-answered').textContent = answered;
  document.getElementById('s-right').textContent = right;
  document.getElementById('s-wrong').textContent = answered - right;
}

function submitAll(){
  DATA.forEach((item, idx) => { if (answers[idx] === undefined) check(idx); });
  showResult();
}

function showResult(){
  const p = Math.round(right / DATA.length * 100);
  const el = document.getElementById('r-score');
  el.textContent = `${right} / ${DATA.length}（${p}分）`;
  el.style.color = p>=80 ? '#16a34a' : p>=60 ? '#d97706' : '#dc2626';
  document.getElementById('r-msg').textContent =
    p>=90 ? '🎉 太棒了！熟读手册和异议处理全流程已烂熟于心！' :
    p>=80 ? '👍 很不错，把错题解析再看一遍就稳了！' :
    p>=60 ? '💪 及格了，重点复习退费核算标准、挽单硬规定和熟读手册数字。' :
            '📖 建议重读两份熟读手册后再刷一遍。';
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.scrollIntoView({behavior:'smooth'});
}

function resetAll(){
  Object.keys(answers).forEach(k => delete answers[k]);
  answered = 0; right = 0;
  const eb = document.getElementById('expBtn');
  eb.dataset.on = ''; eb.textContent = '显示全部解析';
  render();
  updateStats();
  document.getElementById('result').style.display = 'none';
  window.scrollTo({top:0});
}

function setFilter(f, btn){
  document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.card').forEach(c=>{
    c.style.display = (f==='all' || c.dataset.type===f) ? '' : 'none';
  });
}

function toggleExpAll(btn){
  const show = !btn.dataset.on;
  btn.dataset.on = show ? '1' : '';
  document.querySelectorAll('.exp').forEach(e=>{
    if (show) e.classList.add('show'); else e.classList.remove('show');
  });
  btn.textContent = show ? '隐藏全部解析' : '显示全部解析';
}

render();
updateStats();
</script>
