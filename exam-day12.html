<style>

<body>
<div class="wrap">
  <header>
    <h1>📝 9元课导新人训 · Day1+Day2 结业考试</h1>

  </div>
</div>

<script>
const BANK = [{"t":"single","q":"图形化课导的带班周期是？","o":["3 个月","4 个月","半年","一年"],"a":[2],"e":"带班信息页明确：带班周期为半年。","src":"课导工作流程"},{"t":"single","q":"图形化课导每人分配两个固定上课时间段，以下哪组全部属于这些时间段？","o":["周二、周四、周六 19:00","周四、周五、周六 19:00","周五、周六、周日 19:00","周三、周五、周日 19:00"],"a":[1],"e":"带班时间为周四（19:00）、周五（19:00）、周六（19:00），不含周二、周三、周日。","src":"课导工作流程"},{"t":"single","q":"图形化课导班级的用户来源是？","o":["信息流投放直接购课的新用户","老学员转介绍","代理商渠道推荐","前端班主任续报上来"],"a":[3],"e":"用户来源：前端班主任续报上来，即体验课阶段由班主任转化续报的学员。","src":"课导工作流程"},{"t":"single","q":"图形化课导班级的用户特点是？","o":["基本都无编程基础","大多学过 Scratch，有一定基础","一半以上有 Python 基础","均为转介绍来的老学员"],"a":[0],"e":"用户特点：基本都无编程基础，因此需要课导做更细致的入门引导与陪伴。","src":"课导工作流程"},{"t":"single","q":"图形化课每个 LEVEL 的课时与时长安排是？","o":["8 课时，为期 3 周","10 课时，为期 1 个月","12 课时，为期 6 周","20 课时，为期 2 个月"],"a":[1],"e":"每个 LEVEL 是一个月（4 周）的课程、共 10 课时：第 1-3 周 3 次 × 2 课时 = 6 课时，第 4 周 2 次 × 2 课时 = 4 课时，合计 10 课时。","src":"课导工作流程"},{"t":"single","q":"关于每个 LEVEL 内的上课频次安排，正确的是？","o":["第 1-3 周每周 1 次、一次 2 课时；第 4 周每周 2 次，周日增加赛考课或赛考直播课","全程每周 1 次、一次 2 课时，不加课","第 1-3 周每周 2 次；第 4 周每周 1 次收尾","每周固定 2 次，周日安排作业集中答疑课"],"a":[0],"e":"LEVEL 内节奏：第 1-3 周每周 1 次（一次 2 课时）；第 4 周加密为每周 2 次，其中周日增加赛考课或赛考直播课（一次 2 课时）。","src":"课导工作流程"},{"t":"single","q":"每个 LEVEL 的第 4 周，在常规课之外周日增加的课是？","o":["续报预热直播课","家长课堂","赛考课或赛考直播课","作业集中答疑课"],"a":[2],"e":"第 4 周周日增加的是赛考课或赛考直播课（一次 2 课时）；续报预热电访是 L4 阶段的电访动作，不是加课。","src":"课导工作流程"},{"t":"single","q":"接班期的周期与核心目标分别是？","o":["3 周；防流失 + 建信任","3 周；全力推进正式续报","4 周；防流失 + 建信任","3 周；招报预热 + 赛考联报"],"a":[0],"e":"接班期持续 3 周（注意不是 4 周），核心目标是「防流失 + 建信任」。B 是 L5 的目标，D 是 L2 的目标。","src":"课导工作流程"},{"t":"single","q":"L1 试学期的核心目标是？","o":["招报预热 + 赛考联报","等考考试 + 续报预热","赛考履约 + 考务提醒","给家长吃定心丸，建立学习习惯 + 预防流失"],"a":[3],"e":"L1 试学期 4 周，核心目标：给家长吃定心丸，建立学习习惯 + 预防流失。A 是 L2、B 是 L4、C 是 L3 的目标。","src":"课导工作流程"},{"t":"single","q":"赛考招报规划电访需在哪个时间节点前完成？","o":["L1-4 前","L2-4 前","L3-2 前","L4-1 前"],"a":[1],"e":"L2 招报预热阶段要求「L2-4 前完成规划电访」，帮家长明确赛事路径、确认报考意愿，并上传 SOP。","src":"课导工作流程"},{"t":"single","q":"正式续报的时间节点是？","o":["L4-1 / L4-3","L3-2 / L2-4","L6-2 / L6-4","L5-2 / L5-4"],"a":[3],"e":"L5 为正式续报阶段，节点 L5-2 / L5-4。注意区分：L4-1/L4-3 是等考，L3-2/L2-4 是赛考联报。","src":"课导工作流程"},{"t":"single","q":"L4 阶段的核心目标是？","o":["等考考试 + 续报预热","赛考履约 + 考务提醒","招报预热 + 赛考联报","维稳 + 防退费追单"],"a":[0],"e":"L4 核心目标：等考考试 + 续报预热；L4-1/L4-3 参加等考，同时启动续报预热电访。B 是 L3、C 是 L2、D 是 L6 的目标。","src":"课导工作流程"},{"t":"single","q":"接班期学员家长的典型心理状态是？","o":["已付费但尚未完全安心，关注孩子适应度与退费保障","要不要交钱、续不续报","结果焦虑、退费风险、追单敏感","需求明确但信任未建立，不安感与表达欲最强"],"a":[3],"e":"接班期心理：需求明确但信任未建立，不安感与表达欲最强——这正是打首通、见面会、家长会建信任的依据。A 是 L1、B 是 L5、C 是 L6 的心理。","src":"课导工作流程"},{"t":"single","q":"L5 续报阶段用户的核心心理是？","o":["报课初心与现状是否匹配，权衡是否报赛考","等考能否拿到成绩、收获与期望值","要不要交钱，续不续报","处于续报考虑期间"],"a":[2],"e":"L5 心理：要不要交钱，持续报；此阶段要做政策解读、逐一跟进未续报学员。A 是 L2、B 是 L3、D 是 L4 的心理。","src":"课导工作流程"},{"t":"single","q":"日常行课流程中，「开课中」环节包含的动作是？","o":["确认到课、备课、课前直播","课中反馈、课上连麦、后台答疑","课后反馈、作业批改、错误作业反馈","小灶直播课、硬件随材发放"],"a":[1],"e":"日常行课三段：开课前（确认到课/备课/课前直播）、开课中（课中反馈/课上连麦/后台答疑）、开课后（课后反馈/作业批改/错误作业反馈）。","src":"课导工作流程"},{"t":"single","q":"L2 阶段赛事小测的主要形式是？","o":["全员参加的大班线上模考","赛前一周集中辅导营","1V1 / 1Vn 讲题小灶课","等考真题串讲直播"],"a":[2],"e":"L2 招报预热阶段的「赛事小测」以 1V1 / 1Vn 讲题小灶课形式开展，铺垫赛考认知。赛前集中辅导是 L3 的动作。","src":"课导工作流程"},{"t":"multi","q":"以下关于带班信息描述正确的有？","o":["带班周期为半年","固定上课时间为周四 / 周五 / 周六 19:00","每位课导分配两个上课时间段","学员大多有 Scratch 学习经验"],"a":[0,1,2],"e":"D 错误：用户特点为基本都【无】编程基础。","src":"课导工作流程"},{"t":"multi","q":"接班期需要完成的关键动作包括？","o":["扒轨迹","组织赛考联报","见面会","家长会"],"a":[0,2,3],"e":"接班期四件事：扒轨迹、打首通、见面会、家长会。B 错误：赛考联报是 L2 阶段（L3-2/L2-4）启动的动作。","src":"课导工作流程"},{"t":"multi","q":"「扒轨迹」这一动作的目的是？","o":["了解学员前期学习情况","清晰报名动机","确定续报优惠折扣","排查风险学员"],"a":[0,1,3],"e":"扒轨迹三件事：了解学员前期学习、清晰报名动机、排查风险学员。C 错误：续报优惠政策解读是 L5 阶段的工作。","src":"课导工作流程"},{"t":"multi","q":"「打首通」要达成的目标包括？","o":["建立情感连接","促成家长当场续报缴费","介绍课程和服务","明确学期安排"],"a":[0,2,3],"e":"首通四目标：建立情感连接、介绍课程和服务、确认报名动机、明确学期安排。B 错误：首通在接班期，目的是建信任，续报转化是 L5 的任务。","src":"课导工作流程"},{"t":"multi","q":"「见面会」的目标包括？","o":["拉近师生关系","提升兴趣度","提高学员开课期待值","回扣直播课程模式"],"a":[0,1,2,3],"e":"见面会四目标：拉近师生关系、提升兴趣度、提高学员开课期待值、回扣直播课程模式。","src":"课导工作流程"},{"t":"multi","q":"「家长会」的目标包括？","o":["现场推进年课续报缴费","向家长同步规划","建立信任","明确预期"],"a":[1,2,3],"e":"家长会三目标：向家长同步规划、建立信任、明确预期。A 错误：正式续报在 L5 阶段（L5-2/L5-4），家长会只做规划同步与信任建立。","src":"课导工作流程"},{"t":"multi","q":"日常行课「开课后」的基础工作包括？","o":["课后反馈","课后作业批改","课前直播","错误作业反馈"],"a":[0,1,3],"e":"开课后三项：课后反馈、课后作业批改、错误作业反馈。C 错误：课前直播属于「开课前」环节。","src":"课导工作流程"},{"t":"multi","q":"L1 试学期的工作要点包括？","o":["开课前、开课中、开课后三大工作流程全流程覆盖","小灶课 L1 阶段全覆盖","硬件随材扣费规则提醒","流失预判"],"a":[0,1,2,3],"e":"L1 四大要点：三大工作流程走扎实（未回复家长必电话跟进）、小灶课全覆盖夯实学习意愿、硬件随材扣费规则提醒、流失预判。","src":"课导工作流程"},{"t":"multi","q":"L6 用户维稳阶段的重点动作包括？","o":["组织国赛 / 白名单赛事考试，冲刺高阶奖项","防退费，重点关注退费风险学员","跟进未续报学员追单","启动赛考规划电访"],"a":[0,1,2],"e":"L6 四大动作：国赛/白赛考试、防退费、追单、结课过渡。D 错误：赛考规划电访是 L2 阶段（L2-4 前）的动作。","src":"课导工作流程"},{"t":"multi","q":"课导工作的价值最终落到哪三个层面？","o":["对家长：孩子上课有人盯，进步看得见，家长认可愿意续报","对公司：完课率、续报率守住，获客来的孩子产生长期价值","对自己：续报率 = 绩效 + 晋升，回扣收入和履历","对投放团队：为渠道优化投放素材"],"a":[0,1,2],"e":"课导价值三层面：对家长、对公司、对自己，形成「服务好家长 → 续报 → 公司业绩稳 → 绩效晋升」的正循环。","src":"课导工作流程"},{"t":"judge","q":"图形化课导的带班周期为一个季度。","a":[1],"e":"带班周期为半年，不是 3 个月。","src":"课导工作流程"},{"t":"judge","q":"班级学员入学时大多已有扎实的 Scratch 基础，可以直接上进度较快的内容。","a":[1],"e":"用户特点：基本都【无】编程基础，需要课导做细致的入门引导和陪伴。","src":"课导工作流程"},{"t":"judge","q":"每个 LEVEL 为一个月课程、共 10 课时：第 1-3 周每周 1 次、一次 2 课时；第 4 周每周 2 次，周日增加赛考课或赛考直播课。","a":[0],"e":"这是每个 LEVEL 的固定节奏：3 次 × 2 课时 + 2 次 × 2 课时 = 10 课时。","src":"课导工作流程"},{"t":"judge","q":"「第 4 周每周 2 次、周日加赛考课或赛考直播课」的安排只适用于 L1 阶段，L2 起恢复每周一次。","a":[1],"e":"每个月（每个 LEVEL）都是这样的安排，L1 到 L6 全程按此节奏循环，不是只有 L1 加课。","src":"课导工作流程"},{"t":"judge","q":"第 4 周周日增加的课是续报预热直播课。","a":[1],"e":"第 4 周周日增加的是【赛考课或赛考直播课】（一次 2 课时）；续报预热电访是 L4 阶段的电访动作，不是加课。","src":"课导工作流程"},{"t":"judge","q":"接班期的核心目标是全力推进正式续报。","a":[1],"e":"接班期核心目标：防流失 + 建信任；正式续报是 L5 阶段（L5-2 / L5-4）的目标。","src":"课导工作流程"},{"t":"judge","q":"L1 阶段家长的状态是：已付费但尚未完全安心，会关注孩子适应度、课程价值与退费保障。","a":[0],"e":"这是七大阶段用户心理表对 L1 的描述，因此 L1 要「给家长吃定心丸」。","src":"课导工作流程"},{"t":"judge","q":"日常沟通反馈中，未回复的家长可以等家长主动联系，不必电话跟进。","a":[1],"e":"L1 明确「未回复家长必电话跟进」，确保家校沟通不断档。","src":"课导工作流程"},{"t":"judge","q":"赛考联报的启动节点是 L4-1 / L4-3。","a":[1],"e":"赛考联报节点是【L3-2 / L2-4】；L4-1 / L4-3 是【等考考试】的节点，两者易混。","src":"课导工作流程"},{"t":"judge","q":"等考考试安排在 L4-1 / L4-3。","a":[0],"e":"L4-1 / L4-3 参加等考，检验阶段学习成果，并向家长展示成果、增强续报信心。","src":"课导工作流程"},{"t":"judge","q":"L3 赛考履约阶段，考前应给家长「降预期」，而不是一味拉高期待。","a":[0],"e":"L3 赛考辅导三动作：赛前集中辅导、考前降预期、考后私信运营。","src":"课导工作流程"},{"t":"judge","q":"L6 阶段对未续报学员要跟进追单，争取最后转化机会。","a":[0],"e":"L6 核心目标：维稳 + 防退费追单；追单是争取最后转化机会的动作，同时做好结课过渡。","src":"课导工作流程"},{"t":"single","q":"首通电话对用户一侧的核心目的是？","o":["尽快推销年课续费","建立信任、传递课程价值、消除决策顾虑","通知开课时间即可","收集家长收入信息"],"a":[1],"e":"对用户侧核心：建立信任关系，清晰传递课程价值与服务优势，针对性解答用户对课程内容、学习效果及服务保障的疑问，消除决策顾虑。","src":"首通电话"},{"t":"single","q":"培训中提到首通的本质定位是？","o":["首通就是一次卖课","首通是催课提醒","首通是接住用户","首通是售后回访"],"a":[2],"e":"首通不是「卖课」，而是「接住用户」。用户已支付 4399、认可编程价值，核心任务是让家长相信：接下来 5-6 个月，能把孩子带好、把课教好。","src":"首通电话"},{"t":"single","q":"首通前准备工作的核心原则是？","o":["知己知彼","先声夺人","快问快答","少问多讲"],"a":[0],"e":"准备工作的核心原则是「知己知彼」——充分的前期准备，是高效沟通与信任建立的基石。","src":"首通电话"},{"t":"single","q":"接棒准备中查 UID 记录的主要目的是？","o":["核对手机号","查询核桃币余额","统计班级人数","了解家长怎么报进来的，警惕退费风险及报课需求"],"a":[3],"e":"接棒准备要求查 UID 记录，了解家长是怎么报进来的，注意警惕退费风险及家长报课需求；目标是给家长「前后衔接靠谱」的感觉。","src":"首通电话"},{"t":"single","q":"首通前对用户期许进行甄别归类，一共分为几大类？","o":["两类","四类","三类","五类"],"a":[2],"e":"用户期许分层共三大类：思维型、升学型、混合型。","src":"首通电话"},{"t":"single","q":"追求孩子快乐成长与可感知进步、需要趣味编程学习与托管服务的普娃属于哪一类？","o":["思维型","升学型","混合型","兴趣型"],"a":[0],"e":"思维型画像——普娃，追求孩子快乐成长与可感知进步，提供趣味编程学习与托管服务。注意区分：升学型是牛娃，混合型是既要又要的普娃。","src":"首通电话"},{"t":"single","q":"目标顶级竞赛成绩与特殊升学最优解、追求顶尖资源与效率的牛娃属于哪一类？","o":["思维型","混合型","竞赛型","升学型"],"a":[3],"e":"升学型画像——牛娃，目标顶级竞赛成绩与特殊升学最优解，追求顶尖资源与效率。","src":"首通电话"},{"t":"single","q":"兼顾兴趣与升学、需要可量化成果和升学希望证明的普娃属于哪一类？","o":["升学型","混合型","思维型","均衡型"],"a":[1],"e":"混合型画像——普娃，兼顾兴趣与升学，需可量化成果、行为改变及升学希望证明，也叫「既要又要」型。","src":"首通电话"},{"t":"single","q":"首通第一阶段的主题是？","o":["挖需·下切法","收尾·固化信任","破冰·立人设","事务确认"],"a":[2],"e":"首通框架三阶段：阶段一破冰·立人设 → 阶段二挖需·下切法 → 阶段三收尾·固化信任，全程贯穿「情绪饱满贯彻始终、人设建立形象饱满」。","src":"首通电话"},{"t":"single","q":"首通第二阶段的主题是？","o":["挖需·下切法","破冰·立人设","收尾·固化信任","事务确认"],"a":[0],"e":"阶段二是挖需·下切法，通过层层下切追问深挖关键细节，是整个首通中挖需求的核心环节，动作最多。","src":"首通电话"},{"t":"single","q":"首通第三阶段的主题是？","o":["破冰·立人设","挖需·下切法","事务确认","收尾·固化信任"],"a":[3],"e":"阶段三是收尾·固化信任：问注意事项（体验课问题改善）、硬件地址确认、固化信任，把首通效果沉淀下来。","src":"首通电话"},{"t":"single","q":"首通标准中，一次有效沟通的通话时长要求是？","o":["5 分钟以上","15 分钟以上","8 分钟以上","30 分钟以上"],"a":[1],"e":"有效沟通≥15 分钟——通话时长达到 15 分钟以上，才算一次成功沟通。","src":"首通电话"},{"t":"single","q":"信息完整加流程正确这条标准的量化指标是复原率不低于多少？","o":["60%","95%","85%","70%"],"a":[2],"e":"信息完整 + 流程正确：家长信息记录完整、按既定流程执行，复原率≥85%。","src":"首通电话"},{"t":"single","q":"首通中挖掘家长需求时应善用哪种提问方式？","o":["开放式提问","封闭式提问","连环反问","默认式提问"],"a":[0],"e":"核心原则是善用开放式提问、挖掘关键细节：避免封闭式「是/否」回答，通过开放式问题引导家长多维度表达，弥补信息差。例如问孩子之前接触过哪些编程内容、希望孩子在哪些方面获得提升。","src":"首通电话"},{"t":"multi","q":"首通的四大目标包括哪些？","o":["建立初步联系，构建信任基础","收集关键信息，精准挖掘真实需求","传递课程价值，塑造专业老师形象","锁定意向，有效推动下一步转化行动"],"a":[0,1,2,3],"e":"首通四大目标：建联系信任 → 收集信息挖需求 → 传递价值立形象 → 锁定意向促转化，环环相扣。","src":"首通电话"},{"t":"multi","q":"首通前的准备工作包括哪两个方面？","o":["复盘历史沟通轨迹","回顾家长反馈记录","当场给家长报价"],"a":[0,1],"e":"知己知彼：复盘历史沟通轨迹（明确沟通节点与意向线索）、回顾家长反馈记录（预判疑问顾虑）。C 错误——报价不是准备工作。","src":"首通电话"},{"t":"multi","q":"首通的三个优先级包括？","o":["立人设，树权威","报价格，催缴费","明确需求，给规划","识风险，做分层"],"a":[0,2,3],"e":"三个优先级：①立人设树权威——我是孩子接下来半年的辅导老师，懂孩子、很专业；②明确需求给规划——标出畏难的、学习有问题的、对课程质疑的、试试看的用户；③识风险做分层——了解孩子真实情况、家长付费动机和核心关注点。B 错误——首通不是卖课。","src":"首通电话"},{"t":"multi","q":"用户期许分层包括哪几大类？","o":["思维型","升学型","混合型","闲逛型"],"a":[0,1,2],"e":"三大类：思维型、升学型、混合型（既要又要）。每个用户的诉求各有不同，首通前要先甄别归类。","src":"首通电话"},{"t":"multi","q":"首通阶段一破冰·立人设的动作包括？","o":["表身份","锁定见面时间","夸表现","加微信"],"a":[0,2,3],"e":"阶段一破冰·立人设三动作：表身份、夸表现、加微信。B 错误——新框架收尾阶段做的是固化信任，锁定见面时间是旧框架的说法。","src":"首通电话"},{"t":"multi","q":"首通阶段二挖需·下切法的动作包括？","o":["聊时间安排和家长教育方向","办理退费流程","聊报名动机和挖风险因子","聊赛考规划和外化学习效果"],"a":[0,2,3],"e":"阶段二挖需·下切法六大动作：聊时间安排 + 家长教育方向、基于体验课表现告知辅导策略、聊报名动机 + 挖风险因子、上课节奏 + 首月建立信心、正向反馈 + 长远靠习惯坚持、告知上课设备 + 聊赛考规划 + 外化学习效果。B 错误——退费处理不是挖需环节的动作。","src":"首通电话"},{"t":"multi","q":"首通阶段三收尾·固化信任的动作包括？","o":["问注意事项，聚焦体验课问题改善","硬件地址确认","固化信任","现场售卖年课"],"a":[0,1,2],"e":"阶段三收尾·固化信任三动作：问注意事项（体验课问题改善）、硬件地址确认、固化信任。D 错误——首通不是卖课，收尾目标是固化信任而非推销。","src":"首通电话"},{"t":"multi","q":"首通阶段二挖需·下切法中，围绕建立信心的动作包括？","o":["上课节奏沟通，首月建立信心","基于体验课表现告知辅导策略","正向反馈，长远靠习惯坚持","硬件地址确认"],"a":[0,1,2],"e":"建立信心三动作：上课节奏 + 首月建立信心、基于体验课表现告知辅导策略、正向反馈 + 长远靠习惯坚持。D 错误——硬件地址确认是阶段三收尾的动作。","src":"首通电话"},{"t":"multi","q":"首通的四大核心标准包括？","o":["专业规范先行","需求深度挖掘","沟通高效简洁","传递服务温度"],"a":[0,1,2,3],"e":"四大核心标准：专业规范先行（标准话术、规范开场结束）、需求深度挖掘（开放式提问捕捉痛点）、沟通高效简洁（把控节奏、减少无效寒暄）、传递服务温度（热情亲切、关注情绪反馈）。","src":"首通电话"},{"t":"judge","q":"首通电话的本质是卖课，要在通话中尽快推销续报。","a":[1],"e":"首通不是「卖课」，而是「接住用户」。家长已付费认可编程价值，首通的核心是建立信任、收集信息、挖掘需求。","src":"首通电话"},{"t":"judge","q":"首通前应提前进入系统，了解家长及班主任基本情况、历史聊天记录。","a":[0],"e":"这是接棒准备中通话前必须完成的动作，目标是给家长核桃编程「前后衔接靠谱」的感觉。","src":"首通电话"},{"t":"judge","q":"查 UID 记录时需要警惕退费风险及家长报课需求。","a":[0],"e":"查 UID 是为了了解家长怎么报进来的，同时警惕退费风险、识别报课需求，为通话中的风险预判做准备。","src":"首通电话"},{"t":"judge","q":"用户分层中，混合型也被称为既要又要型。","a":[0],"e":"混合型即「既要又要」——普娃兼顾兴趣与升学，既要孩子学得开心，又要可量化成果和升学希望证明。","src":"首通电话"},{"t":"judge","q":"思维型用户的画像是牛娃，目标是顶级竞赛成绩。","a":[1],"e":"思维型是【普娃】，追求快乐成长与可感知进步；目标是顶级竞赛成绩与特殊升学最优解的【牛娃】是【升学型】，两者别混。","src":"首通电话"},{"t":"judge","q":"挖掘家长需求时，应避免封闭式的是否回答，多用开放式提问。","a":[0],"e":"封闭式提问只能得到是/否，开放式提问才能引导家长多维度表达、挖掘关键细节，弥补信息差。","src":"首通电话"},{"t":"judge","q":"通话时长达到 15 分钟以上才算一次有效沟通。","a":[0],"e":"首通 9 条要求之一：有效沟通≥15 分钟。时长不足说明信息收集和需求挖掘大概率不充分。","src":"首通电话"},{"t":"judge","q":"为了把控通话节奏，家长说话时可以适当打断。","a":[1],"e":"标准要求「不打断」——耐心听家长说完、不抢话，同时「多听家长说」，多引导家长表达，做互动式沟通而非单方面输出。","src":"首通电话"},{"t":"judge","q":"当天首通任务没打完，可以留到次日再完成。","a":[1],"e":"标准要求当日完成 100%——当天任务量全部完成，不留到次日。","src":"首通电话"},{"t":"judge","q":"首通全程要做到情绪饱满贯彻始终、人设建立形象饱满。","a":[0],"e":"这是贯穿首通全程的两大原则：情绪饱满 + 人设饱满，配合五阶段流程执行。","src":"首通电话"},{"t":"judge","q":"通话中话题偏离时，应该温柔拉回。","a":[0],"e":"关键控场技巧：开场定调明方向，话题偏离温柔拉回，适时总结防遗漏，主动结束显专业。","src":"首通电话"},{"t":"judge","q":"结束通话时应一直等家长先挂断，自己绝不主动结束。","a":[1],"e":"控场技巧要求「主动结束显专业」——掌握节奏，在沟通目标达成后自然收尾，而不是被动等待。","src":"首通电话"},{"t":"single","q":"低龄零基础孩子不直接学代码、先学图形化的原因是？","o":["图形化考试更容易通过","家长只认可图形化","图形化学费更便宜","直接学代码太枯燥，低龄零基础孩子易放弃"],"a":[3],"e":"低龄零基础直接学代码太枯燥、易放弃；图形化拖拽积木、成就感易获得，先培养兴趣和编程思维。同时国家重视编程教育、信息科技进课标、科特招生比例逐年扩大。","src":"课程体系"},{"t":"single","q":"三种编程语言中，信奥赛 CSP-J/S 唯一指定语言是？","o":["图形化","Python","C++","Scratch"],"a":[2],"e":"C++ 是竞赛语言、含金量最高——信奥赛（CSP-J/S）唯一指定语言，锻炼底层逻辑，升学加分硬通货。","src":"课程体系"},{"t":"single","q":"Python 相对图形化的定位是？","o":["代码入门、语法简单，从图形化平滑过渡","只做硬件控制","替代 C++ 参加信奥赛","竞赛专用语言"],"a":[0],"e":"Python 一句话特点：代码入门、语法简单——从图形化过渡到代码，语法简洁、应用广。","src":"课程体系"},{"t":"single","q":"思维线的价格与课时是？","o":["3299 元、48 课时","3299 元、60 课时","2699 元、48 课时","2699 元、60 课时"],"a":[2],"e":"思维线：优惠后 2699 元/阶段、48 课时（42 软编 + 6 硬编）、1 年 3 张证书。注意与科特线 3299 元、60 课时区分。","src":"课程体系"},{"t":"single","q":"科特线的价格与课时是？","o":["3299 元、48 课时","4199 元、60 课时","2699 元、48 课时","3299 元、60 课时"],"a":[3],"e":"科特线：优惠后 3299 元/阶段、60 课时（30 软编 + 12 硬编 + 12 赛事课 + 6 赛事直播）、1 年 4 张证书——科特线赛事更重。4199 是后续科特 Python 的价格。","src":"课程体系"},{"t":"single","q":"科特线 60 课时的构成是？","o":["30 软编 + 12 硬编 + 12 赛事课 + 6 赛事直播","36 软编 + 8 硬编 + 4 赛事 + 12 赛事直播","48 软编 + 12 硬编","42 软编 + 6 硬编"],"a":[0],"e":"科特线每阶段：30 课时软编课 + 12 课时硬编课 + 12 课时赛事课 + 6 课时赛事直播课 = 60 课时。A 是思维线构成，C 是科特 Python 的构成。","src":"课程体系"},{"t":"single","q":"思维线 48 课时的构成是？","o":["42 软编 + 6 赛事直播","36 软编 + 12 硬编","30 软编 + 12 硬编 + 6 赛事","42 软编 + 6 硬编"],"a":[3],"e":"思维线每阶段：42 课时软编课 + 6 课时硬编课 = 48 课时。注意思维线没有赛事直播课的独立课时构成。","src":"课程体系"},{"t":"single","q":"思维线学 1 年可拿到几张国家级证书？","o":["6 张","2 张","3 张","4 张"],"a":[2],"e":"思维线学 1 年 3 张国家级证书（含半年 YCL1 级水平）。科特线才是学 1 年 4 张。","src":"课程体系"},{"t":"single","q":"科特线学 1 年可拿到几张国家级证书？","o":["4 张","5 张","6 张","3 张"],"a":[0],"e":"科特线学 1 年具备 4 张国家级证书竞赛水平——科特线赛事更重，这也是两条线的核心差异。","src":"课程体系"},{"t":"single","q":"科特线后续衔接路径正确的是？","o":["Python → 图形化 → C++","图形化 → 科特 Python → C++","C++ → Python → 图形化","图形化 → C++ → Python"],"a":[1],"e":"后续衔接：图形化（3299 元，2 个阶段共 1 年）→ 科特 Python（4199 元，2 个阶段共 1 年）→ C++（4399 元，6 个阶段共 3 年）。","src":"课程体系"},{"t":"single","q":"与家长沟通课程名称时的统一规范是？","o":["统一说图形化、Python、C++，不主动区分趣味 C++/常规 C++","只说课程代号不说话术名","按孩子水平随口称呼","主动介绍趣味 C++ 和常规 C++ 的区别"],"a":[0],"e":"必背规则：与家长沟通统一说「图形化」「Python」「C++」，不主动区分趣味 C++/常规 C++；课导不主动提及两者区别。","src":"课程体系"},{"t":"single","q":"家长主动提出跨级/跨线时，课导的正确做法是？","o":["直接答应家长要求","婉拒并让家长找班主任","第一时间报备组长，根据需求判断是否需要调整","让家长自行联系客服"],"a":[2],"e":"必背规则：家长主动提出跨级/跨线，第一时间报备组长，根据需求判断是否需要调整——不能私自答应也不能直接回绝。","src":"课程体系"},{"t":"single","q":"三大支柱指的是？","o":["愿意学、学得会、额外价值","课程模式、因材施教、学练考一体","直播、实操、监课","剧情闯关、金币激励、软硬件结合"],"a":[1],"e":"三大支柱（决定课程专业高度）：课程模式（直播+实操+实时监课）、因材施教（分支关卡+课前自动复习）、学练考一体（对标真实赛考题型）。A 是三层保障。","src":"课程体系"},{"t":"single","q":"三层保障指的是？","o":["课程模式、因材施教、学练考一体","直播、实操、硬件","愿意学、学得会、额外价值","共情、归因、亮方案"],"a":[2],"e":"三层保障（决定学习效果）：①愿意学（剧情闯关+金币激励+软硬件结合）②学得会（60 分钟科学时间轴+专注力训练）③额外价值（科普+校内学科结合+英语跟读）。","src":"课程体系"},{"t":"single","q":"每次 60 分钟课的时间轴设计中，0-5 分钟的环节是？","o":["实操练习","总结跟读","新知讲解","课前复习"],"a":[3],"e":"60 分钟时间轴：0-5 分钟课前复习（自动推送上节课重点）→ 5-20 分钟新知讲解 → 20-45 分钟实操练习 → 45-55 分钟关卡挑战 → 55-60 分钟总结跟读。","src":"课程体系"},{"t":"single","q":"家长异议应答的四步万能框架顺序是？","o":["共情/认同 → 归因/转观点 → 亮方案/亮证据 → 给信心/给效果","亮方案 → 共情 → 给信心 → 归因","归因 → 亮方案 → 共情 → 给效果","给信心 → 共情 → 亮证据 → 转观点"],"a":[0],"e":"四步万能框架：①共情/认同 → ②归因/转观点 → ③亮方案/亮证据 → ④给信心/给效果。顺序不能乱，先接住情绪再给方案。","src":"课程体系"},{"t":"multi","q":"课程模式的三大组成包括？","o":["直播课","实操课","实时跟课","线下游园会"],"a":[0,1,2],"e":"课程模式 = 直播 + 实操 + 实时跟课：直播课含课前直播和赛考直播；实操课以闯关形式边学边练；实时跟课即实时监课+视频/语音/文字连麦。","src":"课程体系"},{"t":"multi","q":"因材施教的体现包括？","o":["学得快触发隐藏关卡拔高","学得慢薄弱知识点多次练习","忘了自动回放，剧情中设置回顾环节","全班统一进度统一关卡"],"a":[0,1,2],"e":"因材施教 = 分支关卡 + 课前自动复习：每个孩子的关卡都不一样。D 错误——统一进度恰恰违背因材施教。","src":"课程体系"},{"t":"multi","q":"三层保障中「愿意学」依靠哪些设计？","o":["剧情闯关","金币激励","软硬件结合","学费打折促销"],"a":[0,1,2],"e":"愿意学三件套：剧情闯关（每次课是侦探剧情，写代码就是找线索）+ 金币激励（解锁隐藏关卡、排行榜）+ 软硬件结合（每阶段 6 次硬件课）。D 错误——打折不是课程设计。","src":"课程体系"},{"t":"multi","q":"三层保障中「额外价值」包括？","o":["科普知识","校内学科结合","英语跟读","赠送实体教材"],"a":[0,1,2],"e":"额外价值三件套：科普知识（每次课融入科普小知识）、校内学科结合（编程题打通校内知识，报一门顶两门）、英语跟读（为读英文文档打基础）。","src":"课程体系"},{"t":"multi","q":"关于思维线与科特线的对比，正确的有？","o":["思维线优惠后 2699 元/阶段，科特线 3299 元/阶段","思维线 48 课时，科特线 60 课时","两条线周期都是共 2 个阶段","科特线赛事更轻，不用参加赛考"],"a":[0,1,2],"e":"D 错误——科特线赛事更重（12 课时赛事课 + 6 课时赛事直播），学 1 年 4 张证书，正是与思维线（3 张证书）的核心差异。","src":"课程体系"},{"t":"multi","q":"短期集训营包括哪些？","o":["小核桃营","语法速通班","算法提优班","CSP-J 满分班、CSP-S 满分班"],"a":[0,1,2,3],"e":"五大短期集训营：小核桃营（SC/PY/QC，三四年级）、语法速通班（QC1/QC2，四年级以上）、算法提优班（L3-L6）、CSP-J 满分班（需测试）、CSP-S 满分班——集中冲刺、快速提升。","src":"课程体系"},{"t":"multi","q":"60 分钟时间轴中的环节包括？","o":["课前复习","新知讲解","实操练习","关卡挑战+ 总结跟读"],"a":[0,1,2,3],"e":"五段式时间轴：课前复习 0-5 分钟 → 新知讲解 5-20 分钟 → 实操练习 20-45 分钟 → 关卡挑战 45-55 分钟（赛考题型当堂检验）→ 总结跟读 55-60 分钟，符合孩子注意力曲线。","src":"课程体系"},{"t":"multi","q":"家长问「孩子学不会怎么办」，四步应答要点包括？","o":["共情：普遍问题，不是孩子的错","找问题：90% 不是智商，是方法和专注力","亮方案：四重保障","给信心：零基础孩子都能学会"],"a":[0,1,2,3],"e":"四步框架应用：共情（普遍问题，不是孩子的错）→ 找问题（90% 不是智商，是方法和专注力）→ 亮方案（四重保障：课程模式+因材施教+学练考+时间轴）→ 给信心（零基础孩子都能学会）。","src":"课程体系"},{"t":"multi","q":"家长问「专注力差能学吗」，亮方案环节用到的四个手段是？","o":["强互动","监课","剧情闯关","时间轴"],"a":[0,1,2,3],"e":"专注力问题四手段：强互动（直播每 3-5 分钟一次提问连麦）、监课（实时看屏幕，发现摸鱼立刻提醒）、剧情闯关（侦探故事想知道结局）、时间轴（每 15 分钟一个节奏变化）。","src":"课程体系"},{"t":"multi","q":"核桃的愿景与好课程的标准包括？","o":["愿景：让每个孩子爱学习、会学习，让优质的教育触手可及","好的课程：让孩子愿意学、学得会","把枯燥的代码，变成孩子愿意玩的游戏","三大支柱决定专业高度，三层保障决定学习效果"],"a":[0,1,2,3],"e":"这是课程体系的记忆框架：愿景 + 好课程标准 + 三大支柱/三层保障的分工。","src":"课程体系"},{"t":"judge","q":"学练考一体的含义是：学什么 → 练什么 → 考什么，全程对标真实赛考题型。","a":[0],"e":"学练考一体是三大支柱之一，考的题型就是真实赛考的选择题、编程题。","src":"课程体系"},{"t":"judge","q":"思维线和科特线的学生定位不同，科特线只面向牛娃。","a":[1],"e":"两条线都面向大众学员，区别在课时构成与赛考规划，不是学生门槛。","src":"课程体系"},{"t":"judge","q":"科特线学习节奏：每个月都是前三周每周 1 次课、一次 2 课时，第四周加课，半年上完 6 个 LEVEL。","a":[0],"e":"科特线共 6 个 LEVEL 半年上完，每月固定节奏：前三周每周 1 次，第四周加密（周日加赛考课/赛事直播课），与带班口径一致。","src":"课程体系"},{"t":"judge","q":"图形化学完后可衔接科特 Python，价格 4199 元，2 个阶段共 1 年。","a":[0],"e":"衔接路径：图形化（3299，2 阶段 1 年）→ 科特 Python（4199，2 阶段 1 年）→ C++（4399，6 阶段 3 年）。","src":"课程体系"},{"t":"judge","q":"C++ 课程分趣味 C++ 和常规 C++，价格不同，要与家长讲清楚区别。","a":[1],"e":"两者都是 4399 元；规范要求课导【不主动】与用户提及趣味 C++ 和常规 C++ 区别，沟通时统一说 C++。","src":"课程体系"},{"t":"judge","q":"学得快的孩子在课程中可以触发隐藏关卡拔高。","a":[0],"e":"因材施教的分支关卡设计：学得快触发隐藏关卡拔高，学得慢薄弱知识点多次练习，每个孩子的关卡都不一样。","src":"课程体系"},{"t":"judge","q":"60 分钟时间轴的设计依据是孩子的注意力曲线：前 5 分钟唤醒、中间高专注学练、最后 5 分钟收束。","a":[0],"e":"时间轴符合孩子注意力曲线，配合专注力训练，这是「学得会」保障的核心。","src":"课程体系"},{"t":"judge","q":"实操课以闯关形式边学边练，老师实时监课，孩子卡壳即介入。","a":[0],"e":"课程模式中实操课的设计：闯关形式边学边练 + 实时监课，20-45 分钟实操环节老师卡壳即介入。","src":"课程体系"},{"t":"judge","q":"家长说「全是动画太简单」时，第一步应该澄清动画只是外壳。","a":[1],"e":"这一问的第一步是【认同】——动画是特点，目的是让孩子愿意学；第二步才澄清（动画只是外壳，内容有深度）。先接住再纠正，顺序不能乱。","src":"课程体系"},{"t":"judge","q":"编程题跟校内知识打通，数学思维和编程能力互相促进，家长会觉得报一门顶两门。","a":[0],"e":"这是「额外价值」中校内学科结合的卖点表述，与科普知识、英语跟读共同构成额外价值。","src":"课程体系"},{"t":"judge","q":"每次 60 分钟课的最后 5 分钟环节是布置考试通知。","a":[1],"e":"55-60 分钟是总结跟读：知识点总结、英语词汇跟读、布置作业，不是考试通知。","src":"课程体系"},{"t":"judge","q":"短期集训营的定位是替代长期班，学集训营就不用上长期课了。","a":[1],"e":"短期集训营是「不止有长期班」的补充——集中冲刺、快速提升，与长期班是搭配关系，不是替代关系。","src":"课程体系"},{"t":"single","q":"开直播建立老师感，是为了让家长和孩子感受到什么？","o":["真实的老师在教学","课件制作精美","公司规模大","优惠力度大"],"a":[0],"e":"老师感——让家长和孩子感受到真实的老师在教学；配合服务感（即时答疑、关注每个孩子）和用户粘性（定期直播形成习惯与情感连接）。","src":"直播基本功"},{"t":"single","q":"从市场维度看，直播是最直观的什么？","o":["招生广告投放渠道","教学成果展示，优质片段还能作为宣传素材带动转介绍","替代电话回访的工具","降低运营成本的手段"],"a":[1],"e":"市场方面，直播是最直观的教学成果展示，家长能看到孩子的表现，优质片段还能作为宣传素材带动转介绍。","src":"直播基本功"},{"t":"single","q":"现在的市场模式下，录播课和直播课普遍存在的问题是？","o":["录播课太贵，直播课太便宜","录播课和直播课内容完全一样","录播课看得多练得少，直播课听得多会得少","录播课和直播课都没有互动"],"a":[2],"e":"现在的市场模式：录播课——看得多、练得少；直播课——听得多、会得少。这正是我们要用莫顿实操课 + 直播去解决的痛点。","src":"直播基本功"},{"t":"single","q":"我们的课程模式中，唯一一家指的是？","o":["唯一一家纯直播课程","唯一一家录播课程","唯一一家莫顿实操课程","唯一一家免费课程"],"a":[2],"e":"我们的课程模式——唯一一家莫顿实操课程，莫顿实操课 + 直播，边学边练更有结果。","src":"直播基本功"},{"t":"single","q":"见面会直播的直播节点、面向对象和核心目标是？","o":["开课前、孩子、孩子喜欢","开课前、家长、家长信任","每次课前、孩子、孩子喜欢","根据运营节奏、孩子、个性辅导"],"a":[0],"e":"见面会：开课前，面向孩子，核心目标是孩子喜欢，氛围轻松愉快。","src":"直播基本功"},{"t":"single","q":"家长会直播的核心目标是？","o":["个性辅导","家长信任","设备调试","孩子喜欢"],"a":[1],"e":"家长会：开课前，面向家长，核心目标是家长信任，氛围要专业负责。","src":"直播基本功"},{"t":"single","q":"课前直播的直播节点是？","o":["开课前一次性","每次课前","根据运营节奏","期中期末"],"a":[1],"e":"课前直播：每次课前，面向孩子，核心目标是孩子喜欢，氛围轻松。注意与见面会（开课前）区分。","src":"直播基本功"},{"t":"single","q":"小灶课的核心目标是？","o":["赛考动员","孩子喜欢","家长信任","个性辅导"],"a":[3],"e":"小灶课：根据运营节奏安排，面向孩子，核心目标是个性辅导，氛围要专业有趣。","src":"直播基本功"},{"t":"single","q":"面向孩子的小灶课，直播氛围的要求是？","o":["轻松愉快","专业负责","专业有趣","严肃认真"],"a":[2],"e":"小灶课氛围：专业有趣。对比记忆——见面会轻松愉快、家长会专业负责、课前直播氛围轻松、小灶课专业有趣。","src":"直播基本功"},{"t":"single","q":"坐姿的镜头位置要求，摄像头与眼睛的关系是？","o":["越低越好，显脸小","高于头顶","随意摆放","与眼睛平齐或略高"],"a":[3],"e":"镜头位置要求：摄像头与眼睛平齐或略高，配合九宫格构图、肩膀完整露出、头顶保留适当留白。","src":"直播基本功"},{"t":"single","q":"正确手势的高度与脸部关系是？","o":["挡住半张脸突出手部","与耳齐平，不挡脸，完整展示","高过头顶才有感染力","低于桌面更自然"],"a":[1],"e":"手势要与耳齐平、不挡脸、完整展示，手势自然、有节奏、配合讲解，幅度可以大。","src":"直播基本功"},{"t":"single","q":"衣服颜色与背景的关系要求是？","o":["颜色与背景有明显区别","颜色与背景完全一致","必须穿纯黑色","必须穿公司制服"],"a":[0],"e":"仪容仪表之衣着得体：衣服颜色与背景有明显区别，符合教师职业形象；想更好可以淡妆、穿符合孩子喜好的穿搭。","src":"直播基本功"},{"t":"multi","q":"开直播的核心价值包括哪些？","o":["强化老师形象 + 个性化服务","增强学员粘性","市场维度：教学成果展示、带动转介绍","课程维度：提升参与度、实时反馈调整节奏"],"a":[0,1,2,3],"e":"开直播价值两维度：用户侧（老师感、服务感、粘性）+ 市场与课程侧（成果展示转介绍、互动提升参与度、实时反馈调节奏、动态演示助理解）。","src":"直播基本功"},{"t":"multi","q":"以下哪些属于常见直播场景？","o":["见面会","家长会","课前直播","小灶课"],"a":[0,1,2,3],"e":"四种常见直播场景：见面会、家长会、课前直播、小灶课。每种场景的节点、对象、目标、氛围各有侧重。","src":"直播基本功"},{"t":"multi","q":"关于四种直播场景的节点与面向对象，正确的有？","o":["见面会：开课前，面向孩子","家长会：开课前，面向家长","课前直播：每次课前，面向孩子","小灶课：根据运营节奏，面向孩子"],"a":[0,1,2,3],"e":"场景表四行完整对照。判断场景先看面向谁（孩子还是家长），再看什么节点（开课前/每次课前/运营节奏）。","src":"直播基本功"},{"t":"multi","q":"关于四种直播场景的核心目标与氛围，正确的有？","o":["见面会——孩子喜欢——轻松愉快","家长会——家长信任——专业负责","课前直播——孩子喜欢——氛围轻松","小灶课——个性辅导——专业有趣"],"a":[0,1,2,3],"e":"四组目标与氛围一一对应，不能混搭：给孩子的场景氛围偏轻松有趣，给家长的场景氛围偏专业负责。","src":"直播基本功"},{"t":"multi","q":"坐姿的镜头位置要求包括？","o":["九宫格构图","肩膀完整露出画面","头顶保留适当留白","摄像头与眼睛平齐或略高"],"a":[0,1,2,3],"e":"镜头位置四要求：九宫格构图、肩膀完整露出画面、头顶保留适当留白、摄像头与眼睛平齐或略高。","src":"直播基本功"},{"t":"multi","q":"坐姿状态的要求包括？","o":["挺胸抬头，腰背挺直","不跷二郎腿","坐稳，不前后左右乱晃","身体微微前倾，表现专注"],"a":[0,1,2,3],"e":"坐姿状态四要求：挺胸抬头腰背挺直、不跷二郎腿、坐稳不乱晃、身体微微前倾表现专注。","src":"直播基本功"},{"t":"multi","q":"以下哪些属于正确手势？","o":["鼓掌、打招呼","比数字、点赞、OK、比心","手势自然、有节奏、配合讲解","竖中指、摇手指"],"a":[0,1,2],"e":"正确手势：鼓掌、打招呼、比数字、点赞、OK、比心，要自然有节奏配合讲解，幅度可以大。D 错误——竖中指、摇手指是明确的错误手势。","src":"直播基本功"},{"t":"multi","q":"以下哪些属于直播中的错误手势？","o":["竖中指、摇手指、出小拇指","拇指朝下","抓耳挠腮、抠鼻","长时间无意义手势、中指扶镜框"],"a":[0,1,2,3],"e":"错误手势四类：竖中指/摇手指/出小拇指、拇指朝下、抓耳挠腮抠鼻、长时间无意义手势和中指扶镜框——这些都是不专业动作，直播中要避免。","src":"直播基本功"},{"t":"judge","q":"直播互动可以提升孩子参与度，实时反馈能帮助调整教学节奏。","a":[0],"e":"课程维度价值：直播互动提升参与度，实时反馈帮助调整教学节奏，动态演示让知识更易理解，最终提升学习效果和续报意愿。","src":"直播基本功"},{"t":"judge","q":"定期直播能形成习惯和情感连接，增强学员粘性。","a":[0],"e":"用户粘性来自定期直播形成的习惯和情感连接，这是开直播的核心价值之一。","src":"直播基本功"},{"t":"judge","q":"莫顿实操课加直播的模式，能让孩子边学边练更有结果。","a":[0],"e":"我们的课程模式——唯一一家莫顿实操课程；莫顿实操课 + 直播，边学边练更有结果，还配实操演练、现场纠错、现场巩固、直播巩固。","src":"直播基本功"},{"t":"judge","q":"见面会是开课前面向家长开展的直播。","a":[1],"e":"见面会面向的是【孩子】，核心目标是孩子喜欢、氛围轻松愉快；面向家长的开课前直播是家长会。","src":"直播基本功"},{"t":"judge","q":"家长会直播的氛围要求是轻松愉快，跟见面会一样。","a":[1],"e":"家长会氛围要求【专业负责】（面向家长、目标家长信任）；轻松愉快是见面会的氛围要求，两者不能混。","src":"直播基本功"},{"t":"judge","q":"课前直播每次课前都要开展，面向孩子。","a":[0],"e":"课前直播：每次课前，面向孩子，核心目标孩子喜欢，氛围轻松。","src":"直播基本功"},{"t":"judge","q":"坐姿允许跷二郎腿，只要上半身挺直就行。","a":[1],"e":"坐姿明确要求【不跷二郎腿】；要挺胸抬头、腰背挺直、坐稳不乱晃、身体微微前倾。","src":"直播基本功"},{"t":"judge","q":"直播时身体可以微微前倾，表现专注和投入。","a":[0],"e":"身体微微前倾是坐姿状态的要求之一，向屏幕前的孩子传递专注和投入的信号。","src":"直播基本功"},{"t":"judge","q":"为了更有亲和力，直播时可以偶尔比划拇指朝下的手势活跃气氛。","a":[1],"e":"拇指朝下属于明确禁止的错误手势；正确手势是点赞（拇指朝上）、OK、比心等正向手势。","src":"直播基本功"},{"t":"judge","q":"淡妆、符合孩子喜好的穿搭、可爱发箍、道具眼镜，都可以增加孩子的好感度。","a":[0],"e":"这是仪容仪表页的小 tips：淡妆、符合孩子喜好的穿搭、可爱发箍、道具眼镜都可以增加孩子好感度。","src":"直播基本功"},{"t":"single","q":"我国编程教育起步的时间是？","o":["2010 年","2015 年","2017 年","2020 年"],"a":[2],"e":"我国 2017 年才开始有编程教育；经教育部不断修订，编程学科已成为至关重要的科目，孩子是要考的。","src":"异议处理与编程价值"},{"t":"single","q":"2022 年新课标改革将编程正式开设为？","o":["校本课程","选修兴趣课","独立科目","课外活动"],"a":[2],"e":"2022 年「新课标」改革将编程正式开设为独立科目；新课标就是新的课程标准，10 年修改一次，最近一次是 2022 年。","src":"异议处理与编程价值"},{"t":"single","q":"新课标多少年修改一次？","o":["15 年","5 年","8 年","10 年"],"a":[3],"e":"新课标即新的课程标准，10 年修改一次，最近一次是 2022 年。新课标将信息科技纳为独立学科，意味着信息科技现在和语数外同等重要。","src":"异议处理与编程价值"},{"t":"single","q":"科技特长生政策的覆盖率是？","o":["覆盖 22 个省份、4 个自治区、4 个直辖市，超过 88%","覆盖 25 个省份，超过 75%","全国 100% 覆盖","覆盖 18 个省份，超过 60%"],"a":[0],"e":"科技特长生已覆盖 22 个省份、4 个自治区、4 个直辖市，覆盖率超过 88%；2024 年全面取消艺术特长生，科技特长生成为新赛道。","src":"异议处理与编程价值"},{"t":"single","q":"强基计划是从哪一年开始的？","o":["2019 年","2020 年","2022 年","2017 年"],"a":[1],"e":"2020 年取消自主招生、新增「强基计划」。强基计划自 2020 年开始，稳坐清北第二大升学通道。","src":"异议处理与编程价值"},{"t":"single","q":"强基计划的录取公式是？","o":["70% 高考 + 30% 校测","50% 高考 + 50% 校测","仅看校测","85% 高考 + 15% 校测"],"a":[3],"e":"强基计划评价方式为 85% 高考 + 15% 校测；对比自主招生的「降分录取」。","src":"异议处理与编程价值"},{"t":"single","q":"去年通过强基计划进入清华、北大的占比分别是？","o":["清华 30%、北大 35%","清华 26%、北大 26%","清华 20%、北大 25%","清华 26%、北大 29%"],"a":[3],"e":"强基计划稳坐清北第二大升学通道——去年通过强基进入清华的占比 26%、进入北大的占比 29%。","src":"异议处理与编程价值"},{"t":"single","q":"关于自主招生与强基计划，下列说法正确的是？","o":["自主招生 2020 年取消，定位「选拔」拔尖创新人才，覆盖 90 所高校","强基计划定位「选拔」，覆盖 90 所高校","自主招生名额没有限制","强基计划全国统一竞争"],"a":[0],"e":"自主招生（2020 年取消）定位「选拔」拔尖创新人才，参与高校 90 所（含 87 所 211），严控名额 5%，降分录取；强基计划定位「培养」，39 所（全部 985），本省竞争，名额无限制，小班制导师制本硕博培养。","src":"异议处理与编程价值"},{"t":"single","q":"小升初简历中起关键作用的是？","o":["户口所在地","家庭收入情况","获奖情况","幼儿园经历"],"a":[2],"e":"小升初大多通过提交简历择校（择校或摇号），简历中的「获奖情况」是关键——有奖项比没奖项录取几率更大。","src":"异议处理与编程价值"},{"t":"single","q":"一句话向家长说明学编程的升学价值是？","o":["学编程就能保证考上清华北大","学编程能帮孩子多一条进重点的路，分数不够时，特长能补","学编程可以免除中考","学编程就能直接认定科技特长生"],"a":[1],"e":"给家长的一句话：学编程能帮孩子多一条进重点的路，分数不够时，特长能补。不能用保证升学类表述。","src":"异议处理与编程价值"},{"t":"single","q":"图形化编程语言的特点是？","o":["需要英语基础和键盘操作","只需拼接代码、有颜色区分，不需要英语基础","代码行数最多","难度最高"],"a":[1],"e":"三大语言直观区别：图形化只需拼接代码、有颜色区分，不需要英语基础；Python 语法简洁但需要一定英文基础；C++ 代码行数更多、难度更高。","src":"异议处理与编程价值"},{"t":"single","q":"按语言选择建议，5 岁至 2 年级及以下的孩子适合学？","o":["Scratch 图形化，无需编程基础，入门容易","Python","C++","趣味 C++"],"a":[0],"e":"语言选择表：Scratch 图形化——无需编程基础、无关英文单词/键盘操作/大量语句记忆，入门容易，适用 5 岁-2 年级及以下；Python 3-6 年级；趣味 C++ 3-6 年级；C++ 要求较高英文水平和扎实编程基础，适用 7 年级及以上。","src":"异议处理与编程价值"},{"t":"single","q":"为什么学少儿编程的内部因素不包括？","o":["培养习惯","编程思维","提升学科","替代校内主课"],"a":[3],"e":"为什么学编程总框架——外部因素：时代背景、国家政策；内部因素：培养习惯、编程思维、提升学科。编程是辅助校内学科，不能替代主课。","src":"异议处理与编程价值"},{"t":"multi","q":"为什么学习少儿编程的内部因素包括哪三大方面？","o":["培养习惯","编程思维","提升学科","快速赚钱"],"a":[0,1,2],"e":"内部因素三方面：培养习惯（专注力等）、编程思维（分解等四步）、提升学科（数学/语文/英语）。外部因素是时代背景与国家政策。","src":"异议处理与编程价值"},{"t":"multi","q":"编程学习「培养习惯」具体包括？","o":["提高专注力","改善粗心马虎","增强自制力","减少畏难情绪"],"a":[0,1,2,3],"e":"培养习惯四项：提高专注力、改善粗心马虎、增强自制力、减少畏难情绪。","src":"异议处理与编程价值"},{"t":"multi","q":"编程学习「提升学科」具体包括？","o":["提高阅读和写作能力","关联数学学科知识点","知识点对标新课标","提高英语学科兴趣"],"a":[0,1,2,3],"e":"提升学科四项：提高阅读和写作能力、关联数学学科知识点、知识点对标新课标、提高英语学科兴趣。","src":"异议处理与编程价值"},{"t":"multi","q":"科技特长生的招生项目包括？","o":["机器人","计算机编程","信息学奥赛","声乐舞蹈"],"a":[0,1,2],"e":"科技特长生项目包括机器人、计算机编程、信息学奥赛等，主要考查科学兴趣、科学素养和动手实践；2024 年艺术特长生已全面取消。","src":"异议处理与编程价值"},{"t":"judge","q":"2024 年国家全面取消艺术特长生，科技特长生成为新赛道。","a":[0],"e":"2024 年全面取消艺术特长生，科技特长生成为新赛道——这是和家长沟通编程升学价值的重要政策依据。","src":"异议处理与编程价值"},{"t":"judge","q":"新课标将信息科技纳为独立学科，意味着信息科技现在和语数外同等重要。","a":[0],"e":"新课标解读：将信息科技纳入为独立学科，意味着信息科技现在和语数外同等重要。","src":"异议处理与编程价值"},{"t":"judge","q":"科技特长生初升高可参与重点学校特殊招生通道申报，同等条件下升入重点高中机率大大提升。","a":[0],"e":"科技特长生在初升高阶段可参与重点学校特殊招生通道申报，同等条件下升入重点高中机率大大提升。","src":"异议处理与编程价值"},{"t":"judge","q":"强基计划的录取批次比国家专项、国防生都早。","a":[0],"e":"强基计划录取批次最早（如今年 7 月 5 日），比国家专项、国防生等都早。","src":"异议处理与编程价值"},{"t":"judge","q":"现在奥数、英语竞赛受限，而教育部白名单竞赛中编程类项目占比很高，孩子通过编程拿省级以上奖项的机会比其他类别大得多。","a":[0],"e":"小升初逻辑：奥数、英语竞赛受限，白名单竞赛中编程类项目占比很高，通过编程参加权威竞赛拿省级以上奖项的机会比其他类别大得多。","src":"异议处理与编程价值"},{"t":"judge","q":"C++ 适合 3-6 年级的孩子作为编程入门语言。","a":[1],"e":"C++ 要求较高英文水平和扎实编程基础（如数据结构、算法），适用 7 年级及以上；3-6 年级对应 Python 和趣味 C++。","src":"异议处理与编程价值"},{"t":"single","q":"L1 试学期设计的初衷是？","o":["体现产品信心、给家长灵活选择空间、降低决策门槛","为了筛选优质学员","为了延长服务周期","为了降低课程价格"],"a":[0],"e":"试学期设计初衷：体现产品信心、给家长灵活选择空间、降低决策门槛；但首月也是退费风险最集中的窗口期，家长会「零成本」全面考察。","src":"异议处理与编程价值"},{"t":"single","q":"试学期家长可以全额退课时费的范围是？","o":["前四次课","前 10 课时","前两个月","全程随时"],"a":[1],"e":"L1 试学期前 10 课时全额退课时费；PPT 口径为前四次课全额退课时费（1 个月试学期），退费核算表标准为「L1 试学期：全额退课时费（前 10 课时）」。","src":"异议处理与编程价值"},{"t":"single","q":"首月最高风险的信号是？","o":["孩子提前交作业","孩子上课积极提问","课后反馈消息不回复","家长主动问进度"],"a":[2],"e":"课后反馈消息不回复是首月最高风险信号，必须多频次触达、立即电话建立沟通。","src":"异议处理与编程价值"},{"t":"single","q":"扒轨迹时危险程度最高的报名时间节点是？","o":["开卖首日报名","直播中途报名","追单期报名","提前预约报名"],"a":[2],"e":"报名时间节点风险：追单期报名危险程度最高，危险程度依次上升，报名越晚（直播结束后被「硬盘」进班）风险越高。","src":"异议处理与编程价值"},{"t":"single","q":"家长长期不回复消息时，提高回复率的技巧是？","o":["以疑问句结尾追问","群发优惠信息","停止联系等家长主动","连环拨打语音通话"],"a":[0],"e":"Tip2：家长长期不回复消息时，以疑问句结尾追问提高回复率，避免陈述句结尾。","src":"异议处理与编程价值"},{"t":"single","q":"哪个时间节点下单的家长退费风险最高？","o":["见面会后","追单期最后下单","提前批下单","开卖首日"],"a":[1],"e":"Tip1：追单期（最后）下单的家长风险最高——临时冲动报名、缺乏深入了解，重点核查订单支付时间点，越晚下单 = 退费概率越高。","src":"异议处理与编程价值"},{"t":"single","q":"编程学习每周占用的平均时长是？","o":["不超过 60 分钟","不超过 120 分钟","3 小时以上","不超过 30 分钟"],"a":[0],"e":"核心价值传递话术：编程学习每周占用的平均时长不超过 60 分钟，不会额外占用孩子大量时间，还能提升逻辑思维能力，反哺校内学科学习效率。","src":"异议处理与编程价值"},{"t":"single","q":"家长提出「时间太长」异议时，灵活调整上课方案可以怎么做？","o":["直接停课一个月","将完整课程拆分为两个独立课时，约定固定时段分次学习","换成录播课","减半课时数"],"a":[1],"e":"灵活调整方案：将完整课程拆分为两个独立课时（如周四周五或周四周六 19 点固定时段分次学习）；课程自带护眼模式，每半小时播放护眼视频 + 5 分钟远眺放松。","src":"异议处理与编程价值"},{"t":"single","q":"L2 开始后退费的核算标准是？","o":["退一半","全额退课时费","按已上课时比例扣除","一概不退"],"a":[2],"e":"退费核算三阶段：开课前全额退课时费；L1 试学期全额退课时费（前 10 课时）；L2 开始后按已上课时比例扣除。注意：任何节点拆随材都要扣费。","src":"异议处理与编程价值"},{"t":"single","q":"超全额退费期的二次挽单由谁负责？","o":["客服","班主任","课导组长","教务"],"a":[2],"e":"挽单责任划分——超全额退费期：课导首挽 → 课导组长二挽 → 课导提交 CRM 退费，审批链为课导组长 / — / 课导教务。","src":"异议处理与编程价值"},{"t":"single","q":"未进入正课班级前，CRM 退费提交人是？","o":["课导组长","家长自己","课导","班主任"],"a":[3],"e":"未进入正课班级前：首挽班主任、二挽班主任组长、CRM 退费提交人是班主任——课导提交就违规。","src":"异议处理与编程价值"},{"t":"single","q":"整体退费挽单的时效是？","o":["10 个工作日","3 个自然日","5 个工作日","5 个自然日"],"a":[3],"e":"整体退费挽单时效为 5 个自然日，确定挽单失败的当日必须提交 CRM 流程，不得拖延。（挽单及退费申请需在 5 个工作日内完成。）","src":"异议处理与编程价值"},{"t":"single","q":"客服侧高危用户的退费反馈处理时效是？","o":["一周内","无时限要求","3 个工作日内","当日、最晚不超过 24 小时"],"a":[3],"e":"客服侧高危用户退费反馈：处理时效当日、最晚不超过 24 小时——24 小时内要么挽单成功，要么提交退费流程。","src":"异议处理与编程价值"},{"t":"multi","q":"退费应对四步法包括？","o":["强调「孩子成长」：说明本 Level 学习收获","与孩子沟通：确认问题根源在家长还是孩子","落回试学期框架：告知具体日期前有退费权益，鼓励再给一次机会","包装课程：不拆随材，课时费退费规则一致"],"a":[0,1,2,3],"e":"退费应对四步法：①强调孩子成长（本 Level 学习收获）②与孩子沟通（定位根源）③落回试学期框架（退费权益 + 再给机会）④包装课程（不拆随材规则一致，已上课时的额外收获无法退回）。","src":"异议处理与编程价值"},{"t":"multi","q":"退费处理的核心原则包括？","o":["第一时间报备给组长","不急于答应退费，先了解真实原因","让家长感受到被重视","话术保持专业和温度"],"a":[0,1,2,3],"e":"四大核心原则：第一时间报备组长、不急于答应退费先了解真实原因、让家长感受到被重视、话术专业且有温度。","src":"异议处理与编程价值"},{"t":"multi","q":"5 种常见异议的正确应对方案包括？","o":["不认可课程——展示具体学习成果，用作品和进步说话","学不会——提供小灶辅导，拆解难点建立信心","意见不统一——邀请双方共同沟通，用试学期降低压力","对比竞品——突出独特优势，不贬低竞品"],"a":[0,1,2,3],"e":"5 种常见异议：不认可课程（作品说话）、时间太长（系统学习必要性）、学不会（小灶辅导建信心）、意见不统一（双方沟通+试学期降压力）、对比竞品（突出优势不贬低）。","src":"异议处理与编程价值"},{"t":"multi","q":"「时间太长」异议的五步应对包括？","o":["核心价值传递","了解实际情况精准应对","突出课程长期不可替代性","灵活调整上课方案 + 结合试学期权益降低决策压力"],"a":[0,1,2,3],"e":"时间太长五步：①核心价值传递 ②了解实际情况精准应对 ③突出长期不可替代性 ④灵活调整上课方案 ⑤结合试学期权益降低决策压力。","src":"异议处理与编程价值"},{"t":"multi","q":"家长侧归因的正确处理动作包括？","o":["电话沟通了解需求","聊孩子未来规划","发朋友圈维系","直接上门家访"],"a":[0,1,2],"e":"家长侧归因：电话沟通了解需求、聊孩子未来规划、发朋友圈维系，前提是多利用「轨迹」信息；避免盲目一对一开家长会（性价比不高）。","src":"异议处理与编程价值"},{"t":"multi","q":"孩子侧归因的正确处理动作包括？","o":["点名表扬、发小奖状","金币激励","提前预告拆硬件内容、小灶带孩子实操拆硬件","批评孩子要大胆"],"a":[0,1,2],"e":"孩子侧归因：课堂认可（点名表扬、发小奖状、金币激励）+ 外化硬件课吸引力（提前预告拆硬件内容、小灶带孩子实操拆硬件），提升参与感和期待感。","src":"异议处理与编程价值"},{"t":"multi","q":"判断原则「先看轨迹，再定方向」的正确理解包括？","o":["家长无异议 → 问题在孩子侧，重点做孩子侧激励","家长有疑虑→ 先做家长侧重要性沟通","家长侧沟通：电话沟通、聊规划、建立信任","不用看轨迹，直接开家长会"],"a":[0,1,2],"e":"判断原则：先看轨迹再定方向。家长无异议 → 孩子侧激励（课堂认可、点名表扬、硬件课吸引力外化）；家长有疑虑 → 先家长侧重要性沟通再处理孩子侧问题；不要盲目一对一开家长会。","src":"异议处理与编程价值"},{"t":"multi","q":"接班期扒轨迹要重点识别的风险包括？","o":["孩子兴趣不足","被前端「硬盘」进班试学","报名时间节点风险","孩子太多奖状"],"a":[0,1,2],"e":"接班期扒轨迹三风险：孩子兴趣不足、被前端「硬盘」进班试学、报名时间节点风险（追单期报名），危险程度依次上升。","src":"异议处理与编程价值"},{"t":"multi","q":"首通阶段的高风险信号包括？","o":["家长态度敷衍","追问退费细则","抵触拆硬件","孩子抵触上课"],"a":[0,1,2,3],"e":"首通阶段四大高风险信号：家长态度敷衍、追问退费细则、抵触拆硬件、孩子抵触上课——以上均属高风险信号。","src":"异议处理与编程价值"},{"t":"multi","q":"课中和课后的高风险信号包括？","o":["频繁掉线、退出，完课时长异常","孩子抵触情绪、随堂测试成绩差","课后反馈不回复","作业不提交"],"a":[0,1,2,3],"e":"课中：频繁掉线退出、完课时长异常、孩子抵触情绪、随堂测试成绩差；课后：反馈不回复（首月最高风险）、作业不提交——需立即电话触达建立沟通。","src":"异议处理与编程价值"},{"t":"multi","q":"全流程控流失的优先级排序正确的是？","o":["课前预防＞课中维稳＞课后跟进＞退费挽单","退费挽单＞课后跟进＞课中维稳＞课前预防","课中维稳＞课前预防＞退费挽单＞课后跟进","无所谓顺序"],"a":[0],"e":"执行总结：全程围绕提升孩子上课兴趣做事；优先级：课前预防＞课中维稳＞课后跟进＞退费挽单；沟通原则：全程利他主义。","src":"异议处理与编程价值"},{"t":"multi","q":"挽单五条硬规定包括？","o":["涉及共同挽单的，收到退费消息后第一时间私信同步至另一方","未得到另一方最终结果前，不得擅自告知用户可直接联系对方办理退费或答应提交退费","确定挽单失败当日必须提交 CRM 流程，不得拖延","对退费金额不认可的用户正常解释核算规则，仍不认可需提交《特殊退费审批》OA"],"a":[0,1,2,3],"e":"五条硬规定：①第一时间同步另一方 ②不得擅自告知用户联系对方办退费 ③5 个自然日时效、失败当日提交 CRM ④金额争议先解释规则、再提交特殊退费审批 OA ⑤客服侧高危用户当日处理、最晚不超 24 小时。","src":"异议处理与编程价值"},{"t":"judge","q":"试学期家长是「零成本」全面考察，所以首月退费管控是核心理念。","a":[0],"e":"首月是退费风险最集中窗口期，家长「零成本」全面考察；新人要理解课程逻辑而非机械执行规则，逐一关注每个孩子的问题。","src":"异议处理与编程价值"},{"t":"judge","q":"见面会阶段约不上、家长会约不上都是流失预警信号。","a":[0],"e":"见面会阶段预警：约不上见面会（孩子忙）、约不上家长会（家长不在意）、上课时间不合适——都要提高警惕。","src":"异议处理与编程价值"},{"t":"judge","q":"课前直播孩子拒绝参加、评论区不互动不发言，属于正常现象不用管。","a":[1],"e":"课前直播预警：拒绝参加直播、评论区不互动、不发言不参与——都是流失预警信号，需重点关注。","src":"异议处理与编程价值"},{"t":"judge","q":"孩子拒绝拆随材、询问随材退费规则，属于高风险信号。","a":[0],"e":"硬件相关预警：拒绝拆随材、询问随材退费规则、孩子不喜欢硬件——都是风险信号，需持续关注。","src":"异议处理与编程价值"},{"t":"judge","q":"处理异议时，不管什么情况都可以直接约一对一家长会解决。","a":[1],"e":"判断原则是先看轨迹再定方向，不要盲目一对一开家长会——家长无异议时做孩子侧激励即可，家长有疑虑才先做家长侧沟通。","src":"异议处理与编程价值"},{"t":"judge","q":"与竞品对比时，应突出我们的独特优势，不贬低竞品。","a":[0],"e":"对比竞品的应对：突出独特优势、不贬低竞品——贬低竞品会显得不专业，也容易引起家长反感。","src":"异议处理与编程价值"},{"t":"judge","q":"进班后-全额退费期内退费，用户先找谁谁先挽，另一方必须参与共同挽单。","a":[0],"e":"进班后-全额退费期内（共同挽单双方必须参与）：用户先找谁谁先挽 → 另一方（班主任/课导）二挽 → 课导提交 CRM。","src":"异议处理与编程价值"},{"t":"judge","q":"未得到另一方最终结果前，可以告知用户直接联系对方办理退费。","a":[1],"e":"硬规定：未得到另一方最终结果前，不得擅自告知用户可直接联系对方办理退费或答应提交退费——此处切记换位思考。","src":"异议处理与编程价值"},{"t":"judge","q":"下班后收到客户退费消息，可在第二日上班后一小时内同步至另一方。","a":[0],"e":"涉及共同挽单的，收到退费消息后第一时间私信同步至另一方；下班后收到的可在第二日上班后一小时内同步。","src":"异议处理与编程价值"},{"t":"judge","q":"对退费金额不认可的用户，直接按公司核算金额执行，无需解释。","a":[1],"e":"对退费金额不认可的用户：正常解释核算规则；仍不认可需提交《特殊退费审批》OA，以 OA 审批结果为准，极特殊情况可私信审批质检老师。","src":"异议处理与编程价值"},{"t":"judge","q":"若家长在第四次课后提出退费，需要在第 5 次课开课前处理完退费流程，避免扣费。","a":[0],"e":"L1 全额退课时费期注意事项：若家长在第四次课后提出退费，需要在第 5 次课开课前处理完退费流程，避免扣费。","src":"异议处理与编程价值"},{"t":"judge","q":"开课前来不及挽单的，了解用户退费主要原因并进行一次挽单，若失败需当日同步班主任，由班主任进行挽单。","a":[0],"e":"开课前流程：用户提出退费，课导了解退费主要原因并进行一次挽单（若失败）→ 当日内同步班主任微信沟通记录或首通通话录音 → 由班主任进行挽单，换单失败由班主任提交退费申请，课导跟进（5 个工作日内完成）。","src":"异议处理与编程价值"},{"t":"judge","q":"退费情况在所难免，遇到时要放平心态、从容应对。","a":[0],"e":"培训最后的话：退费情况在所难免，请大家放平心态，从容应对——按流程、按话术、按硬规定处理即可。","src":"异议处理与编程价值"},{"day":1,"tag":"带班周期","src":"Day1变式","t":"judge","q":"图形化课导的带班周期是半年。","a":[0],"e":"带班信息页明确：带班周期为半年。"},{"day":1,"tag":"带班周期","src":"Day1变式","t":"fill","q":"图形化课导的带班周期是____。","a":["半年|0.5年|6个月"],"e":"带班周期为半年。"},{"day":1,"tag":"上课时间","src":"Day1变式","t":"fill","q":"图形化课导的固定上课时间段是周四、____、周六的 19 点。","a":["周五"],"e":"带班时间为周四（19:00）、周五（19:00）、周六（19:00），每人分配两个时间段。"},{"day":1,"tag":"上课时间","src":"Day1变式","t":"single","q":"图形化课导每人分配几个固定上课时间段？","o":["1 个","2 个","3 个","4 个"],"a":[1],"e":"带班信息页明确：每人分配两个时间段。"},{"day":1,"tag":"用户来源","src":"Day1变式","t":"fill","q":"图形化课导班级的用户来源是前端____续报上来的学员。","a":["班主任"],"e":"用户来源：前端班主任续报上来，即体验课阶段由班主任转化续报的学员。"},{"day":1,"tag":"用户特点","src":"Day1变式","t":"judge","q":"图形化课导班级的学员基本都无编程基础。","a":[0],"e":"用户特点：基本都无编程基础，需要课导做更细致的入门引导与陪伴。"},{"day":1,"tag":"用户特点","src":"Day1变式","t":"fill","q":"图形化课导班级的用户特点是基本都____编程基础。","a":["无|没有"],"e":"用户特点：基本都无编程基础。"},{"day":1,"tag":"接班期","src":"Day1变式","t":"fill","q":"接班期持续____周，核心目标是防流失加建信任。","a":["3|三"],"e":"接班期持续 3 周（注意不是 4 周），核心目标：防流失 + 建信任。"},{"day":1,"tag":"接班期","src":"Day1变式","t":"multi","q":"接班期扒轨迹要做的三件事包括？","o":["了解学员前期学习","清晰报名动机","排查风险学员","确定续报折扣"],"a":[0,1,2],"e":"扒轨迹三件事：了解学员前期学习、清晰报名动机、排查风险学员。"},{"day":1,"tag":"L1试学期","src":"Day1变式","t":"judge","q":"L1 试学期要求未回复家长必电话跟进。","a":[0],"e":"L1 明确「未回复家长必电话跟进」，确保家校沟通不断档。"},{"day":1,"tag":"LEVEL节奏","src":"Day1变式","t":"fill","q":"每个 LEVEL 为一个月共____课时，第 1-3 周每周 1 次、一次 2 课时，第 4 周每周 2 次、周日增加赛考课或赛考直播课。","a":["10|十"],"e":"每个 LEVEL 课时：3 次 × 2 + 2 次 × 2 = 10 课时，每个月都按此安排循环。"},{"day":1,"tag":"LEVEL节奏","src":"Day1变式","t":"judge","q":"第 4 周周日增加的是赛考课或赛考直播课。","a":[0],"e":"第 4 周周日增加的是赛考课或赛考直播课（一次 2 课时）。"},{"day":1,"tag":"续报节点","src":"Day1变式","t":"fill","q":"正式续报的时间节点是 L5-____ / L5-4。","a":["2|二"],"e":"L5 为正式续报阶段，节点 L5-2 / L5-4。"},{"day":1,"tag":"赛考节点","src":"Day1变式","t":"judge","q":"赛考联报的启动节点是 L3-2 / L2-4。","a":[0],"e":"赛考联报节点：L3-2 / L2-4；等考考试节点是 L4-1 / L4-3，两者易混。"},{"day":1,"tag":"L6维稳","src":"Day1变式","t":"multi","q":"L6 用户维稳阶段的核心目标包括？","o":["组织国赛白名单赛事冲刺奖项","防退费","追单","结课过渡"],"a":[0,1,2,3],"e":"L6 核心目标：维稳 + 防退费追单；动作：国赛/白赛考试、防退费、追单、结课过渡。"},{"day":1,"tag":"首通定位","src":"Day1变式","t":"fill","q":"首通不是____，而是接住用户。","a":["卖课|推销"],"e":"首通不是「卖课」，而是「接住用户」——家长已付费认可编程价值，首通核心是建立信任、收集信息、挖掘需求。"},{"day":1,"tag":"首通定位","src":"Day1变式","t":"judge","q":"首通电话的本质是接住用户，建立信任。","a":[0],"e":"家长已付费认可编程价值，首通核心任务是让家长相信：接下来 5-6 个月，能把孩子带好、把课教好。"},{"day":1,"tag":"首通目的","src":"Day1变式","t":"multi","q":"首通对用户侧的核心目的包括？","o":["建立信任","传递课程价值","消除决策顾虑","尽快催缴尾款"],"a":[0,1,2],"e":"对用户侧核心：建立信任关系，清晰传递课程价值与服务优势，针对性解答疑问，消除决策顾虑。"},{"day":1,"tag":"首通准备","src":"Day1变式","t":"fill","q":"首通前准备工作的核心原则是____。","a":["知己知彼"],"e":"准备工作的核心原则是「知己知彼」——充分的前期准备，是高效沟通与信任建立的基石。"},{"day":1,"tag":"首通准备","src":"Day1变式","t":"multi","q":"首通前准备的动作包括？","o":["复盘历史沟通轨迹","回顾家长反馈记录","提前进系统看基本情况与聊天记录","查 UID 警惕退费风险"],"a":[0,1,2,3],"e":"准备动作：复盘历史沟通轨迹（明确节点与意向线索）、回顾家长反馈（预判疑问顾虑）、提前进系统看基本情况与聊天记录、查 UID（警惕退费风险）——给家长「前后衔接靠谱」的感觉。"},{"day":1,"tag":"用户分层","src":"Day1变式","t":"fill","q":"用户期许分层共三大类：思维型、升学型、____。","a":["混合型"],"e":"用户分层三大类：思维型、升学型、混合型（既要又要）。"},{"day":1,"tag":"用户分层","src":"Day1变式","t":"judge","q":"升学型用户的画像是牛娃，目标顶级竞赛成绩与特殊升学最优解。","a":[0],"e":"升学型画像——牛娃，目标顶级竞赛成绩与特殊升学最优解，追求顶尖资源与效率。"},{"day":1,"tag":"用户分层","src":"Day1变式","t":"single","q":"追求孩子快乐成长与可感知进步的普娃属于？","o":["思维型","升学型","混合型","竞赛型"],"a":[0],"e":"思维型画像——普娃，追求孩子快乐成长与可感知进步，提供趣味编程学习与托管服务。"},{"day":1,"tag":"首通框架","src":"Day1变式","t":"fill","q":"首通框架三阶段：阶段一破冰·立人设，阶段二挖需·下切法，阶段三收尾·____。","a":["固化信任"],"e":"首通框架三阶段：破冰·立人设 → 挖需·下切法 → 收尾·固化信任。"},{"day":1,"tag":"首通框架","src":"Day1变式","t":"judge","q":"首通阶段三收尾·固化信任的动作包括问注意事项、硬件地址确认和固化信任。","a":[0],"e":"阶段三收尾·固化信任三动作：问注意事项（体验课问题改善）、硬件地址确认、固化信任。"},{"day":1,"tag":"首通框架","src":"Day1变式","t":"single","q":"首通全程要贯彻的两大原则是？","o":["情绪饱满贯彻始终 + 人设建立形象饱满","语速快 + 信息量大","多推销 + 少倾听","延长通话 + 频繁回访"],"a":[0],"e":"贯穿首通全程的两大原则：情绪饱满贯彻始终 + 人设建立形象饱满。"},{"day":1,"tag":"首通标准","src":"Day1变式","t":"fill","q":"一次有效沟通要求通话时长达到____分钟以上。","a":["15|十五"],"e":"有效沟通≥15 分钟——通话时长达到 15 分钟以上，才算一次成功沟通。"},{"day":1,"tag":"首通标准","src":"Day1变式","t":"judge","q":"信息完整加流程正确这条标准的量化指标是复原率不低于 85%。","a":[0],"e":"信息完整 + 流程正确：家长信息记录完整、按既定流程执行，复原率≥85%。"},{"day":1,"tag":"控场技巧","src":"Day1变式","t":"multi","q":"首通关键控场技巧包括？","o":["开场定调明方向","话题偏离温柔拉回","适时总结防遗漏","主动结束显专业"],"a":[0,1,2,3],"e":"控场四招：开场定调明方向、话题偏离温柔拉回、适时总结防遗漏、主动结束显专业。"},{"day":1,"tag":"挖需提问","src":"Day1变式","t":"judge","q":"挖掘家长需求时应善用开放式提问，避免封闭式的是否回答。","a":[0],"e":"开放式提问才能引导家长多维度表达、挖掘关键细节，弥补信息差；封闭式只能得到是/否。"},{"day":1,"tag":"思维线","src":"Day1变式","t":"fill","q":"思维线优惠后____元每阶段，共 48 课时（42 软编 + 6 硬编），学 1 年 3 张国家级证书。","a":["2699"],"e":"思维线：优惠后 2699 元/阶段、48 课时（42 软编 + 6 硬编）、1 年 3 张证书。"},{"day":1,"tag":"科特线","src":"Day1变式","t":"fill","q":"科特线优惠后____元每阶段，共 60 课时（30 软编 + 12 硬编 + 12 赛事课 + 6 赛事直播），学 1 年 4 张国家级证书。","a":["3299"],"e":"科特线：优惠后 3299 元/阶段、60 课时（30 软编 + 12 硬编 + 12 赛事课 + 6 赛事直播）、1 年 4 张证书——科特线赛事更重。"},{"day":1,"tag":"双线对比","src":"Day1变式","t":"multi","q":"思维线与科特线的相同点包括？","o":["周期都是共 2 个阶段","上课形式都是实操+直播+硬件+综合项目","学生特点都面向大众学员","师资都是课导老师"],"a":[0,1,2,3],"e":"两线相同：2 阶段、上课形式、面向大众、课导老师；差异在价格、课时构成与赛考规划。"},{"day":1,"tag":"后续衔接","src":"Day1变式","t":"fill","q":"后续衔接路径：图形化 3299 元 2 阶段 1 年 → 科特 Python ____ 元 2 阶段 1 年 → C++ 4399 元 6 阶段 3 年。","a":["4199"],"e":"衔接路径：图形化（3299）→ 科特 Python（4199，2 阶段 1 年）→ C++（4399，6 阶段 3 年）。"},{"day":1,"tag":"沟通规范","src":"Day1变式","t":"judge","q":"课导可以主动向家长介绍趣味 C++ 和常规 C++ 的区别。","a":[1],"e":"必背规则：统一说「图形化」「Python」「C++」，不主动区分趣味 C++/常规 C++；家长主动提出跨级跨线时第一时间报备组长。"},{"day":1,"tag":"沟通规范","src":"Day1变式","t":"fill","q":"家长主动提出跨级或跨线时，应第一时间报备____，根据需求判断是否需要调整。","a":["组长"],"e":"必背规则：家长主动提出跨级/跨线，第一时间报备组长判断。"},{"day":1,"tag":"三大支柱","src":"Day1变式","t":"fill","q":"三大支柱指课程模式、因材施教、学练考一体，决定课程的____。","a":["专业高度"],"e":"记忆框架：三大支柱决定课程的专业高度，三层保障决定孩子的学习效果。"},{"day":1,"tag":"三层保障","src":"Day1变式","t":"fill","q":"三层保障指愿意学、学得会、____。","a":["额外价值"],"e":"三层保障：愿意学（剧情闯关+金币激励+软硬件结合）、学得会（60 分钟时间轴+专注力训练）、额外价值（科普+学科结合+英语跟读）。"},{"day":1,"tag":"三层保障","src":"Day1变式","t":"multi","q":"「愿意学」依靠哪些设计？","o":["剧情闯关","金币激励","软硬件结合","学费打折"],"a":[0,1,2],"e":"愿意学三件套：剧情闯关（每次课是侦探剧情，写代码就是找线索）+ 金币激励（解锁隐藏关卡、排行榜）+ 软硬件结合（每阶段 6 次硬件课）。"},{"day":1,"tag":"时间轴","src":"Day1变式","t":"fill","q":"60 分钟时间轴：0-5 分钟课前复习，5-20 分钟新知讲解，20-45 分钟实操练习，45-55 分钟关卡挑战，55-60 分钟____。","a":["总 ,"t":"fill","q":"正确手势的高度要求是与____齐平，不挡脸，完整展示。","a":["耳|耳朵"],"e":"手势要与耳齐平、不挡脸、完整展示，自然有节奏配合讲解，幅度可以大。"},{"day":2,"tag":"手势","src":"Day2变式","t":"multi","q":"以下属于直播中错误手势的有？","o":["竖中指、摇手指、出小拇指","拇指朝下","抓耳挠腮、抠鼻","中指扶镜框"],"a":[0,1,2,3],"e":"错误手势四类：竖中指/摇手指/出小拇指、拇指朝下、抓耳挠腮抠鼻、长时间无意义手势和中指扶镜框。"},{"day":2,"tag":"手势","src":"Day2变式","t":"single","q":"以下哪组全是正确手势？","o":["鼓掌、点赞、OK、比心","竖中指、比数字","摇手指、打招呼","出小拇指、比心"],"a":[0],"e":"正确手势：鼓掌、打招呼、比数字、点赞、OK、比心。"},{"day":2,"tag":"仪容仪表","src":"Day2变式","t":"judge","q":"直播衣着要求衣服颜色与背景有明显区别，符合教师职业形象。","a":[0],"e":"衣着得体：颜色与背景有明显区别、符合教师职业形象；想更好可以淡妆、符合孩子喜好的穿搭。"},{"day":2,"tag":"仪容仪表","src":"Day2变式","t":"fill","q":"仪容仪表小 tips：淡妆、符合孩子喜好的穿搭、可爱____、道具眼镜都可以增加孩子好感度。","a":["发箍"],"e":"小 tips：淡妆、孩子喜好穿搭、可爱发箍、道具眼镜都能加好感度。"},{"day":2,"tag":"试学期逻辑","src":"Day2变式","t":"fill","q":"L1 试学期前____课时全额退课时费，首月是退费风险最集中的窗口期。","a":["10|十"],"e":"L1 试学期前 10 课时全额退课时费；首月家长「零成本」全面考察，退费管控是核心理念。"},{"day":2,"tag":"试学期逻辑","src":"Day2变式","t":"judge","q":"新人要理解试学期课程逻辑而非机械执行规则。","a":[0],"e":"试学期设计初衷是体现产品信心、给家长灵活选择空间；新人必须理解课程逻辑，逐一关注每个孩子的问题。"},{"day":2,"tag":"流失预警","src":"Day2变式","t":"fill","q":"首月最高风险信号是课后____不回复，需立即电话触达建立沟通。","a":["反馈|消息"],"e":"课后反馈消息不回复是首月最高风险信号，必须多频次触达。"},{"day":2,"tag":"流失预警","src":"Day2变式","t":"judge","q":"追单期报名的学员危险程度最高，报名越晚风险越高。","a":[0],"e":"接班期扒轨迹：孩子兴趣不足、被硬盘进班、追单期报名——危险程度依次上升。"},{"day":2,"tag":"判断原则","src":"Day2变式","t":"fill","q":"处理异议的判断原则：先看____，再定方向。","a":["轨迹"],"e":"判断原则：先看轨迹再定方向。家长无异议做孩子侧激励；有疑虑先家长侧沟通。"},{"day":2,"tag":"判断原则","src":"Day2变式","t":"multi","q":"孩子侧归因（孩子内向不互动）的正确动作包括？","o":["点名表扬","发小奖状","金币激励","直接上门家访"],"a":[0,1,2],"e":"孩子侧归因：课堂认可（点名表扬、发小奖状、金币激励）+ 外化硬件课吸引力（提前预告、小灶实操）。"},{"day":2,"tag":"退费四步法","src":"Day2变式","t":"fill","q":"退费应对四步法第一步：强调「孩子____」，说明本 Level 学习收获。","a":["成长"],"e":"退费四步法：①强调孩子成长 ②与孩子沟通定位根源 ③落回试学期框架 ④包装课程。"},{"day":2,"tag":"退费四步法","src":"Day2变式","t":"single","q":"退费处理的核心原则是？","o":["先答应退费再了解原因","不急于答应退费，先了解真实原因","直接拒绝退费申请","让家长自己联系客服"],"a":[1],"e":"核心原则：第一时间报备组长、不急于答应退费先了解真实原因、让家长感受到被重视、话术专业有温度。"},{"day":2,"tag":"五种异议","src":"Day2变式","t": const EXAM_ID = "Day1+2结业";
const TYPE_LABEL = {single:"单选", multi:"多选", judge:"判断", fill:"填空"};
const JOPTS = ["√ 正确","× 错误"];
const N = 30;
let PAPER = [], cur = 0;
let student = {name:"", cls:""};
const answers = {};   // idx -> {picked:[], fillVals:[], correct:bool}

function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function letters(arr){ return arr.map(i=>String.fromCharCode(65+i)).sort().join(""); }
function normAns(s){ return String(s).trim().toLowerCase().replace(/\s+/g,"").replace(/[。，,．.、！!？?：:；;]/g,""); }

function startExam(){
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('请填写姓名'); return; }
  student = { name, cls: document.getElementById('f-cls').value.trim() };
  // 抽题：题干去重
  const pool = shuffle(BANK);
  const seen = new Set(); PAPER = [];
  for (const q of pool) { if (PAPER.length >= N) break; if (seen.has(q.q)) continue; seen.add(q.q); PAPER.push(q); }
  document.getElementById('login').style.display = 'none';
  document.getElementById('exam-top').classList.add('show');
  document.getElementById('who').innerHTML = esc(student.name) + (student.cls ? ' <small>· ' + esc(student.cls) + '</small>' : '');
  cur = 0;
  renderQ();

function renderQ(){
  const q = PAPER[cur];
  document.getElementById('prog').textContent = '第 ' + (cur+1) + ' / ' + PAPER.length + ' 题';
  const card = document.getElementById('card');
  let html = '<div class="qmeta"><span class="qtype ' + q.t + '">' + TYPE_LABEL[q.t] + (q.t==='multi'?'（多选）':'') + '</span>' +
    (q.src ? '<span style="font-size:11px;color:#9ca3af">' + esc(q.src) + '</span>' : '') + '</div>';
  const qHtml = q.t === 'fill' ? esc(q.q).replace(/____/g,'<span class="blank">＿＿＿</span>') : esc(q.q);
  html += '<div class="qtext">' + qHtml + '</div>';
  if (q.t === 'fill') {
    const blanks = q.a.length;
    for (let i=0;i<blanks;i++) html += '<div class="fill-row"><input class="fill-input" data-i="' + i + '" placeholder="第 ' + (i+1) + ' 空" autocomplete="off"></div>';
    html += '<div class="nav"><button class="btn gray" onclick="prevQ()" ' + (cur===0?'disabled':'') + '>上一题</button>' +
            '<button class="btn" onclick="saveFill()">' + (cur===PAPER.length-1?'交卷':'下一题') + '</button></div>';
  } else {
    const opts = q.t === 'judge' ? JOPTS : q.o;
    opts.forEach((o,oi) => {
      html += '<div class="opt" data-oi="' + oi + '" onclick="pick(this)">' + String.fromCharCode(65+oi) + '. ' + esc(o) + '</div>';
    });
    html += '<div class="nav"><button class="btn gray" onclick="prevQ()" ' + (cur===0?'disabled':'') + '>上一题</button>' +
            '<button class="btn" onclick="nextQ()">' + (cur===PAPER.length-1?'交卷':'下一题') + '</button></div>';
  }
  card.innerHTML = html;
  card.classList.add('show');
  // 恢复已答
  const a = answers[cur];
  if (a) {
    if (q.t === 'multi' || q.t === 'single' || q.t === 'judge') {
      document.querySelectorAll('.opt').forEach(o => { if (a.picked.includes(+o.dataset.oi)) o.classList.add('sel'); });
    } else {
      document.querySelectorAll('.fill-input').forEach(inp => { inp.value = a.fillVals[+inp.dataset.i] || ''; });
    }
  }
}

function pick(el){
  const q = PAPER[cur];
  if (q.t === 'multi') { el.classList.toggle('sel'); return; }
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  savePick([+el.dataset.oi]);
  if (cur < PAPER.length - 1) setTimeout(nextQ, 150);
}
function savePick(picked){
  const q = PAPER[cur];
  const correct = letters(picked) === letters(q.a) && picked.length === q.a.length;
  answers[cur] = { picked, correct };
}
function nextQ(){
  const q = PAPER[cur];
  if (q.t !== 'fill') {
    const sel = [...document.querySelectorAll('.opt.sel')].map(e=>+e.dataset.oi);
    if (!sel.length && answers[cur] === undefined) { alert('请先作答'); return; }
    if (sel.length) savePick(sel);
  }
  if (cur === PAPER.length - 1) { submit(); return; }
  cur++; renderQ(); window.scrollTo({top:0});
}
function prevQ(){ if (cur > 0) { cur--; renderQ(); window.scrollTo({top:0}); } }
function saveFill(){
  const q = PAPER[cur];
  const inputs = [...document.querySelectorAll('.fill-input')];
  const vals = inputs.map(i => i.value);
  if (vals.some(v => !v.trim())) { alert('请填写所有空'); return; }
  let correct = true;
  q.a.forEach((acc, i) => {
    const ok = acc.split('|').map(x=>normAns(x)).includes(normAns(vals[i]));
    if (!ok) correct = false;
  });
  answers[cur] = { fillVals: vals, correct };
  if (cur === PAPER.length - 1) { submit(); return; }
  cur++; renderQ(); window.scrollTo({top:0});
}

function submit(){
  // 未答的题记为错
  PAPER.forEach((q,i) => { if (answers[i] === undefined) answers[i] = {picked:[], fillVals:[], correct:false}; });
  const rightN = PAPER.filter((q,i) => answers[i].correct).length;
  const score = Math.round(rightN / PAPER.length * 100);
  // 展示
  document.getElementById('exam-top').classList.remove('show');
  document.getElementById('card').classList.remove('show');
  const sc = document.getElementById('score');
  sc.textContent = score + ' 分';
  sc.style.color = score>=80 ? '#16a34a' : score>=60 ? '#d97706' : '#dc2626';
  const wrong = PAPER.length - rightN;
  document.getElementById('score-line').innerHTML =
    '考生：' + esc(student.name) + (student.cls ? '（' + esc(student.cls) + '）' : '') +
    '　｜　答对 ' + rightN + ' / ' + PAPER.length + '　｜　答错 ' + wrong +
    '　｜　' + (score>=80?'🎉 通过':score>=60?'💪 及格':'📖 未通过，需复习重考');
  // 回顾
  const rv = PAPER.map((q,i) => {
    const a = answers[i];
    const ansTxt = q.t==='fill'
      ? q.a.map(x=>x.split('|')[0]).join('；')
      : q.a.map(k=>String.fromCharCode(65+k)).sort().join('');
    let your = '';
    if (q.t === 'fill') your = (a.fillVals||[]).join('；');
    else if ((a.picked||[]).length) your = a.picked.map(k=>String.fromCharCode(65+k)).sort().join('');
    else your = '未作答';
    const tag = a.correct ? '<span class="tag ok">✓ 对</span>' : '<span class="tag no">✗ 错</span>';
    return '<div class="review-item">' + tag + (i+1) + '. ' + esc(q.q) +
      '<br><span class="your">你的答案：' + esc(your) + '</span>　<span class="ans">正确答案：' + esc(ansTxt) + '</span>' +
      '<br><span style="color:#9ca3af;font-size:13px">💡 ' + esc(q.e) + '</span></div>';
  }).join('');
  document.getElementById('review').innerHTML = '<h3 style="font-size:15px;margin-bottom:6px">逐题回顾</h3>' + rv;
  document.getElementById('result').classList.add('show');
  window.__result = {name: student.name, cls: student.cls, score, rightN, total: PAPER.length, examId: EXAM_ID, time: new Date().toLocaleString('zh-CN')};
  // 本地留存
  try {
    const hist = JSON.parse(localStorage.getItem('exam_history') || '[]');
    hist.push(window.__result);
    localStorage.setItem('exam_history', JSON.stringify(hist));
  } catch(e) {}
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

function copyResult(){
  const r = window.__result;
  const txt = '【' + EXAM_ID + ' 考试成绩】\n姓名：' + r.name + (r.cls ? '\n班级/工号：' + r.cls : '') +
    '\n得分：' + r.score + ' 分（' + r.rightN + '/' + r.total + '，按准确率计算）\n交卷时间：' + r.time;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('已复制，粘贴发给培训负责人即可'));
  else {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('已复制，粘贴发给培训负责人即可');
  }
}
</script>
