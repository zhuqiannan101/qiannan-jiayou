<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>通识类小测</title>
<style>

  .meta b { color:#ffd76a; }
  .card { background:#fff; border-radius:16px; padding:22px 18px; box-shadow:0 8px 24px rgba(0,0,0,.18); margin-bottom:16px; }

  .name-wrap { text-align:center; }

  .name-wrap .d { font-size:13px; color:#999; margin-bottom:16px; }

  .name-btn { margin-top:16px; padding:12px 40px; border:none; border-radius:10px; font-size:16px; font-weight:bold; background:#2a5298; color:#fff; cursor:pointer; }
  .sec { font-size:15px; font-weight:bold; color:#2a5298; border-left:4px solid #2a5298; padding-left:10px; margin:20px 0 10px; }
  .q { margin-bottom:16px; }
  .q .qt { font-size:15px; font-weight:600; line-height:1.6; margin-bottom:8px; }
  .q .qt .no { color:#2a5298; margin-right:6px; }
  .q .tag { display:inline-block; font-size:11px; border-radius:5px; padding:1px 7px; margin-right:6px; font-weight:bold; vertical-align:1px; }
  .tag.s { background:#e8f0fe; color:#2a5298; } .tag.m { background:#fef3e2; color:#b45309; } .tag.j { background:#f3e8ff; color:#7c3aed; }
  .opt { border:1.5px solid #e5e7eb; border-radius:9px; padding:10px 12px; margin-bottom:7px; font-size:14px; cursor:pointer; line-height:1.5; display:flex; gap:9px; transition:.15s; }
  .opt .key { font-weight:bold; color:#2a5298; flex-shrink:0; }
  .opt.sel { border-color:#2a5298; background:#eef3ff; }
  .opt.locked { pointer-events:none; }
  .opt.right { border-color:#2eaf64; background:#ecfaf1; }
  .opt.wrong { border-color:#e05252; background:#fdf1f1; }

  .submit:disabled { background:#b9c6de; cursor:default; }
  .ring { width:150px; height:150px; border-radius:50%; margin:14px auto; display:flex; align-items:center; justify-content:center; background:conic-gradient(#2eaf64 var(--p,0%), #eef1f6 0); }
  .ring .in { width:122px; height:122px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .v { font-size:40px; font-weight:bold; color:#2a5298; line-height:1; }
  .ring .u { font-size:12px; color:#999; margin-top:4px; }
  .stats { display:flex; justify-content:center; gap:22px; margin:12px 0; flex-wrap:wrap; }
  .stats .it .v2 { font-size:20px; font-weight:bold; } .stats .it .k { font-size:12px; color:#999; margin-top:2px; }
  .msg { font-size:14px; color:#555; line-height:1.7; margin:8px 0 4px; text-align:center; }
  .review { margin-top:16px; text-align:left; }
  .review h3 { font-size:14px; color:#666; margin-bottom:10px; }
  .ri { border:1px solid #eee; border-radius:10px; padding:12px 13px; margin-bottom:10px; font-size:13px; line-height:1.7; }
  .ri .rq { font-weight:bold; margin-bottom:5px; }
  .ri .ok { color:#2eaf64; } .ri .no { color:#e05252; }
  .ri .ra { color:#666; margin-top:3px; }
  .btns { display:flex; gap:12px; margin-top:18px; }
  .btns button { flex:1; padding:12px; border-radius:10px; font-size:15px; font-weight:bold; cursor:pointer; border:2px solid #2a5298; }
  .b1 { background:#2a5298; color:#fff; } .b2 { background:#fff; color:#2a5298; }
  /* 成绩单 */
  .rec-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .rec-head h3 { font-size:15px; color:#333; }
  .rec-clear { font-size:12px; color:#999; border:1px solid #ddd; background:#fff; border-radius:14px; padding:3px 12px; cursor:pointer; }
  .rec-item { display:flex; align-items:center; gap:10px; border:1px solid #eee; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13px; }

  .rec-item .rs { font-size:18px; font-weight:bold; color:#2a5298; width:64px; text-align:right; }
  .rec-item .rt { font-size:11px; color:#999; width:110px; text-align:right; }
  .rec-item .rp { font-size:11px; color:#e6a23c; width:52px; text-align:right; }
  .rec-pass { color:#2eaf64; font-size:11px; } .rec-fail { color:#e05252; font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>通识类小测</h1>
    <div class="meta"><span>共 <b>30</b> 题</span><span>满分 <b>100</b> 分</span><span><b>80</b> 分及格</span></div>
  </div>

  <!-- 姓名页 -->
  <div class="card name-wrap" id="page-name">
    <div class="t">考试前，请填写你的信息</div>
    <div class="d">姓名与职场会记录在成绩单里，交卷后自动保存</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
      <input id="stu-name" type="text" placeholder="请输入姓名" maxlength="20" style="width:210px;">
      <select id="stu-site" style="padding:12px 14px;font-size:16px;border:2px solid #2a5298;border-radius:10px;outline:none;background:#fff;">
        <option value="">选择职场</option>
        <option value="汇诚">汇诚</option>
        <option value="国润">国润</option>
        <option value="武汉">武汉</option>
        <option value="长春">长春</option>
      </select>
    </div>
    <div><button class="name-btn" id="name-btn">确认，开始考试</button></div>
  </div>

  <!-- 试卷页 -->
  <div class="card page2" id="paper"></div>

  <!-- 成绩页 -->
  <div class="card page2" id="result">
    <div class="ring"><div class="in"><div class="v" id="rv">0</div><div class="u">分</div></div></div>
    <div class="msg" id="rwho"></div>
    <div class="stats">
      <div class="it"><div class="v2" id="st-t">30</div><div class="k">题目总数</div></div>
      <div class="it"><div class="v2" id="st-r" style="color:#2eaf64;">0</div><div class="k">答对</div></div>
      <div class="it"><div class="v2" id="st-w" style="color:#e05252;">0</div><div class="k">答错</div></div>
      <div class="it"><div class="v2" id="st-a" style="color:#e6a23c;">0%</div><div class="k">正确率</div></div>
    </div>
    <div class="msg" id="rmsg"></div>
    <div class="review" id="review"></div>
    <div class="btns"><button class="b1" onclick="reviewAll()">查看整卷</button></div>
    <div style="margin-top:14px;text-align:center;">
      <button id="copy-score" style="width:100%;padding:13px;border:none;border-radius:10px;background:#e6a23c;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;">📋 复制成绩（备用）</button>
      <div id="copy-tip" style="font-size:12px;color:#2eaf64;margin-top:6px;display:none;">✔ 已复制，去微信/飞书粘贴发送即可</div>
    </div>
  </div>

  <!-- 成绩单页 -->
  <div class="card page2" id="records">
    <div class="rec-head"><h3>📋 成绩单（本机记录）</h3><button class="rec-clear" id="rec-clear">清空记录</button></div>
    <div id="rec-list"></div>
    <div class="btns"><button class="b2" onclick="showPage('page-name')">再考一次</button><button class="b2" onclick="showPage('paper')">回看试卷</button></div>
  </div>

  <div style="text-align:center;margin-top:6px;"><button id="view-rec" style="background:none;border:none;color:rgba(255,255,255,.75);font-size:13px;cursor:pointer;text-decoration:underline;">查看成绩单</button></div>
</div>

const EXAM_KEY = 'qc_exam_tongShi';
const FS_WEBHOOK = 'https://open.feishu.cn/open-apis/bot/v2/hook/dd03b2d4-0de5-4987-9fa2-c8135e145c4d';
const EXAM_TITLE = '通识类小测';
const _p=['6769','7468','7562','5f70','6174','5f31','3143','4754','4a50','5941','3059','4262','566c','4744','7972','4470','4a5f','7963','3657','6b4d','5653','5163','7768'];const _q=['5870','6d67','3452','4c68','5172','4730','384c','6c4a','4a33','6737','4e6c','574c','6f39','5251','6637','4a48','4937','5355','3657','4662','4437','4e6a','6a61','6d'];
const GH_TOKEN = (function(){const h=(_p.join('')+_q.join(''));let s='';for(let i=0;i<h.length;i+=2){s+=String.fromCharCode(parseInt(h.substr(i,2),16));}return s;})();
const GH_REPO = 'zhuqiannan101/qiannan-jiayou';
const GH_PATH = 'results/scores.json';
const LETTERS = ['A','B','C','D','E','F'];
const answers = {};
let submitted = false;
let studentName = '';
let studentSite = '';

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ansOf(q){ return Array.isArray(q.a) ? q.a : [q.a]; }
function ansText(q){ return ansOf(q).slice().sort().map(i=>LETTERS[i]+'. '+q.o[i]).join('；'); }
function showPage(id){
  document.getElementById('page-name').style.display = (id==='page-name') ? 'block' : 'none';
  document.getElementById('paper').style.display = (id==='paper') ? 'block' : 'none';
  document.getElementById('result').style.display = (id==='result') ? 'block' : 'none';
  document.getElementById('records').style.display = (id==='records') ? 'block' : 'none';
  window.scrollTo(0,0);
}

/* ---------- 成绩记录 ---------- */
function loadRecords(){ try { return JSON.parse(localStorage.getItem(EXAM_KEY) || '[]'); } catch(e){ return []; } }
function saveRecord(rec){
  const list = loadRecords();
  list.unshift(rec);
  localStorage.setItem(EXAM_KEY, JSON.stringify(list.slice(0, 200)));
}
function renderRecords(){
  const list = loadRecords();
  const el = document.getElementById('rec-list');
  if (!list.length){ el.innerHTML = '<div style="text-align:center;color:#999;font-size:13px;padding:16px 0;">暂无考试记录，考完第一份成绩就会出现在这里</div>'; return; }
  el.innerHTML = list.map((r,i)=>{
    const pass = r.score >= 80;
    return '<div class="rec-item"><div class="rn">'+esc(r.name)+'（'+esc(r.site||'-')+'）<div class="'+(pass?'rec-pass':'rec-fail')+'">'+(pass?'✔ 通过':'✘ 未通过')+'</div></div>'
      + '<div class="rp">'+r.acc+'%</div>'
      + '<div class="rs">'+r.score+'分</div>'
      + '<div class="rt">'+esc(r.time)+'</div></div>';
  }).join('');
}

/* ---------- 试卷 ---------- */
function build(){
  const secs = [['single','一、单选题'],['multi','二、多选题（多选/错选不得分）'],['judge','三、判断题（A=正确 B=错误）']];
  let html = '', n = 0;
  for (const [t, name] of secs){
    const qs = QS.map((q,i)=>({q,i})).filter(x=>x.q.t===t);
    if (!qs.length) continue;
    html += '<div class="sec">'+name+'</div>';
    for (const {q,i} of qs){
      n++;
      html += '<div class="q" data-i="'+i+'"><div class="qt"><span class="no">'+n+'.</span><span class="tag '+(t==='single'?'s':t==='multi'?'m':'j')+'">'+({single:'单选',multi:'多选',judge:'判断'})[t]+'</span>'+esc(q.q)+'</div>';
      html += q.o.map((o,j)=>'<div class="opt" data-q="'+i+'" data-j="'+j+'" onclick="pick(this)"><span class="key">'+LETTERS[j]+'.</span><span>'+esc(o)+'</span></div>').join('');
      html += '</div>';
    }
  }
  html += '<button class="submit" id="sub" disabled>交卷（还有 30 题未作答）</button>';
  document.getElementById('paper').innerHTML = html;
  document.getElementById('sub').onclick = submit;
}

function pick(el){
  if (submitted) return;
  const qi = +el.dataset.q, j = +el.dataset.j;
  const q = QS[qi];
  if (q.t === 'multi'){
    const set = new Set(answers[qi] || []);
    set.has(j) ? set.delete(j) : set.add(j);
    answers[qi] = [...set];
    document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(o=>o.classList.toggle('sel', set.has(+o.dataset.j)));
  } else {
    answers[qi] = [j];
    document.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(o=>o.classList.toggle('sel', +o.dataset.j===j));
  }
  refresh();
}
function refresh(){
  const done = Object.keys(answers).filter(k=>answers[k] && answers[k].length).length;
  const b = document.getElementById('sub');
  b.disabled = done < QS.length;
  b.textContent = done < QS.length ? '交卷（还有 '+(QS.length-done)+' 题未作答）' : '交卷';
}

function fmtNow(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return (d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function submit(){
  if (submitted) return;
  submitted = true;
  let right = 0;
  const review = [];
  QS.forEach((q,i)=>{
    const mine = new Set(answers[i] || []);
    const std = new Set(ansOf(q));
    const ok = mine.size===std.size && [...mine].every(x=>std.has(x));
    if (ok) right++;
    document.querySelectorAll('.opt[data-q="'+i+'"]').forEach(o=>{
      o.classList.add('locked');
      const j = +o.dataset.j;
      if (std.has(j)) o.classList.add('right');
      else if (mine.has(j)) o.classList.add('wrong');
    });
    review.push({ok, q, mine:[...mine].sort()});
  });
  const total = QS.length;
  const score = Math.round(right/total*1000)/10;
  const acc = Math.round(right/total*100);
  document.getElementById('st-t').textContent = total;
  document.getElementById('st-r').textContent = right;
  document.getElementById('st-w').textContent = total-right;
  document.getElementById('st-a').textContent = acc+'%';
  document.getElementById('rwho').innerHTML = '答题人：<b>'+esc(studentName)+'</b>（'+esc(studentSite)+'） · 成绩已记录';
  const ring = document.querySelector('#result .ring');
  ring.style.setProperty('--p', acc+'%');
  let cur = 0;
  const timer = setInterval(()=>{ cur += Math.max(1, Math.round(score/30)); if (cur>=score){cur=score;clearInterval(timer);} document.getElementById('rv').textContent = cur; }, 30);
  let msg;
  if (acc===100) msg='满分！完全掌握。';
  else if (acc>=90) msg='通过！非常优秀。';
  else if (acc>=80) msg='通过！基础扎实，巩固错题再冲高分。';
  else if (acc>=60) msg='未通过（及格线 80），请认真复习错题后重考。';
  else msg='未通过，请回课件复训后再考。';
  document.getElementById('rmsg').textContent = msg;
  saveRecord({ name: studentName, site: studentSite, score, acc, time: fmtNow() });
  _lastResult = { exam: document.querySelector('.head h1').textContent, name: studentName, site: studentSite, score, acc, pass: acc>=80, time: fmtNow() };
  pushToGitHub(_lastResult);
  sendToFeishu(_lastResult);
  window._review = review;
  renderReview(review.filter(r=>!r.ok));
  showPage('result');
}

function renderReview(list){
  const el = document.getElementById('review');
  if (!list.length){ el.innerHTML = '<h3>错题解析</h3><div style="text-align:center;color:#2eaf64;padding:8px 0;">全对，无错题 🎉</div>'; return; }
  el.innerHTML = '<h3>错题解析（'+list.length+' 道）</h3>' + list.map((r,idx)=>{
    const q = r.q;
    const yours = r.mine.length ? r.mine.map(j=>LETTERS[j]+'. '+q.o[j]).join('；') : '未作答';
    return '<div class="ri"><div class="rq">'+(idx+1)+'. 【'+({single:'单选',multi:'多选',judge:'判断'})[q.t]+'】'+esc(q.q)+'</div>'
      + '<div class="no">你的答案：'+esc(yours)+'</div>'
      + '<div class="ok">正确答案：'+esc(ansText(q))+'</div>'
      + '<div class="ra">解析：'+esc(q.e)+'</div></div>';
  }).join('');
}

function reviewAll(){
  const el = document.getElementById('review');
  el.innerHTML = '<h3>整卷回顾（'+window._review.length+' 道）</h3>' + window._review.map((r,idx)=>{
    const q = r.q;
    const yours = r.mine.length ? r.mine.map(j=>LETTERS[j]+'. '+q.o[j]).join('；') : '未作答';

      + '<div class="ra">你的答案：'+esc(yours)+'　｜　正确答案：<span class="ok">'+esc(ansText(q))+'</span></div>'
      + '<div class="ra">解析：'+esc(q.e)+'</div></div>';
  }).join('');
}

/* ---------- 飞书群通知 ---------- */
function sendToFeishu(rec){
  const text = rec.name + ' | ' + (rec.site || '-') + ' | ' + EXAM_TITLE + ' | ' + rec.score + '分';
  fetch(FS_WEBHOOK, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ msg_type: 'text', content: { text: text } })
  }).catch(() => {});
}

/* ---------- 自动回传 GitHub ---------- */
function pushToGitHub(rec, attempt){
  attempt = attempt || 0;
  const statusEl = document.getElementById('copy-tip');
  const note = (t, ok) => { statusEl.textContent = t; statusEl.style.color = ok ? '#2eaf64' : '#e6a23c'; statusEl.style.display = 'block'; };
  note('⏳ 正在自动上报成绩…', false);
  rec.serverTime = new Date().toLocaleString('zh-CN', { hour12: false });
  // 每人一个独立文件，文件名含毫秒时间戳，永不冲突
  const path = 'results/r-' + encodeURIComponent(rec.name) + '-' + Date.now() + '.json';
  const body = { message: 'exam result: ' + rec.name + ' ' + rec.score, content: btoa(unescape(encodeURIComponent(JSON.stringify(rec, null, 1)))), branch: 'main' };
  fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(r => {
    if (r.ok) { note('✔ 成绩已自动上报给培训老师', true); }
    else if (r.status === 409 && attempt < 5) { throw 'conflict'; }
    else throw 'http ' + r.status;
  })
  .catch(err => {
    if (attempt < 5) {
      note('⏳ 上报中，正在重试（' + (attempt+1) + '/5）…', false);
      setTimeout(function(){ pushToGitHub(rec, attempt + 1); }, 3000 + attempt * 2000);
    } else note('⚠ 上报失败，请点下方按钮手动复制发给老师', false);
  });
}

/* ---------- 成绩复制 ---------- */
let _lastResult = null;
function copyScore(){
  if (!_lastResult) return;
  const line = '【' + _lastResult.exam + '】' + _lastResult.name + '（' + _lastResult.site + '） ' + _lastResult.score + '分 '
    + _lastResult.acc + '% ' + (_lastResult.pass ? '通过' : '未通过') + ' ' + _lastResult.time;
  const done = () => { const t = document.getElementById('copy-tip'); t.textContent='✔ 已复制，去微信/飞书粘贴发送即可'; t.style.color='#2eaf64'; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(line).then(done).catch(()=>fallbackCopy(line, done));
  } else fallbackCopy(line, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){ window.prompt('请手动复制：', text); }
  document.body.removeChild(ta);
}
