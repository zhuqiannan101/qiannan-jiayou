<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倩楠老师的开学能量站 ☀️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #8ed6ff 0%, #cdd9ff 30%, #ffe3c9 65%, #ffeef0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow-x: hidden;
    position: relative;
    padding: 32px 16px 60px;
  }

  .sun {
    position: fixed; top: 28px; right: 34px;
    width: 86px; height: 86px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff3b0, #ffd23f 60%, #ffb52e);
    box-shadow: 0 0 40px rgba(255,210,63,0.9);
    z-index: 0; animation: sunPulse 4s ease-in-out infinite;
  }
  .sun::before, .sun::after {
    content: ""; position: absolute; inset: -15px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 22deg, #ffe28a 22deg 42deg, transparent 42deg 62deg, #ffe28a 62deg 82deg, transparent 82deg 102deg, #ffe28a 102deg 122deg, transparent 122deg 142deg, #ffe28a 142deg 162deg, transparent 162deg 182deg, #ffe28a 182deg 202deg, transparent 202deg 222deg, #ffe28a 222deg 242deg, transparent 242deg 262deg, #ffe28a 262deg 282deg, transparent 282deg 302deg, #ffe28a 302deg 322deg, transparent 322deg 342deg, #ffe28a 342deg 360deg);
    animation: sunSpin 14s linear infinite;
  }
  @keyframes sunSpin { to { transform: rotate(360deg); } }
  @keyframes sunPulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  .cloud {
    position: fixed; z-index: 0; width: 150px; height: 48px;
    background: rgba(255,255,255,0.9); border-radius: 50px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
  }
  .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  .cloud::before { width: 60px; height: 60px; top: -28px; left: 26px; }
  .cloud::after  { width: 44px; height: 44px; top: -20px; left: 74px; }
  .cloud.c1 { top: 80px;  left: -40px; animation: drift 30s linear infinite; }
  .cloud.c2 { top: 180px; left: 100%; width: 130px; animation: drift 36s linear infinite reverse; }
  @keyframes drift { from { transform: translateX(0);} to { transform: translateX(120vw);} }

  .grass {
    position: fixed; left: 0; bottom: 0; width: 100%; height: 90px; z-index: 0;
    background: linear-gradient(180deg, #b7e974, #8fd14a);
    border-radius: 60% 60% 0 0 / 30px 30px 0 0;
    box-shadow: 0 -8px 24px rgba(143,209,74,0.4);
  }

  .hero {
    position: relative; z-index: 5; text-align: center; margin-bottom: 26px; padding-top: 8px;
  }
  .hero .mascot {
    width: 82px; height: 82px; border-radius: 24px;
    margin: 0 auto 12px;
    background: linear-gradient(135deg, #ffd43b, #ff922b);
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; box-shadow: 0 8px 24px rgba(255,146,43,0.4);
    animation: rock 2.4s ease-in-out infinite;
  }
  @keyframes rock { 0%,100%{ transform: rotate(-6deg);} 50%{ transform: rotate(6deg);} }
  .hero h1 {
    font-size: 32px; font-weight: 900; letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6b6b, #ffa94d, #f76707, #40c057);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.08));
  }
  .hero p { color: #5c6b8a; font-size: 15px; margin-top: 8px; font-weight: 600; }

  .grid {
    position: relative; z-index: 5;
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
    max-width: 940px; width: 100%;
  }
  .entry {
    flex: 1 1 320px; min-width: 280px; max-width: 430px;
    background: rgba(255,255,255,0.85); border-radius: 30px;
    padding: 30px 26px 26px; box-shadow: 0 18px 42px rgba(0,0,0,0.07);
    text-align: center; text-decoration: none; color: inherit;
    border: 1px solid rgba(255,255,255,0.9); transition: transform .25s, box-shadow .25s;
    position: relative; overflow: hidden;
  }
  .entry:hover { transform: translateY(-6px); box-shadow: 0 28px 56px rgba(0,0,0,0.12); }
  .entry.child { border-top: 6px solid #ffa94d; }
  .entry.parent { border-top: 6px solid #e64980; }
  .entry-emoji { font-size: 54px; margin-bottom: 6px; display: block; animation: pulse 2.4s infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.08);} }
  .entry h2 { font-size: 22px; font-weight: 900; margin-bottom: 6px; color: #4a4a4a; }
  .entry.child h2 { color: #f76707; }
  .entry.parent h2 { color: #d6336c; }
  .entry .tag {
    display: inline-block; font-size: 11px; font-weight: 800; padding: 4px 12px;
    border-radius: 20px; margin-bottom: 12px; letter-spacing: 1px; color: #fff;
  }
  .entry.child .tag { background: linear-gradient(135deg, #ffa94d, #ff6b6b); box-shadow: 0 2px 8px rgba(255,107,107,0.35); }
  .entry.parent .tag { background: linear-gradient(135deg, #e64980, #d6336c); box-shadow: 0 2px 8px rgba(230,73,128,0.35); }
  .entry p { color: #8a8a8a; font-size: 14px; line-height: 1.8; margin-bottom: 18px; }
  .entry-btn {
    display: inline-block; padding: 12px 30px; border-radius: 50px; border: none;
    color: #fff; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; letter-spacing: 1px;
    transition: transform .15s;
  }
  .entry.child .entry-btn { background: linear-gradient(135deg, #ffa94d, #ff6b6b); box-shadow: 0 6px 18px rgba(255,107,107,0.4); }
  .entry.parent .entry-btn { background: linear-gradient(135deg, #e64980, #d6336c); box-shadow: 0 6px 18px rgba(230,73,128,0.4); }
  .entry:hover .entry-btn { transform: translateY(-2px); }

  .footer {
    position: relative; z-index: 5; color: #7a8aa0; font-size: 13px; margin-top: 34px; text-align: center;
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="grass"></div>

<div class="hero">
  <div class="mascot">🌞</div>
  <h1>倩楠老师的开学能量站</h1>
  <p>孩子天天向上 · 你已经是非常棒的父母啦</p>
</div>

<div class="grid">

  <a href="child.html" class="entry child">
    <span class="entry-emoji">🎒</span>
    <span class="tag">👦👧 写给小朋友</span>
    <h2>孩子的开学能量站</h2>
    <p>输入名字领专属鼓励，听《天天向上》给宝贝加油打气！还有脑筋急转弯，逗得宝贝哈哈大笑，开学不焦虑～</p>
    <button class="entry-btn">点这里 →</button>
  </a>

  <a href="parent.html" class="entry parent">
    <span class="entry-emoji">🦄</span>
    <span class="tag">💌 写给家长</span>
    <h2>家长的开学能量站</h2>
    <p>输入宝贝名字收一句夸夸，听《阳光彩虹小白马》！还有开学倒计时和"今日夸夸"，感谢您一暑假的陪伴，每个父母都是最棒的！</p>
    <button class="entry-btn">点这里 →</button>
  </a>

</div>

<div class="footer">
  🎵 天天向上 · 阳光彩虹小白马 &nbsp;|&nbsp; ✨ 倩楠老师 · 伴你成长 ✨<br>
  新学期，孩子加油，您也要加油！
</div>

</body>
</html>
