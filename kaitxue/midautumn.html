/* 把一条积木的文字填进元素：
     |xxx|  白色输入槽（能打字的那种）
     {xxx}  绿色运算积木（可以嵌在别的积木的槽里，里面还能再放输入槽）
     ^xxx^  下拉菜单（同色系深一档 + ▾）
     #xxx#  橙色变量
     ~旗~   绿旗
   全程用 DOM 拼装，不碰 innerHTML */
function fillInline(el, text, B, st){
  var parts = text.split(/(\{[^{}]*\}|\|[^|]*\||#[^#]*#|~[^~]*~|\^[^^]*\^)/);
  for(var i=0;i<parts.length;i++){
    var s = parts[i];
    if(!s) continue;
    var h = s.charAt(0), e = s.charAt(s.length-1);
    if(s.length > 1 && h==='{' && e==='}'){
      var so = document.createElement('span'); so.className='op';
      fillInline(so, s.slice(1,-1), B, st);       /* 运算积木里还能再嵌 */
      el.appendChild(so);
    } else if(s.length > 1 && h==='|' && e==='|'){
      var sp = document.createElement('span'); sp.className='val';
      sp.textContent = s.slice(1,-1); el.appendChild(sp);
      /* 这块积木有 tap 配置，且这是它的第一个数字 —— 做成可点的 */
      if(B.tap && !st.tapDone){
        st.tapDone = true;
        sp.className = 'val tap';
        sp.textContent = String(TUNE[B.tap.key]);
        bindTapVal(sp, B.tap);
      }
    } else if(s.length > 1 && h==='^' && e==='^'){
      var sd = document.createElement('span'); sd.className='dd';
      sd.textContent = s.slice(1,-1) + ' ▾';
      el.appendChild(sd);
    } else if(s.length > 1 && h==='~' && e==='~'){
      var sf = document.createElement('span'); sf.className='flag';
      el.appendChild(sf);
    } else if(s.length > 1 && h==='#' && e==='#'){
      var sv = document.createElement('span'); sv.className='var';
      sv.textContent = s.slice(1,-1); el.appendChild(sv);
    } else {
      el.appendChild(document.createTextNode(s));
    }
  }
}
function fillBlockText(el, B){ fillInline(el, B.t, B, {tapDone:false}); }

/* 递归画积木：有 wrap 的就画成 C 形，把子积木装进肚子里 */
function renderBlock(B, container, arr){
  if(B.wrap && B.wrap.length){
    var cw = document.createElement('div');
    cw.className = 'cwrap ' + B.c;
    var head = document.createElement('div');
    head.className = 'chead';
    fillBlockText(head, B);
    cw.appendChild(head);
    var body = document.createElement('div');
    body.className = 'cbody';
    cw.appendChild(body);
    var foot = document.createElement('div');
    foot.className = 'cfoot';
    cw.appendChild(foot);
    container.appendChild(cw);
    arr.push(cw);                      /* 高亮时整个 C 形一起发光 */
    for(var i=0;i<B.wrap.length;i++) renderBlock(B.wrap[i], body, arr);
  } else {
    var el = document.createElement('div');
    el.className = 'blk ' + B.c + (B.hat ? ' hat' : '');
    fillBlockText(el, B);
    container.appendChild(el);
    arr.push(el);
  }
}

function codeIdx(g, sec, every){
  var n = (blkEls[g] && blkEls[g].length) ? blkEls[g].length : 1;
  return Math.floor(sec/every) % n;
}

function setCode(g, b){

  }

    if(blkEls[g][b].className.indexOf(' on')<0) blkEls[g][b].className += ' on';
  }

}

  var out = [];
  for(var i=0;i<lines.length;i++){
    var yy = (ys[i] === undefined) ? 0.33 : ys[i];
    var b = new TextBurst(lines[i], H*yy);
    bursts.push(b);
    out.push(b);
  }
  return out;
}

function goScene(s){
  scene = s; sceneT = 0;
  if(s === SC.SAIL){
    ambStop();
    cpBody.className = 'running';
    showLine('caption', false); showLine('hint', false); showLine('sign', false);
    $('greet').className = '';
    $('cardLayer').className = '';
    $('tapLayer').className = '';
    waitingTap = false;
    lanternA = 0; skylineA = 0;
    bursts = []; sparks = []; rockets = []; twinkles = [];
    fwFired = []; signShown = false;
    $('caption').textContent = TXT.scene1Caption;
  }
  if(s === SC.NAME){
    showLine('caption', false);
    $('hintTxt').textContent = TXT.scene2Hint;
    waitingTap = true;
    $('tapLayer').className = 'on';
  }
  if(s === SC.FIREWORK){
    showLine('hint', false);
    showLine('caption', false);
    waitingTap = false;
    $('tapLayer').className = '';
    fwFired = [];
    for(var i=0;i<FW_LAUNCH.length;i++) fwFired.push(false);
    bursts = [];
    for(var j=0;j<FW_SEG.length;j++) FW_SEG[j].objs = null;
    ambStart();           /* 远处一直有烟花在放的环境声 */
    refreshTeacherTexts();
  }
  if(s === SC.CARD){
    refreshTeacherTexts();
    hidePlayUI();
    showLine('sign', true);
    cpBody.className = 'running';
    $('cardLayer').className = 'show';
  }
  if(s === SC.PLAY){
    /* 自己动手玩代码：把卡片收掉，画面完全露出来，
       代码小窗全部点亮（不再逐条变暗），三个发光数字随便点 */
    $('cardLayer').className = '';
    showLine('sign', false);
    cpBody.className = '';
    setCode(3, -1);
    $('playTxt').textContent = TXT.playHint;
    $('playBar').className = 'show';
    $('btnPlayDone').className = 'show';
  }
}

/* =========================================================
   主循环
   ========================================================= */
var last = 0;
function frame(ts){
  if(!last) last = ts;
  var dt = (ts - last)/1000;
  last = ts;
  if(dt > 0.05) dt = 0.05;      /* 掉帧保护 */
  globalT += dt;
  sceneT  += dt;
  var t = globalT;

  ctx.clearRect(0,0,W,H);

  /* ---------- 月亮位置 ---------- */
  var mR = clamp(Math.min(W,H)*0.082, 18, 46);
  if(scene === SC.START){
    moonPos.x = W*0.5; moonPos.y = H*0.36; moonPos.r = mR*1.25;
  } else if(scene === SC.SAIL){
    var p = eio(clamp(sceneT/sailDur(),0,1));
    moonPos.x = W*0.86 + (W*0.21 - W*0.86)*p;
    moonPos.y = H*0.84 + (H*0.155 - H*0.84)*p;
    moonPos.r = mR*(0.86 + 0.14*p);
  } else {
    moonPos.x = W*0.21; moonPos.y = H*0.155; moonPos.r = mR;
  }

  /* ---------- 背景 ---------- */
  drawSky(t);
  updateClouds(dt);
  updateMeteor(dt);
  drawClouds(0);                 /* 远处的云，在月亮后面 */

  /* 第0幕只画月亮，不画水 */
  if(scene === SC.START){
    drawMeteor();
    drawWaterSoft(t);
    setCode(-1,-1);
  } else {
    drawMoon(moonPos.x, moonPos.y, moonPos.r, t, 1);
    drawClouds(1);               /* 一条薄云会从月亮前面慢慢飘过去 */
    drawMeteor();
    /* 城市剪影（第3幕淡入） */
    if(scene === SC.FIREWORK || scene === SC.PLAY) skylineA = clamp(skylineA + dt*0.7, 0, 1);
    drawCity(t, skylineA);
    drawWater(t, moonPos.x);
    drawBridge(t, skylineA);   /* 桥画在水之后，桥洞里才看得见水 */
    drawRivers(dt, t);           /* 水上漂着的河灯 */
    drawBoat(t);
  }

  /* ---------- 灯笼 ---------- */
  if(scene === SC.NAME || scene === SC.FIREWORK || scene === SC.CARD || scene === SC.PLAY){
    lanternA = clamp(lanternA + dt*0.6, 0, 1);
  }
  /* 有祝福语正在天上时，灯笼收一收光，字才读得清 */
  var textOn = false;
  for(var bi=0; bi<bursts.length; bi++){
    if(bursts[bi].state === 'gather' || bursts[bi].state === 'hold'){ textOn = true; break; }
  }
  lanternDim += ((textOn ? 0.38 : 1) - lanternDim) * Math.min(1, dt*2.6);
  drawLanterns(t, lanternA * lanternDim);
  drawPetals(dt, t);             /* 桂花瓣飘在最前面 */

  /* ---------- 分幕逻辑 ---------- */
  if(scene === SC.SAIL){
    if(sceneT > Math.min(1.4, sailDur()*0.18)) showLine('caption', true);
    /* 代码小窗：前 4 秒讲月亮，后 4 秒讲小船 */
    var half = sailDur()/2;
    if(sceneT < half){
      setCode(0, codeIdx(0, sceneT, 0.72));
    } else {
      setCode(1, codeIdx(1, sceneT-half, 0.72));
    }
    if(sceneT >= sailDur()) goScene(SC.NAME);
  }
  else if(scene === SC.NAME){
    if(waitingTap) showLine('hint', true);
    setCode(2, codeIdx(2, sceneT, 0.85));
    drawTwinkles(dt, t);
  }
  else if(scene === SC.FIREWORK){
    setCode(3, codeIdx(3, sceneT, 0.78));
    /* 发射 */
    for(var i=0;i<FW_LAUNCH.length;i++){
      if(!fwFired[i] && sceneT >= FW_LAUNCH[i]){ fwFired[i] = true; launchFirework(); }
    }
    /* 三段祝福语 */
    for(var j=0;j<FW_SEG.length;j++){
      var S = FW_SEG[j];
      if(!S.objs && sceneT >= S['in']){
        var lines = (j===0) ? TXT.fw1 : (j===1 ? TXT.fw2(userName) : TXT.fw3(userName));
        S.objs = makeLines(lines);
      }
      if(S.objs && S.objs.length && sceneT >= S.out &&
         S.objs[0].state !== 'release' && S.objs[0].state !== 'done'){
        for(var m=0;m<S.objs.length;m++) S.objs[m].release();
      }
    }
    /* 落款 */
    if(!signShown && sceneT >= FW_SIGN){
      signShown = true;
      refreshTeacherTexts();
      showLine('sign', true);
    }
    if(sceneT >= FW_END) goScene(SC.CARD);
  }
  else if(scene === SC.CARD){
    /* 定格，偶尔来一朵远处的烟花，保持画面有呼吸 */
    setCode(3, codeIdx(3, sceneT, 0.78));
    if(Math.random() < dt*0.30) launchFirework();
  }
  else if(scene === SC.PLAY){
    /* 交给孩子：不自动放烟花，天上发生什么全看他点了什么 */
    if(Math.random() < dt*0.12) launchFirework();
  }

  /* ---------- 烟花 & 粒子字 ---------- */
  if(scene !== SC.START){
    updateFireworks(dt, t);
    drawFireworks(t);
    for(var k=bursts.length-1;k>=0;k--){
      bursts[k].update(dt, t);
      if(bursts[k].state === 'done'){ bursts.splice(k,1); continue; }
      bursts[k].draw(t);
    }
  }

  window.requestAnimationFrame(frame);
}

/* 第0幕底部一点点柔和水光，画面不至于太空 */
function drawWaterSoft(t){
  var wy = H*0.86;
  var g = ctx.createLinearGradient(0,wy,0,H);
  g.addColorStop(0,'rgba(20,50,95,0)');
  g.addColorStop(1,'rgba(16,44,86,.85)');
  ctx.fillStyle = g;
  ctx.fillRect(0,wy,W,H-wy);
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.strokeStyle = '#9fc6ff';
  ctx.lineWidth = 1;
  for(var i=0;i<3;i++){
    ctx.beginPath();
    for(var x=0;x<=W;x+=8){
      var y = wy + 14 + i*14 + Math.sin(x/50 + t + i)*2.4;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}


/* =========================================================
   小船票：把整个画面重新画成一张竖版图片，长按可以存到相册
   （微信里 canvas 长按存不了图，所以要先转成 <img>）
   ========================================================= */
function drawTicket(name, teacher, target){
  var TW = 750, TH = 1150;
  var oc = document.createElement('canvas');
  oc.width = TW; oc.height = TH;
  var g = oc.getContext('2d');
  if(!g) return '';

  function fam(){ return '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'; }
  /* 圆角矩形路径（只建路径，由调用方 fill/stroke） */
  function rrect(x,y,w,h,r){
    if(r > w/2) r = w/2;
    if(r > h/2) r = h/2;
    g.beginPath();
    g.moveTo(x+r, y);
    g.lineTo(x+w-r, y);
    g.quadraticCurveTo(x+w, y, x+w, y+r);
    g.lineTo(x+w, y+h-r);
    g.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    g.lineTo(x+r, y+h);
    g.quadraticCurveTo(x, y+h, x, y+h-r);
    g.lineTo(x, y+r);
    g.quadraticCurveTo(x, y, x+r, y);
    g.closePath();
  }
  function ell(x,y,rx,ry){
    if(rx<=0||ry<=0) return;
    g.save(); g.translate(x,y); g.scale(1, ry/rx);
    g.beginPath(); g.arc(0,0,rx,0,Math.PI*2); g.restore();
  }
  /* 固定种子，保证每次生成的票面一致 */
  var seed = 20260925;
  function sr(){ seed = (seed*9301 + 49297) % 233280; return seed/233280; }
  function sv(a,b){ return a + sr()*(b-a); }

  var WY = 742;   /* 水平线 */

  /* ---- 夜空 ---- */
  var sky = g.createLinearGradient(0,0,0,TH);
  sky.addColorStop(0,   '#040817');
  sky.addColorStop(0.40,'#0b1738');
  sky.addColorStop(0.68,'#132c58');
  sky.addColorStop(1,   '#0a1832');
  g.fillStyle = sky; g.fillRect(0,0,TW,TH);

  /* ---- 星星 ---- */
  for(var i=0;i<130;i++){
    var sx = sv(0,TW), sy = sv(0,WY-60);
    g.globalAlpha = sv(0.25,0.85);
    g.fillStyle = '#dce9ff';
    g.beginPath(); g.arc(sx, sy, sv(0.8,2.4), 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;

  /* ---- 月亮（月中有嫦娥、玉兔和桂树） ---- */
  var mx = 190, my = 218, mr = 86;
  var gl = g.createRadialGradient(mx,my,mr*0.6, mx,my, mr*4.2);
  gl.addColorStop(0,   'rgba(255,232,175,.34)');
  gl.addColorStop(0.35,'rgba(255,214,150,.13)');
  gl.addColorStop(1,   'rgba(255,200,130,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(mx,my,mr*4.2,0,Math.PI*2); g.fill();
  var gm = g.createRadialGradient(mx-mr*0.3, my-mr*0.34, mr*0.12, mx, my, mr*1.05);
  gm.addColorStop(0,'#fffdf1'); gm.addColorStop(0.5,'#fdf2cf'); gm.addColorStop(1,'#f1d491');
  g.fillStyle = gm; g.beginPath(); g.arc(mx,my,mr,0,Math.PI*2); g.fill();
  g.save();
  g.beginPath(); g.arc(mx,my,mr,0,Math.PI*2); g.clip();
  g.fillStyle = 'rgba(228,203,148,.30)';
  var cr = [[-0.34,-0.52,0.13],[0.52,-0.20,0.10],[0.66,0.20,0.075],[-0.12,0.62,0.085]];
  for(var c=0;c<cr.length;c++){
    g.beginPath(); g.arc(mx+cr[c][0]*mr, my+cr[c][1]*mr, cr[c][2]*mr, 0, Math.PI*2); g.fill();
  }
  g.save(); g.translate(mx,my); drawMoonFigures(g, mr); g.restore();
  g.restore();
  var ge2 = g.createRadialGradient(mx,my,mr*0.72, mx,my,mr);
  ge2.addColorStop(0,'rgba(200,170,110,0)');
  ge2.addColorStop(1,'rgba(186,152,92,.28)');
  g.fillStyle = ge2; g.beginPath(); g.arc(mx,my,mr,0,Math.PI*2); g.fill();

  /* ---- 烟花（静态定格） ---- */
  var FW = [
    {x:545, y:180, r:152, c:[255,214,132], rays:32},
    {x:660, y:378, r:92,  c:[232,158,255], rays:26},
    {x:322, y:408, r:104, c:[143,216,255], rays:28}
  ];
  g.save();
  g.globalCompositeOperation = 'lighter';
  for(var f=0;f<FW.length;f++){
    var F = FW[f];
    var col = 'rgb('+F.c[0]+','+F.c[1]+','+F.c[2]+')';
    for(var ry=0; ry<F.rays; ry++){
      var ang = (ry/F.rays)*Math.PI*2 + sv(-0.06,0.06);
      var len = F.r * sv(0.62,1.0);
      var t0r = sv(0.0, 0.20);
      for(var dd=0; dd<=7; dd++){
        var tt = t0r + (1-t0r)*(dd/7);
        g.globalAlpha = (1 - tt*0.55)*0.9;
        g.fillStyle = col;
        g.beginPath();
        g.arc(F.x+Math.cos(ang)*len*tt, F.y+Math.sin(ang)*len*tt, 3.6*(1-tt*0.5), 0, Math.PI*2);
        g.fill();
      }
    }
  }
  g.restore(); g.globalAlpha = 1;

  /* ---- 一条薄云 ---- */
  for(var cl=0; cl<4; cl++){
    var ccx = 120 + cl*190, ccy = 300 + (cl%2 ? -22 : 14), ccr = 92 - (cl%2)*18;
    var cg = g.createRadialGradient(ccx, ccy, 0, ccx, ccy, ccr);
    cg.addColorStop(0,   'rgba(152,184,240,.085)');
    cg.addColorStop(0.55,'rgba(132,166,226,.042)');
    cg.addColorStop(1,   'rgba(120,155,215,0)');
    g.fillStyle = cg; g.beginPath(); g.arc(ccx,ccy,ccr,0,Math.PI*2); g.fill();
  }

  /* ---- 城市：远层 + 主楼群 + 宝塔 ---- */
  var bx = -16;
  while(bx < TW+16){
    var fw2 = sv(TW*0.05, TW*0.13), fh2 = sv(TH*0.035, TH*0.085);
    g.fillStyle = '#0a1228';
    g.fillRect(bx, WY-fh2-12, fw2, fh2+12);
    bx += fw2 + sv(3,11);
  }
  bx = -18;
  while(bx < TW+18){
    var bw = sv(TW*0.065, TW*0.155), bh = sv(TH*0.055, TH*0.165);
    var top = WY - bh;
    var bg2 = g.createLinearGradient(0, top, 0, WY);
    bg2.addColorStop(0,'#12203f'); bg2.addColorStop(1,'#060d20');
    g.fillStyle = bg2; g.fillRect(bx, top, bw, bh);
    g.fillStyle = 'rgba(150,185,245,.15)'; g.fillRect(bx, top, bw, 2);
    var st = sr();
    if(st < 0.22){
      g.fillStyle = bg2;
      g.fillRect(bx+bw*0.18, top-bh*0.10, bw*0.64, bh*0.10);
      g.fillRect(bx+bw*0.34, top-bh*0.17, bw*0.32, bh*0.07);
    }else if(st < 0.36){
      g.fillStyle = '#16224a'; g.fillRect(bx+bw/2-1.4, top-26, 2.8, 26);
      g.fillStyle = 'rgba(255,120,110,.75)';
      g.beginPath(); g.arc(bx+bw/2, top-28, 2.6, 0, Math.PI*2); g.fill();
    }else if(st < 0.50){
      g.fillStyle = '#16224a'; eave(g, bx+bw/2, top, bw*0.62, 16);
    }
    var cols = Math.max(1, Math.floor(bw/24)), rows = Math.max(1, Math.floor(bh/32));
    for(var cc=0; cc<cols; cc++){
      for(var rr2=0; rr2<rows; rr2++){
        if(sr() < 0.36){
          g.fillStyle = 'rgba(255,214,140,'+sv(0.25,0.62)+')';
          g.fillRect(bx + cc*(bw/cols) + (bw/cols)*0.26, top + rr2*(bh/rows) + (bh/rows)*0.24,
                     (bw/cols)*0.44, (bh/rows)*0.42);
        }
      }
    }
    bx += bw + sv(2,12);
  }
  drawPagoda(g, TW*0.155, WY, TH*0.205);

  /* ---- 水面 ---- */
  var wg = g.createLinearGradient(0,WY,0,TH);
  wg.addColorStop(0,'#123058'); wg.addColorStop(0.35,'#0d2246'); wg.addColorStop(1,'#07142c');
  g.fillStyle = wg; g.fillRect(0, WY, TW, TH-WY);
  g.save(); g.globalCompositeOperation='lighter';
  for(var q=0;q<16;q++){
    var qy = WY + (TH-WY)*(q/16) + 4;
    var qw = (TW*0.10)*(1+q*0.16);
    g.globalAlpha = 0.085*(1-q/18);
    g.fillStyle = '#ffe6b0';
    ell(mx + Math.sin(q*0.8)*14, qy, qw/2, 3); g.fill();
  }
  g.restore(); g.globalAlpha = 1;
  g.lineWidth = 2;
  for(var w2=0;w2<6;w2++){
    var pp = w2/6, wyb = WY + (TH-WY)*(0.06+pp*0.92);
    g.globalAlpha = 0.16 - pp*0.016;
    g.strokeStyle = '#9fc6ff';
    g.beginPath();
    for(var xx=0; xx<=TW; xx+=10){
      var yy2 = wyb + Math.sin(xx/(TW/(5-pp*2)) + w2)*(3+pp*8);
      if(xx===0) g.moveTo(xx,yy2); else g.lineTo(xx,yy2);
    }
    g.stroke();
  }
  g.globalAlpha = 1;

  /* ---- 石拱桥：先画在临时画布上再贴过来，
         否则 destination-out 会把下面的水面一起挖穿 ---- */
  (function bridge(){
    var bc = document.createElement('canvas');
    bc.width = TW; bc.height = TH;
    var bgx = bc.getContext('2d');
    if(!bgx) return;
    var x0 = TW*0.34, x1 = TW*1.02, span = x1-x0;
    var rise = TH*0.070, deckY = WY + 6, deckH = 14, footY = WY + (TH-WY)*0.10;
    function deck(px){
      var u = Math.max(0, Math.min(1,(px-x0)/span));
      return deckY - rise*Math.pow(Math.sin(Math.PI*u), 0.72);
    }
    var bg3 = bgx.createLinearGradient(0, deckY-rise, 0, footY);
    bg3.addColorStop(0,'#2a3a6b'); bg3.addColorStop(0.5,'#1c2a55'); bg3.addColorStop(1,'#0e1730');
    bgx.fillStyle = bg3;
    bgx.beginPath(); bgx.moveTo(x0, footY);
    for(var px=x0; px<=x1; px+=3) bgx.lineTo(px, deck(px));
    bgx.lineTo(x1, footY); bgx.closePath(); bgx.fill();

    var arcs = [{u:0.44,r:span*0.150},{u:0.17,r:span*0.082},{u:0.71,r:span*0.094}];
    bgx.globalCompositeOperation='destination-out';
    for(var i2=0;i2<arcs.length;i2++){
      var a3=arcs[i2], acx=x0+span*a3.u, cy3=deck(acx)+deckH+a3.r;
      bgx.beginPath(); bgx.moveTo(acx-a3.r, cy3); bgx.arc(acx, cy3, a3.r, Math.PI, 0);
      bgx.lineTo(acx+a3.r, footY+80); bgx.lineTo(acx-a3.r, footY+80); bgx.closePath(); bgx.fill();
    }
    bgx.globalCompositeOperation='source-atop';
    bgx.strokeStyle='rgba(170,200,250,.22)'; bgx.lineWidth=3;
    for(var k2=0;k2<arcs.length;k2++){
      var a4=arcs[k2], ax4=x0+span*a4.u, cy4=deck(ax4)+deckH+a4.r;
      bgx.beginPath(); bgx.arc(ax4, cy4, a4.r, Math.PI, 0); bgx.stroke();
    }
    bgx.globalCompositeOperation='source-over';

    bgx.strokeStyle='rgba(170,205,255,.30)'; bgx.lineWidth=2.4;
    bgx.beginPath();
    for(var p2=x0;p2<=x1;p2+=3){ if(p2===x0) bgx.moveTo(p2,deck(p2)); else bgx.lineTo(p2,deck(p2)); }
    bgx.stroke();
    var railH=26, step=Math.max(20, span/22);
    for(var p3=x0+step*0.4;p3<x1;p3+=step){
      var dy3=deck(p3);
      bgx.fillStyle='#1b2a56'; bgx.fillRect(p3-1.8, dy3-railH, 3.6, railH);
      bgx.fillStyle='rgba(180,210,255,.22)'; bgx.fillRect(p3-1.8, dy3-railH, 3.6, 2);
    }
    bgx.strokeStyle='rgba(160,195,255,.34)'; bgx.lineWidth=2;
    bgx.beginPath();
    for(var p4=x0;p4<=x1;p4+=3){ var yy4=deck(p4)-railH; if(p4===x0) bgx.moveTo(p4,yy4); else bgx.lineTo(p4,yy4); }
    bgx.stroke();
    for(var m2=0;m2<7;m2++){
      var lx2=x0+span*(0.06+m2*0.145); if(lx2>x1) break;
      var ly2=deck(lx2)-railH-8;
      var lg2=bgx.createRadialGradient(lx2,ly2,0,lx2,ly2,34);
      lg2.addColorStop(0,'rgba(255,200,120,.70)'); lg2.addColorStop(1,'rgba(255,170,80,0)');
      bgx.fillStyle=lg2; bgx.beginPath(); bgx.arc(lx2,ly2,34,0,Math.PI*2); bgx.fill();
      bgx.fillStyle='rgba(255,230,175,.95)'; bgx.beginPath(); bgx.arc(lx2,ly2,3,0,Math.PI*2); bgx.fill();
    }
    g.drawImage(bc, 0, 0);

    /* 桥在水里的倒影 */
    g.save();
    g.globalAlpha = 0.16;
    g.translate(0, WY*2 + 10);
    g.scale(1, -0.42);
    g.drawImage(bc, 0, 0);
    g.restore();
    g.globalAlpha = 1;
  })();

  /* ---- 水上的河灯 ---- */
  function riverLamp(lx, ly, ls){
    g.save(); g.translate(lx, ly);
    g.save(); g.globalCompositeOperation='lighter';
    for(var rk=1; rk<=5; rk++){
      g.globalAlpha = 0.17*(1-rk/6);
      g.fillStyle = '#ffc478';
      ell(0, rk*9*ls, (14+rk*7)*ls/2, 2.6*ls); g.fill();
    }
    var rg = g.createRadialGradient(0,-8*ls,0,0,-8*ls,40*ls);
    rg.addColorStop(0,'rgba(255,190,110,.50)');
    rg.addColorStop(1,'rgba(255,160,70,0)');
    g.fillStyle = rg; g.globalAlpha = 1;
    g.beginPath(); g.arc(0,-8*ls,40*ls,0,Math.PI*2); g.fill();
    g.restore();
    g.fillStyle = 'rgba(255,190,112,.9)';
    g.beginPath();
    g.moveTo(-16*ls,0); g.lineTo(16*ls,0); g.lineTo(10*ls,-9*ls); g.lineTo(-10*ls,-9*ls);
    g.closePath(); g.fill();
    g.fillStyle = '#fff2cf';
    g.beginPath(); g.arc(0,-14*ls,4.4*ls,0,Math.PI*2); g.fill();
    g.restore();
  }
  riverLamp(122, 930, 0.95);
  riverLamp(604, 1010, 1.08);

  /* ---- 中式木船 ---- */
  g.save();
  g.translate(322, 872); g.scale(2.45,2.45); g.rotate(-0.02);
  g.save(); g.globalAlpha=0.15; g.translate(0, 9); g.scale(1,-0.5);
  drawBoatShape(g, 0.7, true); g.restore();
  drawBoatShape(g, 0.7);
  g.restore();

  /* ---- 灯笼 ---- */
  (function lanterns(){
    if(!lanternImg) buildLanternImg(52);
    var iw = lanternImg.width/2, ih = lanternImg.height/2;
    var ax2 = lanternImg.__cx/2, ay2 = lanternImg.__cy/2;
    var defs = [

  /* ---- 飘着的桂花瓣 ---- */
  for(var pt=0; pt<22; pt++){
    var px2 = sv(20, TW-20), py2 = sv(90, TH-90);
    if((py2 > 430 && py2 < 660) || py2 > 950) continue;
    g.save();
    g.translate(px2, py2);
    g.rotate(sv(0, Math.PI*2));
    g.globalAlpha = sv(0.22, 0.55);
    g.fillStyle = '#ffdf9e';
    ell(0, 0, sv(3.2,6.2), sv(1.7,3.2)); g.fill();
    g.restore();
  }
  g.globalAlpha = 1;

  /* ---- 文字后面的一层夜雾（保证字永远读得清） ---- */
  var haze = g.createLinearGradient(0, 380, 0, 690);
  haze.addColorStop(0,   'rgba(4,8,22,0)');
  haze.addColorStop(0.38,'rgba(4,8,22,.55)');
  haze.addColorStop(0.74,'rgba(4,8,22,.46)');
  haze.addColorStop(1,   'rgba(4,8,22,0)');
  g.fillStyle = haze; g.fillRect(0, 380, TW, 310);

  /* ---- 文字 ---- */
  g.textAlign = 'center';
  g.textBaseline = 'middle';

  /* 自动缩字，保证一行放得下 */
  function fit(text, weight, start, maxRatio, minPx){
    var px = start;
    g.font = weight + ' ' + px + 'px ' + fam();
    while(g.measureText(text).width > TW*maxRatio && px > minPx){
      px -= 1; g.font = weight + ' ' + px + 'px ' + fam();
    }
    return px;
  }

  /* 中秋快乐 */
  var big = fit(TXT.ticketMid, '700', 88, 0.80, 30);
  var tg = g.createLinearGradient(0, 470, 0, 470+big);
  tg.addColorStop(0,'#fffaea'); tg.addColorStop(1,'#f2c877');
  g.save();
  g.shadowColor = 'rgba(255,196,110,.85)'; g.shadowBlur = 34;
  g.fillStyle = tg;
  g.fillText(TXT.ticketMid, TW/2, 502);
  g.restore();

  /* 「XX 送给 爸爸妈妈」—— 整张贺卡的主角是孩子 */
  var sendLine = TXT.ticketSend(name, target);
  fit(sendLine, '500', 40, 0.80, 20);
  g.save();
  g.shadowColor = 'rgba(255,210,140,.5)'; g.shadowBlur = 16;
  g.fillStyle = '#ffeec4';
  g.fillText(sendLine, TW/2, 596);
  g.restore();

  /* 老师的祝福 */
  var byLine = TXT.ticketBy(teacher, name);
  fit(byLine, '400', 26, 0.84, 15);
  g.fillStyle = 'rgba(255,228,176,.62)';
  g.fillText(byLine, TW/2, 972);

  /* ---- 左下角：一枚图形化编程积木，当这张贺卡的印章 ----
     不写「由图形化编程制作」那种水印口气，直接把积木画出来：
     形状本身就是图形化编程的符号，而且它说的正是贺卡正中那四个字。 */
  (function codeStamp(){
    var label = '说';
    var slot  = TXT.ticketMid.replace(/\s/g, '');   /* 中秋快乐 */
    var bx = 54, by = 1006, bh = 56;
    g.save();
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.globalAlpha = 0.82;

    g.font = '500 29px ' + fam();
    var wLabel = g.measureText(label).width;
    g.font = '500 25px ' + fam();
    var wSlot = g.measureText(slot).width;
    var padX = 16, gap = 10, slotPad = 14;
    var slotW = wSlot + slotPad*2;
    var bw = padX + wLabel + gap + slotW + padX;

    /* 积木体（外观类紫色，跟页面代码小窗里的「说」积木同色） */
    g.fillStyle = '#9966ff';
    rrect(bx, by, bw, bh, 9); g.fill();
    /* 顶部凹槽 */
    g.fillStyle = 'rgba(0,0,0,.22)';
    rrect(bx+17, by, 24, 8, 3); g.fill();
    /* 底部凸起 */
    g.fillStyle = '#9966ff';
    rrect(bx+17, by+bh, 24, 8, 3); g.fill();
    /* 「说」 */
    g.fillStyle = '#fff';
    g.font = '500 29px ' + fam();
    g.fillText(label, bx + padX, by + bh/2);
    /* 白色输入槽 + 里面的「中秋快乐」 */
    g.fillStyle = 'rgba(255,255,255,.94)';
    rrect(bx + padX + wLabel + gap, by + (bh-35)/2, slotW, 35, 17.5); g.fill();
    g.fillStyle = '#2b2b2b';
    g.font = '500 25px ' + fam();
    g.fillText(slot, bx + padX + wLabel + gap + slotPad, by + bh/2);

    /* 积木底下一行很轻的小字，给不认识积木的人看 */
    g.globalAlpha = 1;
    g.font = '400 22px ' + fam();
    g.fillStyle = 'rgba(200,215,245,.40)';
    g.fillText(TXT.ticketStamp, bx + 3, by + bh + 32);
    g.restore();
  })();

  /* ---- 票面边框 ---- */
  g.strokeStyle = 'rgba(255,225,170,.28)';
  g.lineWidth = 2;
  rrect(16, 16, TW-32, TH-32, 22);
  g.stroke();

  try { return oc.toDataURL('image/jpeg', 0.88); }
  catch(e){ return ''; }
}

var ticketEl = $('ticket');

var chipEls = [];

/* 「送给谁」的一排按钮：点谁，贺卡就重画成送给谁 */
function buildTicketChips(){
  var box = $('ticketChips');
  box.innerHTML = '';
  chipEls = [];
  var list = TXT.ticketTargets.concat(['其他']);
  for(var i=0;i<list.length;i++){
    var btn = document.createElement('button');
    btn.textContent = list[i];
    box.appendChild(btn);
    chipEls.push(btn);
    (function(label, isOther, el){
      el.addEventListener('click', function(){
        if(isOther){
          openModal(TXT.ticketOther, TXT.ticketOtherTip, '', 6, function(v){
            var t = safeName(v);
            if(!t) return;
            ticketTarget = t;
            el.textContent = t;
            markChips();
            renderTicket();
          });
        } else {
          ticketTarget = label;
          markChips();
          renderTicket();
        }
      });
    })(list[i], i === list.length-1, btn);
  }
  markChips();
}
function markChips(){
  for(var i=0;i<chipEls.length;i++){
    chipEls[i].className = (chipEls[i].textContent === ticketTarget) ? 'on' : '';

}

function renderTicket(){

    var url = '';

    if(url){
      $('ticketImg').src = url;
      $('ticketImg').style.visibility = 'visible';

      $('ticketTip').textContent = TXT.ticketTip(ticketTarget);

      $('ticketWait').textContent = '这台手机画不了图，直接截屏也一样好看 ✨';

}

function openTicket(){

/* =========================================================
   老师的语音祝福
   ---------------------------------------------------------
   来源优先级：
     1) 这台设备上刚录的（localStorage，只给老师自己预览用）
     2) BAKED_VOICE —— 已经烤进 HTML 的，家长打开就能听
     3) 同目录下的 teacher-voice.mp3（老师想手动放文件时用）
   关键：1 只在老师自己手机上有。要让家长听到，必须用后台的
        「导出带语音的 HTML」生成新文件，再替换服务器上那份。
   ========================================================= */
var voiceSrc = '';        /* 原始来源（data: 或 ./teacher-voice.mp3） */
var voicePlayUrl = '';    /* 真正喂给 <audio> 的地址（data: 会转成 blob:） */
var voiceAudio = null, voiceLoaded = '', voicePlaying = false, voiceWatch = null;
var voiceBuf = null, voiceNode = null, bgmWasOn = false;
/* 语音播放响度：不用固定倍数，而是先量一下这段录音有多响，
   再自动放大到统一的目标响度 —— 不管是新录的还是以前导出的，听感都一样。
   想整体再响一点就把 VOICE_TARGET_RMS 调大（比如 0.32），太吵就调到 0.20。 */
var VOICE_TARGET_RMS = 0.26;
var VOICE_MAX_GAIN = 8;
var voiceGainVal = 1;

/* 量一下这段音频的平均能量，算出要放大多少倍 */
function measureVoiceGain(buf){
  try{
    var d = buf.getChannelData(0);
    var step = Math.max(1, Math.floor(d.length/40000));
    var sum = 0, n = 0;
    for(var i=0;i<d.length;i+=step){ sum += d[i]*d[i]; n++; }
    var rms = Math.sqrt(sum/Math.max(1,n));
    if(rms < 0.0008) return 1;
    return Math.max(1, Math.min(VOICE_MAX_GAIN, VOICE_TARGET_RMS/rms));
  }catch(e){ return 1; }
}

/* 把 data:URL 变成 blob:URL —— 微信内核放超长 data:URL 经常失败 */
function dataUrlToBlobUrl(u){
  try{
    if(u.indexOf('data:') !== 0) return u;
    var k = u.lastIndexOf('base64,');
    var c = k >= 0 ? k + 7 : (u.indexOf(',') + 1);
    if(c <= 0) return u;
    var mime = (u.slice(5, u.indexOf(';') > 0 ? u.indexOf(';') : c-1).split(';')[0]) || 'audio/wav';
    var bin = window.atob(u.slice(c));
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([arr], {type:mime}));
  }catch(e){ return u; }
}
function setVoiceSource(u){
  voiceSrc = u || '';
  voiceBuf = null;
  if(voicePlayUrl && voicePlayUrl.indexOf('blob:') === 0){
    try{ URL.revokeObjectURL(voicePlayUrl); }catch(e){}
  }
  voicePlayUrl = voiceSrc ? dataUrlToBlobUrl(voiceSrc) : '';
  voiceLoaded = '';
}

function applyVoiceUI(){
  var b = $('btnVoice');
  if(!b) return;
  b.className = voiceSrc ? 'on' : '';
  $('btnVoiceTxt').textContent = TXT.voiceBtn;
}

function resolveVoice(){
  var ls = lsGet(LS_VOICE);
  if(ls){ setVoiceSource(ls); applyVoiceUI(); return; }
  if(BAKED_VOICE){ setVoiceSource(BAKED_VOICE); applyVoiceUI(); return; }
  /* 同目录有没有 teacher-voice.mp3？没有就安静地算了 */
  try{
    var probe = new Audio();
    probe.preload = 'metadata';
    probe.addEventListener('loadedmetadata', function(){
      if(!voiceSrc){ setVoiceSource('./teacher-voice.mp3'); applyVoiceUI(); }
    });
    probe.src = './teacher-voice.mp3';
  }catch(e){}
}

/* 一段 10 毫秒的纯静音音频，专门用来做「解锁」 */
var SILENT_CLIP = 'data:audio/wav;base64,UklGRsQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YaAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';

/* 微信 / iOS 要求音频必须在一次真实的用户手势里"解锁"过，之后才允许播。
   注意：解锁只能用上面那段静音，绝不能拿真语音去播 ——
   之前那版用真语音静音播再暂停，静音/暂停没按预期生效，一点开始整段就放出来了。 */
var voiceUnlocked = false;
function unlockVoice(){
  if(voiceUnlocked) return;
  voiceUnlocked = true;
  /* Web Audio：放一个 1 帧的空 buffer 就算解锁，绝对无声 */
  try{
    if(actx){
      var b = actx.createBuffer(1, 1, 22050);
      var sn = actx.createBufferSource();
      sn.buffer = b;
      sn.connect(actx.destination);
      sn.start(0);
    }
  }catch(e){}
  /* <audio> 退路也解锁一次，播的是那段静音，跟老师的语音完全无关 */
  try{
    ensureVoiceEl();
    voiceAudio.src = SILENT_CLIP;
    voiceLoaded = '';            /* 真要播语音时会重新设 src */
    var pr = voiceAudio.play();
    if(pr && pr['catch']) pr['catch'](function(){});
    setTimeout(function(){
      try{ voiceAudio.pause(); voiceAudio.currentTime = 0; }catch(e){}
    }, 250);
  }catch(e){}
}
function ensureVoiceEl(){
  if(voiceAudio) return;
  voiceAudio = document.createElement('audio');
  voiceAudio.id = 'voiceEl';
  voiceAudio.preload = 'auto';
  voiceAudio.setAttribute('playsinline','');
  voiceAudio.setAttribute('webkit-playsinline','');
  voiceAudio.style.display = 'none';
  voiceAudio.addEventListener('ended', stopVoice);
  voiceAudio.addEventListener('error', function(){ voiceFail(); });
  /* 挂进 DOM：部分 webview 对游离的 Audio 对象支持不好 */
  try{ document.body.appendChild(voiceAudio); }catch(e){}
}

/* iOS / 微信 的 webview 常常只给一路音频通道，背景音乐不让路的话语音就是哑的。
   所以放语音时把 BGM 整个暂停，放完再接上。 */
function bgmAside(on){
  if(!bgm){
    if(on) ambSet(0.03, 0.35);
    else if(!muted) ambSet(AMB_VOL, 0.8);
    return;
  }
  try{
    if(on){
      bgmWasOn = !bgm.paused;
      bgm.pause();
      ambSet(0.03, 0.35);          /* 环境声让一让，听清老师说话 */
    }else if(bgmWasOn && !muted){
      bgm.volume = 0;
      var p = bgm.play();
      if(p && p['catch']) p['catch'](function(){});
      fadeBgmTo(BGM_VOL, 900);               /* 老师讲完话，音乐柔和地回来 */
    }
    if(!on && !muted) ambSet(AMB_VOL, 0.8);
  }catch(e){}
}

/* 把语音解码成 AudioBuffer：微信里用 Web Audio 播比 <audio> 靠谱得多，
   而且 AudioContext 在「点击开始」那一下已经解锁过了 */
function decodeVoiceBuf(){
  if(!actx || voiceBuf || !voiceSrc) return;
  function finish(ab){
    try{
      var ok = function(b){ voiceBuf = b; voiceGainVal = measureVoiceGain(b); };
      var pr = actx.decodeAudioData(ab, ok, function(){});
      if(pr && pr.then) pr.then(ok)['catch'](function(){});
    }catch(e){}
  }
  try{
    if(voiceSrc.indexOf('data:') === 0){
      var c = voiceSrc.indexOf(',');
      var bin = window.atob(voiceSrc.slice(c+1));
      var arr = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      finish(arr.buffer);
    }else{
      var x = new XMLHttpRequest();
      x.open('GET', voiceSrc, true);
      x.responseType = 'arraybuffer';
      x.onload = function(){ if(x.response) finish(x.response); };
      x.onerror = function(){};
      x.send();
    }
  }catch(e){}
}

function stopVoice(){
  if(voiceWatch){ clearTimeout(voiceWatch); voiceWatch = null; }
  if(voiceNode){ try{ voiceNode.onended = null; voiceNode.stop(0); }catch(e){} voiceNode = null; }
  if(voiceAudio){ try{ voiceAudio.pause(); }catch(e){} }
  voicePlaying = false;
  if($('btnVoice')){
    $('btnVoice').className = voiceSrc ? 'on' : '';
    $('btnVoiceTxt').textContent = TXT.voiceBtn;
  }
  bgmAside(false);
}
/* 放不出来的时候要让人看见，并且把系统自带的播放器露出来兜底 */
function voiceFail(){
  stopVoice();
  if($('btnVoiceTxt')){
    $('btnVoiceTxt').textContent = TXT.voiceFail;
    setTimeout(function(){
      if(!voicePlaying && $('btnVoiceTxt')) $('btnVoiceTxt').textContent = TXT.voiceBtn;
    }, 3500);
  }
  try{
    var nv = $('voiceNative');
    if(nv && voicePlayUrl){
      if(nv.src !== voicePlayUrl) nv.src = voicePlayUrl;
      nv.className = 'show';
    }
  }catch(e){}
}
function playVoice(){
  if(!voicePlayUrl && !voiceBuf) return;
  if(voicePlaying){ stopVoice(); return; }

  voicePlaying = true;
  $('btnVoice').className = 'on playing';
  $('btnVoiceTxt').textContent = TXT.voiceBtnPlay;
  bgmAside(true);                 /* 背景音乐整个让开，别抢音频通道 */

  /* 首选：Web Audio。微信里最稳，也不受 <audio> 单通道限制 */
  if(!voiceBuf) decodeVoiceBuf();
  if(actx && voiceBuf){
    try{
      if(actx.state === 'suspended' && actx.resume) actx.resume();
      voiceNode = actx.createBufferSource();
      voiceNode.buffer = voiceBuf;
      /* 增益 → 压限 → 输出：
         手机外放普遍偏小，这里整体抬一大截；压限负责把峰值按住，不会破音。
         这条链对「以前已经录好并导出的语音」同样生效。 */
      var vg = actx.createGain();
      vg.gain.value = voiceGainVal;
      var last = vg;
      try{
        if(actx.createDynamicsCompressor){
          /* 这里当「限幅器」用：阈值放高，只按住冲顶的尖峰，
             中间的说话声原样放过去，所以是变响而不是被压扁。 */
          var comp = actx.createDynamicsCompressor();
          if(comp.threshold) comp.threshold.value = -4;
          if(comp.knee)      comp.knee.value      = 3;
          if(comp.ratio)     comp.ratio.value     = 14;
          if(comp.attack)    comp.attack.value    = 0.002;
          if(comp.release)   comp.release.value   = 0.14;
          vg.connect(comp); last = comp;
        }
      }catch(e){ last = vg; }
      voiceNode.connect(vg);
      last.connect(actx.destination);
      voiceNode.onended = function(){ if(voicePlaying) stopVoice(); };
      voiceNode.start(0);
      return;
    }catch(e){ voiceNode = null; }
  }

  /* 退路：<audio> 元素 */
  try{
    ensureVoiceEl();
    if(voiceLoaded !== voicePlayUrl){ voiceAudio.src = voicePlayUrl; voiceLoaded = voicePlayUrl; voiceAudio.load(); }
    voiceAudio.muted = false;
    voiceAudio.volume = 1;
    try{ voiceAudio.currentTime = 0; }catch(e){}
    var pr = voiceAudio.play();
    if(pr && pr['catch']) pr['catch'](function(){ voiceFail(); });
    /* 看门狗：1.8 秒还一动不动，就当放不出来，露出系统播放器 */
    if(voiceWatch) clearTimeout(voiceWatch);
    voiceWatch = setTimeout(function(){
      if(voicePlaying && voiceAudio && (voiceAudio.paused || voiceAudio.currentTime < 0.02)) voiceFail();
    }, 1800);
  }catch(e){ voiceFail(); }
}

/* =========================================================
   音频工具：任意音频 → 8kHz 单声道 WAV（各平台都放得出来，体积可控）
   ========================================================= */
function blobToDataUrl(blob, cb){
  var fr = new FileReader();
  fr.onload = function(){ cb(String(fr.result)); };
  fr.onerror = function(){ cb(''); };
  fr.readAsDataURL(blob);
}

function downsampleMono(buf, target){
  var ch = buf.numberOfChannels, len = buf.length;
  var mono = new Float32Array(len);
  for(var c=0;c<ch;c++){
    var d = buf.getChannelData(c);
    for(var i=0;i<len;i++) mono[i] += d[i]/ch;
  }
  var ratio = buf.sampleRate / target;
  var outLen = Math.max(1, Math.floor(len/ratio));
  var out = new Float32Array(outLen);
  for(var j=0;j<outLen;j++){
    var a = Math.floor(j*ratio), b = Math.floor((j+1)*ratio);
    var sum = 0, n = 0;
    for(var k=a;k<b && k<len;k++){ sum += mono[k]; n++; }
    out[j] = n ? sum/n : 0;
  }
  /* 响度归一化。
     以前按「峰值」对齐，说话声的峰值远高于平均值，结果听感还是很小；
     改成按 RMS（平均能量）对齐到一个正常说话的响度，再用 tanh 软限幅压住尖峰，
     这样整体响很多，又不会破音。 */
  var sum = 0;
  for(var m=0;m<outLen;m++) sum += out[m]*out[m];
  var rms = Math.sqrt(sum/Math.max(1,outLen));
  if(rms > 0.0006){
    var gain = Math.min(12, 0.155/rms);      /* 0.155 ≈ 正常说话的 RMS */
    for(var q=0;q<outLen;q++){
      var v = out[q]*gain;
      /* 软限幅：小信号基本不变，大信号平滑压住，比硬切干净 */
      out[q] = v > 0.55 || v < -0.55 ? Math.tanh(v) : v;
    }
  }
  return out;
}

function encodeWav(samples, rate){
  var n = samples.length, len = n*2;
  var ab = new ArrayBuffer(44+len), v = new DataView(ab);
  function ws(off, str){ for(var i=0;i<str.length;i++) v.setUint8(off+i, str.charCodeAt(i)); }
  ws(0,'RIFF');  v.setUint32(4, 36+len, true);   ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16, 16, true);      v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);                      v.setUint32(24, rate, true);
  v.setUint32(28, rate*2, true);                 v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);                     ws(36,'data');
  v.setUint32(40, len, true);
  var off = 44;
  for(var i=0;i<n;i++){
    var x = samples[i];
    if(x > 1) x = 1; if(x < -1) x = -1;
    v.setInt16(off, x < 0 ? x*0x8000 : x*0x7FFF, true);
    off += 2;
  }
  return new Blob([ab], {type:'audio/wav'});
}

function toWavDataUrl(blob, cb){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC){ cb('', '这个浏览器不支持音频解码'); return; }
  var fr = new FileReader();
  fr.onload = function(){
    var ac, called = false;
    try{ ac = new AC(); }catch(e){ cb('', '无法创建音频上下文'); return; }
    function finish(buf){
      if(called) return; called = true;
      try{
        var mono = downsampleMono(buf, 8000);
        blobToDataUrl(encodeWav(mono, 8000), function(u){ cb(u, u ? '' : '编码失败'); });
      }catch(e){ cb('', '转换失败'); }
      try{ ac.close(); }catch(e){}
    }
    function fail(){
      if(called) return; called = true;
      cb('', '解码失败');
      try{ ac.close(); }catch(e){}
    }
    try{
      var pr = ac.decodeAudioData(fr.result, finish, fail);
      if(pr && pr.then) pr.then(finish)['catch'](fail);
    }catch(e){ fail(); }
  };
  fr.onerror = function(){ cb('', '读取失败'); };
  fr.readAsArrayBuffer(blob);
}

function stopStream(){
  if(recStream){
    try{
      var ts = recStream.getTracks ? recStream.getTracks() : [];
      for(var i=0;i<ts.length;i++) ts[i].stop();
    }catch(e){}

function recUI(on){
  recording = on;
  $('adRec').className = on ? 'recording' : '';
  $('adRec').textContent = on ? '■ 停止 (0s)' : '● 开始录音';
  $('adPick').disabled = on;
}
function stopRec(){
  if(recTimer){ clearInterval(recTimer); recTimer = null; }
  recUI(false);
  if(mediaRec && mediaRec.state !== 'inactive'){
    try{ mediaRec.stop(); }catch(e){ stopStream(); }
  } else stopStream();
}
function startRec(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined'){
    adTip('这个浏览器不支持网页录音。用手机自带的录音机录好，再点「选音频文件」就行。', true);
    return;
  }
  adTip('正在请求麦克风权限…');
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recStream = stream;
    var list = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
    var mt = '';
    for(var i=0;i<list.length;i++){
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])){ mt = list[i]; break; }
    }
    try{ mediaRec = mt ? new MediaRecorder(stream, {mimeType:mt}) : new MediaRecorder(stream); }
    catch(e){ mediaRec = new MediaRecorder(stream); }
    recChunks = [];
    mediaRec.ondataavailable = function(ev){ if(ev.data && ev.data.size) recChunks.push(ev.data); };
    mediaRec.onstop = function(){
      stopStream();
      if(!recChunks.length){ adTip('没录到声音，再试一次？', true); return; }
      var mt = ((mediaRec && mediaRec.mimeType) || 'audio/webm').toLowerCase();
      var blob = new Blob(recChunks, {type: mt});
      /* iPhone 录出来是 mp4/AAC —— 各平台都放得出来，而且比 WAV 小很多，直接用。
         安卓/电脑 Chrome 录出来是 webm/opus —— iPhone 放不了，必须转成 WAV。 */
      if(mt.indexOf('mp4') >= 0 || mt.indexOf('aac') >= 0 || mt.indexOf('mpeg') >= 0){
        adTip('正在读取…');
        blobToDataUrl(blob, function(u){ setVoice(u); });
      }else{
        adTip('正在转换…');
        toWavDataUrl(blob, function(u, err){
          if(!u){ adTip('转换失败（'+(err||'')+'），可以改用「选音频文件」。', true); return; }
          setVoice(u);
        });
      }
    };
    mediaRec.start();
    recSec = 0;
    recUI(true);
    recTimer = setInterval(function(){
      recSec++;
      $('adRec').textContent = '■ 停止 (' + recSec + 's)';
      if(recSec >= REC_MAX) stopRec();
    }, 1000);
    adTip('正在录，最长 ' + REC_MAX + ' 秒。一句话就够，越短文件越小（约 16KB/秒）。');
  })['catch'](function(err){
    adTip('拿不到麦克风（' + ((err && err.name) || '被拒绝') + '）。微信里通常录不了，' +
          '请用 Safari / Chrome 打开本页再录，或者直接用「选音频文件」。', true);
  });
}

function getSelfSource(cb){

    x.onload = function(){
      var ok = (x.status === 0 || (x.status >= 200 && x.status < 300)) && x.responseText && x.responseText.length > 2000;

function bakeAndDownload(src){
  /* 标记串在这里拼出来，保证源码里只有「烘焙位」那一处是字面量 */
  var A = '@@' + 'BAKE_START' + '@@';
  var B = '@@' + 'BAKE_END' + '@@';
  var i = src.indexOf(A), j = (i < 0 ? -1 : src.indexOf(B, i));
  if(i < 0 || j < 0){
    adExpTip('这个文件里找不到写入位置 —— 确认选的是本页的 HTML 吗？', true);
    return;
  }
  var lineStart = src.lastIndexOf('\n', i) + 1;
  var lineEnd   = src.indexOf('\n', j);
  if(lineEnd < 0) lineEnd = src.length;

  var nm = safeTeacher($('adName').value) || '';
  var block =
    '/* ' + A + ' 下面两行由「老师后台 → 导出」自动写入 */\n' +
    'var BAKED_TEACHER = ' + JSON.stringify(nm) + ';\n' +
    'var BAKED_VOICE = ' + JSON.stringify(voiceSrc.indexOf('data:') === 0 ? voiceSrc : '') + ';\n' +
    '/* ' + B + ' */';

  var out = src.slice(0, lineStart) + block + src.slice(lineEnd);
  try{
    var blob = new Blob([out], {type:'text/html;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    /* 文件名用英文：部分浏览器会把中文文件名丢掉，变成没有扩展名的 download */
    a.download = 'midautumn-card-with-voice.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){}
    }, 1000);
    adExpTip('导出好了：midautumn-card-with-voice.html（约 ' + Math.round(out.length/1024) + ' KB）。用它替换服务器上原来的 HTML，家长打开就能听到你的声音。');
  }catch(e){
    adExpTip('导出失败，换个浏览器试试（建议在电脑上做这一步）。', true);
  }
}
