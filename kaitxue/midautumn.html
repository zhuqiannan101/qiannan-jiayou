<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05091a">
<title>中秋小船 · 烟花寄语</title>
<!--
================================================================
  中秋小船 · 烟花寄语   （单文件 H5，内联 CSS + JS，无任何外部资源）
================================================================

  【老师你需要知道的几件事】

  1) 可以往同目录放的三个音频文件（都是可选的，不放也照常运行）

     mid-autumn-bgm.mp3   背景音乐（已给你裁好一份，57.7 秒、32 小节的无缝循环）
     firework.mp3         单发烟花音效（不放也行，页面里已经内嵌了一段真实录音）
     teacher-voice.mp3    你的语音祝福（也可以在后台里直接录，见第 3 条）

     烟花的「单发爆炸」和「远处环境声」已经内嵌在页面里，不用额外放文件。
     音量在 JS 里：FX_VOL（烟花总音量）、AMB_VOL（环境声）。

     放进【和本 HTML 同一个文件夹】、用上面的文件名，就这样，不用改代码。
     免费可商用的音效素材：pixabay.com/sound-effects 或 mixkit.co

  2) 名字怎么改成自己的？（默认是「倩楠老师」）
     方式 A：链接后面加参数 —— 例如
             xxx.com/midautumn.html?teacher=张老师
     方式 B：打开页面后，连续点 5 次「右下角那个小月亮」，进入老师后台。

  3) 语音祝福怎么弄？
     连点 5 次右下角小月亮 → 老师后台 → 录音 / 选音频文件 →
     【一定要点「导出带语音的 HTML」】，用导出的那个新文件替换服务器上的 HTML。
     浏览器里录的音只存在你这台设备上，不导出的话家长是听不到的。
     后台顶部有一条状态提示，会告诉你当前这个文件到底有没有内嵌语音。

  4) 文案想改？
     所有中文文案都集中在下面 JS 的 ★文案区★，改字就行。
     音量在 ★文案区★ 上面：VOICE_TARGET_RMS（语音响度）、BGM_VOL（背景音乐）。

================================================================
-->
<style>
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05091a;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#eaf2ff;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
}
button,input{font-family:inherit;outline:none;border:none;background:none;color:inherit}

/* ============ 整体布局：上舞台 70% / 下代码小窗 30% ============ */
#app{
  position:relative;
  height:100vh;height:var(--app-h,100vh);
  max-width:520px;margin:0 auto;
  display:-webkit-box;display:flex;
  -webkit-box-orient:vertical;flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.6);
}
#stage{position:relative;-webkit-box-flex:1;flex:1 1 auto;min-height:0;overflow:hidden;background:#05091a}
#cv{display:block;width:100%;height:100%;touch-action:none}

/* ============ 舞台上的 UI 层 ============ */
#ui{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
#ui > *{pointer-events:auto}

/* 顶部右侧：喇叭 */
#btnSound{
  position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;z-index:55;
  transition:background .2s;
}
#btnSound:active{background:rgba(255,255,255,.22)}
#btnSound svg{width:20px;height:20px;display:block}

/* 右下角：隐藏入口小月亮 */
#btnSecret{
  position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:50%;
  opacity:.28;z-index:55;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;
}
#btnSecret svg{width:17px;height:17px;display:block}

/* 台词 / 提示 / 落款 */
.line{
  position:absolute;left:0;right:0;text-align:center;padding:0 26px;
  opacity:0;transition:opacity 1.4s ease;
  text-shadow:0 0 18px rgba(120,170,255,.55),0 1px 2px rgba(0,0,0,.6);
  z-index:12;pointer-events:none;
}
.line.show{opacity:1}
#caption{bottom:7%;font-size:16.5px;line-height:1.9;letter-spacing:.06em;color:#dfe9ff}
#hint{bottom:7%;font-size:15.5px;letter-spacing:.06em;color:#ffe9b8}
/* 呼吸放在内层 span 上：外层负责淡入(opacity 过渡)，内层负责呼吸(opacity 动画)，
   两个 opacity 不打架，就不会出现刚出现时抖一下的现象 */
#hint.show #hintTxt{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}
#hintTxt{display:inline-block}
#sign{bottom:7%;font-size:17.5px;letter-spacing:.14em;color:#ffe6ae;
  text-shadow:0 0 24px rgba(255,190,90,.6),0 0 6px rgba(255,220,150,.8)}

/* 星光名字 */
#greet{
  position:absolute;left:0;right:0;top:38%;text-align:center;padding:0 20px;
  font-size:28px;font-weight:700;letter-spacing:.1em;
  color:#fff;opacity:0;transform:scale(.86);
  transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.9,.2,1);
  text-shadow:0 0 10px #fff,0 0 26px rgba(255,214,140,.95),0 0 48px rgba(255,170,90,.7);
  z-index:14;pointer-events:none;
}
#greet.show{opacity:1;transform:scale(1);animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{
  0%,100%{text-shadow:0 0 10px #fff,0 0 26px rgba(255,214,140,.95),0 0 48px rgba(255,170,90,.7)}
  50%{text-shadow:0 0 14px #fff,0 0 38px rgba(255,230,170,1),0 0 70px rgba(255,180,110,.85)}
}

/* ============ 第0幕 开始层 ============ */
#startLayer{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:40;
  display:-webkit-box;display:flex;-webkit-box-orient:vertical;flex-direction:column;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;
  transition:opacity .7s ease;
}
#startLayer.gone,#startLayer.ready.gone{opacity:0;pointer-events:none}
#btnStart{
  width:104px;height:104px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 30%,#fff9e2 0%,#ffe9b0 45%,#f6cf7e 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 34px rgba(255,214,140,.55),0 0 80px rgba(255,190,110,.35);
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;
  animation:pulse 3s ease-in-out infinite;
}
#btnStart:active{transform:scale(.95)}
/* 脚本还没跑起来时按钮是"哑"的，别让人白点 —— boot() 里会解除 */
#startLayer:not(.ready) #btnStart{opacity:.45;pointer-events:none}
#startLayer:not(.ready) #startTxt{opacity:.5}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.5),0 0 30px rgba(255,214,140,.5),0 0 70px rgba(255,190,110,.28)}
50%{box-shadow:0 0 0 1px rgba(255,255,255,.7),0 0 46px rgba(255,224,160,.75),0 0 110px rgba(255,190,110,.45)}}
#btnStart svg{width:52px;height:52px;display:block;opacity:.52}
#startTxt{margin-top:22px;font-size:16.5px;letter-spacing:.28em;color:#f0e6cf;text-indent:.28em}
#startSub{margin-top:10px;font-size:13px;letter-spacing:.1em;color:rgba(230,238,255,.42)}

/* ============ 输入弹层 ============ */
#modal{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:90;
  background:rgba(4,8,22,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;padding:26px;
  opacity:0;transition:opacity .28s ease;
}
#modal.hide{display:none}
#modal.in{opacity:1}
.mbox{
  width:100%;max-width:300px;border-radius:20px;padding:24px 20px 18px;text-align:center;
  background:linear-gradient(160deg,rgba(34,48,86,.96),rgba(18,26,52,.98));
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);
}
.mtitle{font-size:17.5px;letter-spacing:.08em;color:#ffe9bd;margin-bottom:16px}
#mInput{
  width:100%;height:46px;border-radius:12px;text-align:center;font-size:21px;letter-spacing:.16em;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#fff;
}
#mInput::-webkit-input-placeholder{color:rgba(255,255,255,.30);font-size:15px;letter-spacing:.06em}
#mOk{
  margin-top:16px;width:100%;height:46px;border-radius:12px;font-size:16.5px;letter-spacing:.14em;
  color:#3a2708;font-weight:700;text-indent:.14em;
  background:linear-gradient(180deg,#ffe6ac,#f3c877);
  box-shadow:0 6px 18px rgba(240,190,110,.28);
}
#mOk:active{transform:translateY(1px)}
.mtip{margin-top:12px;font-size:12.5px;color:rgba(220,230,255,.45);line-height:1.7}

/* ============ 第4幕 作品卡 ============ */
#cardLayer{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:50;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;padding:28px;
  opacity:0;transition:opacity 1.1s ease;pointer-events:none;
}
#cardLayer.show{opacity:1}
#cardLayer.show .card{pointer-events:auto}
.card{
  width:100%;max-width:320px;border-radius:22px;padding:24px 22px 18px;text-align:center;
  background:linear-gradient(165deg,rgba(255,247,232,.97),rgba(255,236,208,.95));
  color:#4a3517;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8);
  transform:translateY(14px);transition:transform 1.1s cubic-bezier(.2,.9,.2,1);
}
#cardLayer.show .card{transform:translateY(0)}
.cardMain{font-size:17px;line-height:1.95;letter-spacing:.03em}
.cardSub{margin-top:14px;padding-top:13px;border-top:1px dashed rgba(120,90,40,.28);
  font-size:12.5px;line-height:1.9;color:#8a6c3c}
.cardBtns{margin-top:18px;display:-webkit-box;display:flex}
.cardBtns button{
  -webkit-box-flex:1;flex:1;height:43px;border-radius:11px;font-size:15px;letter-spacing:.08em;
  color:#5a4118;background:rgba(140,105,50,.13);border:1px solid rgba(140,105,50,.22);
}
.cardBtns button + button{margin-left:10px}
.cardBtns button:active{background:rgba(140,105,50,.24)}
/* 作品卡文案结尾的小喇叭：点了放老师的语音 */
#btnVoice{
  display:none;vertical-align:middle;margin-left:7px;
  padding:5px 12px 5px 10px;border-radius:16px;
  font-size:14px;letter-spacing:.03em;color:#5a4118;line-height:1;
  background:rgba(140,105,50,.15);border:1px solid rgba(140,105,50,.26);
  white-space:nowrap;
}
#btnVoice.on{
  display:-webkit-inline-box;display:inline-flex;
  -webkit-box-align:center;align-items:center;
  animation:voicePulse 2.8s ease-in-out infinite;
}
@keyframes voicePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(190,140,55,0)}
  50%    {box-shadow:0 0 0 5px rgba(190,140,55,.14)}
}
#btnVoice.playing{
  background:linear-gradient(180deg,#ffe6ac,#f3c877);border-color:transparent;
  animation:none;
}
#btnVoice svg{width:15px;height:15px;margin-right:5px;display:block}
/* 最后的兜底：自己播不出来时，露出系统自带的播放器 */
#voiceNative{width:100%;margin-top:12px;display:none}
#voiceNative.show{display:block}

/* ============ 老师后台 ============ */
#admin{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:95;
  background:rgba(4,8,22,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;padding:16px;opacity:0;transition:opacity .28s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#admin.hide{display:none}
#admin.in{opacity:1}
#adminBox{
  margin:auto;width:100%;max-width:330px;
  background:linear-gradient(160deg,rgba(34,48,86,.97),rgba(18,26,52,.99));
  border-radius:20px;padding:20px 18px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.13);
}
.adTitle{font-size:16.5px;letter-spacing:.1em;color:#ffe9bd;text-align:center;margin-bottom:4px}
.adHint{font-size:12px;line-height:1.7;color:rgba(210,222,248,.45);text-align:center;margin-bottom:16px}
.adSec{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.adSec:last-of-type{border-bottom:none}
.adLab{font-size:13.5px;color:#a9bde0;letter-spacing:.06em;margin-bottom:8px}
.adLab b{color:#ffd9a1;font-weight:400;margin-left:6px}
#adName{
  width:100%;height:44px;border-radius:10px;text-align:center;font-size:16.5px;letter-spacing:.1em;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#fff;
}
.adRow{display:flex;margin-top:9px}
.adRow button{
  flex:1;height:42px;border-radius:10px;font-size:14px;letter-spacing:.04em;
  color:#dbe6ff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);
}
.adRow button + button{margin-left:8px}
.adRow button:active{background:rgba(255,255,255,.2)}
.adRow button[disabled]{opacity:.35}
#adRec.recording{background:linear-gradient(180deg,#ff8a8a,#e4514f);border-color:transparent;color:#fff;font-weight:700}
.adTip{font-size:12.5px;line-height:1.75;color:rgba(210,222,248,.5);margin-top:9px}
.adTip.warn{color:#ffc98a}
/* 后台体检条：一眼看出"当前这个文件"到底有没有内嵌语音 */
#adCheck{
  font-size:12.5px;line-height:1.72;padding:10px 12px;border-radius:10px;margin-bottom:12px;
}
#adCheck.ok  {background:rgba(64,192,87,.14);border:1px solid rgba(64,192,87,.32);color:#a9e8b8}
#adCheck.bad {background:rgba(255,150,90,.13);border:1px solid rgba(255,150,90,.32);color:#ffc98a}
#adExport{
  width:100%;height:48px;border-radius:12px;font-size:15.5px;letter-spacing:.06em;font-weight:700;
  color:#3a2708;background:linear-gradient(180deg,#ffe6ac,#f3c877);
  box-shadow:0 6px 16px rgba(240,190,110,.26);
}
#adExport:active{transform:translateY(1px)}
#adImport{
  width:100%;height:40px;margin-top:9px;border-radius:10px;font-size:13px;letter-spacing:.04em;
  color:#a9bde0;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.22);
}
#adImport:active{background:rgba(255,255,255,.14)}
#adSelfBtn{
  width:100%;height:43px;margin-top:10px;border-radius:11px;font-size:14px;letter-spacing:.05em;
  color:#ffe9bd;background:rgba(255,255,255,.12);border:1px solid rgba(255,233,189,.3);
}
#adClose{
  width:100%;height:42px;margin-top:10px;border-radius:11px;font-size:13.5px;letter-spacing:.1em;
  color:#aebbd8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
}
.hidden{display:none !important}

/* 作品卡上的主按钮：保存小船票 */
#btnTicket{
  margin-top:16px;width:100%;height:44px;border-radius:12px;
  font-size:16px;letter-spacing:.1em;text-indent:.1em;font-weight:700;color:#3a2708;
  background:linear-gradient(180deg,#ffe6ac,#f3c877);
  box-shadow:0 6px 16px rgba(240,190,110,.3);
}
#btnTicket:active{transform:translateY(1px)}

/* ============ 中秋贺卡（孩子送给家人，长按保存） ============ */
#ticket{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:80;
  background:rgba(4,8,22,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;
  padding:16px 16px 20px;opacity:0;transition:opacity .3s ease;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
/* margin:auto 让它在放得下时垂直居中，放不下时从顶部开始滚动，不会被裁掉 */
#ticketBox{
  margin:auto;width:100%;
  display:flex;flex-direction:column;align-items:center;
}
#ticket.hide{display:none}
#ticket.in{opacity:1}
#ticketHead{font-size:15.5px;letter-spacing:.08em;color:#ffe9bd;margin-bottom:10px;text-align:center}
#ticketChips{
  display:-webkit-box;display:flex;flex-wrap:wrap;
  -webkit-box-pack:center;justify-content:center;margin-bottom:14px;
}
#ticketChips button{
  margin:4px 3px;padding:9px 15px;border-radius:18px;font-size:14.5px;letter-spacing:.04em;
  color:#dbe6ff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);
  white-space:nowrap;
}
#ticketChips button.on{
  color:#43310f;font-weight:700;border-color:transparent;
  background:linear-gradient(180deg,#ffe6ac,#f3c877);
}
#ticketImg{
  max-width:100%;max-height:54vh;border-radius:14px;display:block;
  box-shadow:0 14px 40px rgba(0,0,0,.6);
  /* 关键：允许长按弹出「保存图片」，body 上的 user-select:none 要在这里放开 */
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto;
}
#ticketTip{white-space:pre-line;margin-top:13px;font-size:13.5px;line-height:1.85;color:#cfdcf5;text-align:center;padding:0 6px}
#ticketNext{
  margin-top:14px;padding:13px 32px;border-radius:24px;font-size:15.5px;letter-spacing:.1em;
  text-indent:.1em;font-weight:700;color:#3a2708;
  background:linear-gradient(180deg,#ffe6ac,#f3c877);
  box-shadow:0 6px 18px rgba(240,190,110,.28);
}
#ticketNext:active{transform:translateY(1px)}
#ticketWait{font-size:14px;color:#9fb2d8;letter-spacing:.1em;padding:40px 0}


/* ============ 互动环节：不挡画面，只在上下留两条很轻的 UI ============ */
#playBar{
  position:absolute;left:12px;right:12px;bottom:54px;z-index:24;
  text-align:center;pointer-events:none;
  opacity:0;transition:opacity .6s ease;
}
#playBar.show{opacity:1}
#playBar span{
  display:inline-block;padding:8px 16px;border-radius:20px;
  background:rgba(8,14,32,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  font-size:14.5px;line-height:1.6;letter-spacing:.04em;color:#ffe9bd;
  box-shadow:0 2px 14px rgba(0,0,0,.35);
}
#btnPlayDone{
  position:absolute;left:12px;bottom:12px;z-index:26;
  padding:9px 19px;border-radius:20px;font-size:13.5px;letter-spacing:.08em;
  color:#dbe6ff;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);
  opacity:0;transition:opacity .6s ease;pointer-events:none;
}
#btnPlayDone.show{opacity:1;pointer-events:auto}
#btnPlayDone:active{background:rgba(255,255,255,.22)}

/* 点击接管层（第2幕等待点击时才出现） */
#tapLayer{position:absolute;left:0;top:0;right:0;bottom:0;z-index:20;display:none}
#tapLayer.on{display:block}

/* ============ 代码小窗 ============ */
#codepanel{
  -webkit-box-flex:0;flex:0 0 30%;min-height:0;position:relative;
  background:linear-gradient(180deg,#141a2e,#0d1222);
  border-top:1px solid rgba(255,255,255,.09);
  display:-webkit-box;display:flex;-webkit-box-orient:vertical;flex-direction:column;
  transition:flex-basis .3s ease;
}
#codepanel.fold{flex-basis:42px}
#cpHead{
  -webkit-box-flex:0;flex:0 0 42px;height:42px;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  padding:0 12px 0 14px;
}
#cpTitle{font-size:13.5px;letter-spacing:.1em;color:#9fb2d8}
#cpNow{
  margin-left:8px;font-size:12px;padding:3px 9px;border-radius:20px;
  background:rgba(255,255,255,.08);color:#ffd9a1;letter-spacing:.05em;
  max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#btnFold{
  margin-left:auto;width:34px;height:30px;border-radius:8px;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;background:rgba(255,255,255,.07);
}
#btnFold svg{width:15px;height:15px;transition:transform .3s}
#codepanel.fold #btnFold svg{transform:rotate(180deg)}
#cpBody{
  position:relative;
  -webkit-box-flex:1;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 12px 14px;
}
#codepanel.fold #cpBody{display:none}
.grp{margin-bottom:14px}
.grpT{font-size:12px;color:#7d8fb5;letter-spacing:.08em;margin:2px 0 7px}
.grp.act .grpT{color:#ffd9a1}

/* 积木块本体 */
.blk{
  position:relative;display:table;max-width:100%;
  padding:6px 11px;margin-bottom:3px;border-radius:6px;
  font-size:12.5px;line-height:1.45;color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.25);
  box-shadow:0 1px 0 rgba(0,0,0,.22);
  transition:box-shadow .2s,transform .2s,opacity .3s,filter .3s;
  transform-origin:left center;
}
/* 上方凹槽（看起来被咬掉一块） */
.blk:before{
  content:'';position:absolute;left:13px;top:0;width:15px;height:5px;
  border-radius:0 0 5px 5px;background:rgba(0,0,0,.20);
}
.blk.hat:before{display:none}
.blk.hat{border-radius:14px 14px 6px 6px;padding-top:8px}
/* 下方凸起（乐高扣合感） */
.blk:after{
  content:'';position:absolute;left:13px;bottom:-4px;width:15px;height:5px;
  border-radius:0 0 5px 5px;background:inherit;
}
/* C 形积木：上面一条横杠 + 左边一道竖脊 + 下面一条底杠，把里面的积木真正抱住 */
.cwrap{
  position:relative;display:table;max-width:100%;
  margin-bottom:4px;border-radius:6px;
  box-shadow:0 1px 0 rgba(0,0,0,.22);
  transition:box-shadow .2s,transform .2s;
  transform-origin:left center;
}
.cwrap:before{  /* 顶部凹槽 */
  content:'';position:absolute;left:13px;top:0;width:15px;height:5px;
  border-radius:0 0 5px 5px;background:rgba(0,0,0,.20);z-index:2;
}
.cwrap:after{   /* 底部凸起 */
  content:'';position:absolute;left:13px;bottom:-4px;width:15px;height:5px;
  border-radius:0 0 5px 5px;background:inherit;
}
.chead{
  padding:8px 12px 7px;font-size:12.5px;line-height:1.45;color:#fff;
  text-shadow:0 1px 1px rgba(0,0,0,.25);
}
.cbody{            /* 被抱住的部分：左边留 13px 让竖脊露出来 */
  margin-left:13px;padding:4px 5px 4px 4px;min-height:12px;
  background:rgba(7,11,23,.45);
}
.cbody .blk{margin-bottom:3px}
.cbody .blk:last-child{margin-bottom:0}
.cfoot{height:11px}
.flag{
  display:inline-block;position:relative;width:11px;height:12px;
  vertical-align:-2px;margin:0 3px;
}
.flag:before{
  content:'';position:absolute;left:0;top:0;width:1.6px;height:12px;
  background:#2f9e44;border-radius:1px;
}
.flag:after{
  content:'';position:absolute;left:2.2px;top:1px;width:8px;height:6.5px;
  background:#40c057;border-radius:1px 3px 3px 1px;
}
.val{
  display:inline-block;padding:1px 7px;margin:0 1px;border-radius:9px;
  background:rgba(255,255,255,.92);color:#2b2b2b;font-size:12px;
}
.op{
  display:inline-block;padding:2px 10px;margin:0 2px;border-radius:12px;
  background:#59c059;color:#fff;font-size:11.5px;line-height:1.4;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
}
.op .val{font-size:11px;padding:1px 6px;margin:0 1px}
.dd{
  display:inline-block;padding:1px 8px;margin:0 1px;border-radius:9px;
  background:rgba(0,0,0,.24);color:#fff;font-size:12px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.val.tap{
  background:#fff;color:#1b2536;font-weight:700;
  animation:valPulse 2.2s ease-in-out infinite;
}
@keyframes valPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 7px rgba(255,255,255,.3)}
  50%    {box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 15px rgba(255,255,255,.7)}
}
.val{transition:transform .18s ease}
.val.pop{transform:scale(1.4)}
.var{
  display:inline-block;padding:1px 7px;margin:0 1px;border-radius:9px;
  background:#ff8c1a;color:#fff;font-size:12px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);
}
/* 五类颜色 */
.c-event {background:#ffbf00}
.c-ctrl  {background:#ffab19}
.c-motion{background:#4c97ff}
.c-looks {background:#9966ff}
.c-sense {background:#4cbfe6}
.c-var   {background:#ff8c1a}
.c-sound {background:#cf63cf}

/* 变暗按「组」来：当前这一幕的积木全亮，其它幕整组压暗。
   （嵌套之后再逐块调 opacity 会层层相乘，反而看不清） */
#cpBody.running .grp{opacity:.34;filter:saturate(.45);transition:opacity .35s,filter .35s}
#cpBody.running .grp.act{opacity:1;filter:none}

.blk.on, .cwrap.on{

/* 桌面端稍微舒展一点 */

<!--

<audio id="bgm" loop preload="auto"></audio>

<script>
(function(){
'use strict';

/* =========================================================
   内嵌的真实烟花音效（来自 Freesound / Pixabay 社区素材，可商用）
     FX_BLAST_B64  单发爆炸（1.17 秒）
     FX_AMB_B64    整体烟花环境声（10 秒，无缝循环）
   真正的数据放在【文件最末尾】那段脚本里，这里只是占位。
   这么做是为了让页面先显示出来，不必等几百 KB 的音频数据下载完。
   想换单发音效：把文件命名 firework.mp3 放同目录即可覆盖。
   ========================================================= */
var FX_BLAST_B64 = '';   /* 数据在文件末尾那段脚本里 */
var FX_AMB_B64 = '';     /* 数据在文件末尾那段脚本里 */

/* =========================================================
   ★下面这一段由「老师后台 → 导出」自动写入，不要手动改它的格式★
   BAKED_TEACHER：老师的名字
   BAKED_VOICE  ：老师的语音（base64 内嵌，家长打开就能听）
   ========================================================= */
/* @@BAKE_START@@ */
var BAKED_TEACHER = '';
var BAKED_VOICE = '';
/* @@BAKE_END@@ */

/* =========================================================
   ★文案区★  想改字只改这里
   ========================================================= */
var TXT = {
  defaultTeacher : '倩楠老师',
  startBtn       : '点击开始',
  defaultName    : '亲爱的宝贝',
  scene1Caption  : '今晚的月亮，和你的小船，都想说点什么',
  scene2Hint     : '点一点小船，让它带着你的名字出发',
  askTitle       : '写下你的名字吧',
  askTip         : '不写也没关系，会叫你「亲爱的宝贝」',
  greet          : function(n){ return n + '，你好呀'; },
  /* 每一条祝福都是一个数组 = 一行一行拼。行少字大 = 看得清 */
  fw1            : ['中 秋 快 乐'],
  fw2            : function(n){ return [n + ' 一家', '团 圆 安 康']; },
  fw3            : function(n){ return [n + ' 同学', '学 习 进 步']; },
  sign           : function(t){ return t + ' 祝你和家人 中秋快乐'; },
  cardMain       : function(t){ return '这个小作品，是' + t + '用代码一块一块搭出来的。等你学会了这些积木，也能亲手做一张这样的节日贺卡，送给你最想送的人 ✨'; },
  btnTicket      : '做一张贺卡，送给家人',

  /* ——— 贺卡（孩子送给家人）——— */
  ticketHead     : '这张贺卡，你想送给谁？',
  ticketTargets  : ['爸爸妈妈','爷爷奶奶','外公外婆','全家人'],
  ticketOther    : '想送给谁呀',
  ticketOtherTip : '比如「姥姥」「哥哥」，最多 6 个字',
  ticketTip      : function(t){
    return '长按上面的图片 → 保存到相册，发给' + t + '\n' +
           '也可以点微信右上角「…」，把这一页一起转过去';
  },
  ticketMid      : '中 秋 快 乐',
  ticketSend     : function(n,t){ return n + '  送给  ' + t; },
  ticketBy       : function(t,n){ return t + ' 也祝 ' + n + ' 一家 中秋快乐'; },
  ticketStamp    : '图形化编程作品',
  voiceBtn       : '听老师说一句',
  voiceBtnPlay   : '正在播放…',
  voiceFail      : '放不出来 · 试试关静音',
  voiceNativeTip : '用下面这个播放器试试 👇',
  ticketNext     : '存好啦，下一步 →',

  /* ——— 自己动手玩代码 ——— */
  playHint       : '👇 点一点代码里会发光的数字，看看画面会怎么变',
  playDone       : '我玩好了',
  teacherTitle   : '请输入你的名字',
  teacherTip     : '例如「张老师」，只存在这台手机上'
};

/* =========================================================
   工具函数
   ========================================================= */
function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function eio(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }   // ease in-out
function eo(t){ return 1-Math.pow(1-t,3); }                          // ease out
function TAU(){ return Math.PI*2; }
/* 椭圆路径（不用 ctx.ellipse，兼容老内核）；只建路径，由调用方 fill/stroke */
function ellPath(x,y,rx,ry){
  if(rx<=0 || ry<=0) return;
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(1, ry/rx);
  ctx.beginPath();
  ctx.arc(0,0,rx,0,TAU());
  ctx.restore();
}

/* 名字安全处理：去掉控制字符 / 表情（代理对）/ 零宽字符 / HTML 危险字符，再限制长度 */
function scrub(s, maxLen){
  if(s === null || s === undefined) return '';
  s = String(s);
  /* 只保留中日文、英文字母、数字和间隔号；表情、符号、空白、HTML 字符一律丢掉 */
  s = s.replace(/[^\u4e00-\u9fa5\u3040-\u30ff\u31f0-\u31ff\uff66-\uff9da-zA-Z0-9\u00b7\u2027\uff0e.]/g, '');
  return s.slice(0, maxLen);
}
function safeName(s){ return scrub(s, 6); }
function safeTeacher(s){ return scrub(s, 8); }
/* 注意：名字只通过 textContent 和 canvas fillText 输出，永不进 innerHTML —— 不可能注入 */

function getParam(k){
  var re = new RegExp('[?&]'+k+'=([^&#]*)');
  var m = re.exec(window.location.search);
  if(!m) return '';
  try { return decodeURIComponent(m[1].replace(/\+/g,' ')); } catch(e){ return m[1]; }
}
var LS_KEY   = 'ma_teacher_name_v1';
var LS_VOICE = 'ma_teacher_voice_v1';
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

/* =========================================================
   老师名字：URL 参数优先 > localStorage > 默认
   ========================================================= */
var memTeacher = null;
function teacherName(){
  var u = safeTeacher(getParam('teacher'));
  if(u) return u;
  if(memTeacher) return memTeacher;
  var s = safeTeacher(lsGet(LS_KEY));
  if(s) return s;
  if(BAKED_TEACHER) return safeTeacher(BAKED_TEACHER);
  return TXT.defaultTeacher;
}

/* =========================================================
   ★可点的积木★
   代码小窗里发光的白色数字是可以点的，点一下就换一个值，
   画面立刻跟着变 —— 这是整个页面唯一"教东西"的地方。
   想加新的可点数字：在 GROUPS 的积木上写 tap:{key:'...', vals:[...]}，
   再在下面 applyTune 里写这个 key 对应的效果。
   ========================================================= */
var TUNE = { moonSec:8, boatStep:1, fwCount:5 };
/* moonSec  月亮滑行几秒（越小升得越快）
   boatStep 小船每步走多远
   fwCount  一轮放几发烟花 */

/* 月亮升起用几秒 —— 代码小窗里「在 N 秒内滑行到…」的 N 就是它 */
function sailDur(){ return TUNE.moonSec; }

/* =========================================================
   画布与尺寸
   ========================================================= */
var stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
var W = 360, H = 500, DPR = 1;

var modalOpen = false;
function fixHeight(){
  /* 微信/Safari 的 100vh 会被地址栏坑，用 JS 实测高度 */
  /* 软键盘弹出时 innerHeight 会骤降，此时不改高度，避免布局跳动 */
  if(modalOpen) return;
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}
function resize(){
  fixHeight();
  var r = stage.getBoundingClientRect();
  W = Math.max(240, Math.round(r.width));
  H = Math.max(240, Math.round(r.height));
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width  = W+'px';
  cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildStars();
  buildCity();
  buildLanterns();
  buildClouds();
  buildPetals();
  buildRivers();
}

/* =========================================================
   场景元素数据
   ========================================================= */
var stars=[], skyline=[], lanterns=[];

function buildStars(){
  stars = [];
  var n = Math.round(W*H/5200);
  n = clamp(n, 40, 130);
  for(var i=0;i<n;i++){
    stars.push({
      x: Math.random()*W,
      y: Math.random()*H*0.72,
      r: rnd(0.4,1.35),
      a: rnd(0.25,0.85),
      ph: Math.random()*TAU(),
      sp: rnd(0.6,2.0)
    });
  }
}

/* =========================================================
   城市天际线：楼群 + 宝塔 + 石拱桥
   全部预渲染成两张贴图，每帧只贴图：
     cityImg   —— 楼群与宝塔（画在水面之前）
     bridgeImg —— 石拱桥（画在水面之后，桥洞里才能看见水）
   ========================================================= */
var cityImg = null, bridgeImg = null, cityWins = [];

/* 一个尖角上翘的中式飞檐 */
function eave(g, cx, y, halfW, th){
  g.beginPath();
  g.moveTo(cx-halfW, y);
  g.quadraticCurveTo(cx-halfW*0.45, y-th*0.55, cx, y-th*0.62);
  g.quadraticCurveTo(cx+halfW*0.45, y-th*0.55, cx+halfW, y);
  g.quadraticCurveTo(cx+halfW*0.55, y+th*0.55, cx+halfW*0.30, y+th*0.72);
  g.lineTo(cx-halfW*0.30, y+th*0.72);
  g.quadraticCurveTo(cx-halfW*0.55, y+th*0.55, cx-halfW, y);
  g.closePath(); g.fill();
}

/* 宝塔 */
function drawPagoda(g, cx, baseY, hTotal){
  var tiers = 7;
  var bodyC = '#1a2a52', eaveC = '#243768';
  var hw0 = hTotal*0.26;
  var step = hTotal*0.132;
  /* 台基 */
  g.fillStyle = '#152344';
  g.fillRect(cx-hw0*0.95, baseY-hTotal*0.035, hw0*1.90, hTotal*0.035);
  for(var i=0;i<tiers;i++){
    var p  = i/tiers;
    var hw = hw0*(1 - p*0.52);
    var yB = baseY - hTotal*0.030 - step*i;
    var yT = yB - step*0.72;
    /* 塔身 */
    g.fillStyle = bodyC;
    g.fillRect(cx-hw*0.66, yT, hw*1.32, yB-yT);
    /* 窗（每层一盏暖灯） */
    g.fillStyle = 'rgba(255,206,132,'+(0.34 + 0.30*((i*5)%3)/2)+')';
    g.fillRect(cx-hw*0.15, yT+step*0.16, hw*0.30, step*0.34);
    /* 飞檐：比塔身宽出不少，尖角上翘 */
    g.fillStyle = eaveC;
    eave(g, cx, yT, hw*1.28, hTotal*0.042);
    /* 檐口亮边 */
    g.fillStyle = 'rgba(160,195,255,.20)';
    g.fillRect(cx-hw*1.10, yT-hTotal*0.004, hw*2.20, 1.2);
  }
  /* 塔刹 */
  var topY = baseY - hTotal*0.030 - step*(tiers-1) - step*0.72;
  g.fillStyle = eaveC;
  g.beginPath();
  g.moveTo(cx-hw0*0.20, topY); g.lineTo(cx+hw0*0.20, topY);
  g.lineTo(cx, topY-hTotal*0.06); g.closePath(); g.fill();
  g.fillRect(cx-1.4, topY-hTotal*0.155, 2.8, hTotal*0.10);
  g.beginPath(); g.arc(cx, topY-hTotal*0.170, hTotal*0.020, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx, topY-hTotal*0.120, hTotal*0.014, 0, Math.PI*2); g.fill();
}

function buildCity(){
  var base = Math.round(waterY()) + 2;
  var seed = 20260925;
  function sr(){ seed = (seed*9301 + 49297) % 233280; return seed/233280; }
  function rv(a,b){ return a + sr()*(b-a); }

  var oc = document.createElement('canvas');
  oc.width = Math.max(2, Math.round(W*DPR));
  oc.height = Math.max(2, Math.round(base*DPR));
  var g = oc.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  cityWins = [];

  /* ---- 远景一层更暗的楼，拉开纵深 ---- */
  var x = -12;
  while(x < W+12){
    var w = rv(W*0.05, W*0.13), h = rv(H*0.045, H*0.11);
    g.fillStyle = '#0a1228';
    g.fillRect(x, base-h-H*0.012, w, h+H*0.012);
    x += w + rv(2,9);
  }

  /* ---- 主楼群 ---- */
  x = -14;
  while(x < W+14){
    var bw = rv(W*0.065, W*0.155);
    var bh = rv(H*0.065, H*0.205);
    var top = base - bh;
    var gg = g.createLinearGradient(0, top, 0, base);
    gg.addColorStop(0,'#12203f'); gg.addColorStop(1,'#060d20');
    g.fillStyle = gg;
    g.fillRect(x, top, bw, bh);
    g.fillStyle = 'rgba(150,185,245,.15)';
    g.fillRect(x, top, bw, 1.2);

    /* 楼顶造型 */
    var style = sr();
    if(style < 0.22){                       /* 阶梯顶 */
      g.fillStyle = gg;
      g.fillRect(x+bw*0.18, top-bh*0.10, bw*0.64, bh*0.10);
      g.fillRect(x+bw*0.34, top-bh*0.17, bw*0.32, bh*0.07);
    }else if(style < 0.38){                 /* 天线 */
      g.fillStyle = '#12203f';
      g.fillRect(x+bw/2-0.8, top-H*0.028, 1.6, H*0.028);
      cityWins.push({x:x+bw/2, y:top-H*0.030, r:1.6, blink:true});
    }else if(style < 0.50){                 /* 中式坡屋顶 */
      g.fillStyle = '#16224a';
      eave(g, x+bw/2, top, bw*0.62, H*0.016);
    }

    /* 窗 */
    var cols = Math.max(1, Math.floor(bw/10));
    var rows = Math.max(1, Math.floor(bh/14));
    var cw = bw/cols, chh = bh/rows;
    for(var c=0;c<cols;c++){
      for(var r2=0;r2<rows;r2++){
        if(sr() < 0.36){
          var a = rv(0.28, 0.85);
          var wx = x + c*cw + cw*0.26, wy = top + r2*chh + chh*0.24;
          g.fillStyle = 'rgba(255,214,140,'+(a*0.62)+')';
          g.fillRect(wx, wy, cw*0.44, chh*0.42);
          /* 留一小撮窗户交给实时闪烁 */
          if(cityWins.length < 26 && sr() < 0.12)
            cityWins.push({x:wx, y:wy, w:cw*0.44, h:chh*0.42, a:a});
        }
      }
    }
    x += bw + rv(1.5, 8);
  }

  /* ---- 宝塔：立在左中，做视觉地标 ---- */
  drawPagoda(g, W*0.30, base, H*0.235);

  cityImg = oc;
  buildBridge(base);
}

/* ---- 石拱桥：画在水面之后，桥洞能看见水 ---- */
function buildBridge(base){
  /* 中式石拱桥：一大两小三孔，桥面明显拱起，栏杆上挂小灯 */
  var x0 = W*0.40, x1 = W*1.02;
  var span = x1 - x0;
  var rise = H*0.098;                        /* 拱起高度：够高才有"拱桥"的味道 */
  var deckY = base + H*0.004;
  var deckH = H*0.013;
  var footY = base + (H - base)*0.115;

  var oc = document.createElement('canvas');
  oc.width  = Math.max(2, Math.round(W*DPR));
  oc.height = Math.max(2, Math.round(H*DPR));
  var g = oc.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);

  function deck(px){
    var u = clamp((px-x0)/span, 0, 1);
    return deckY - rise*Math.pow(Math.sin(Math.PI*u), 0.72);
  }

  /* 桥体整片填实 */
  var bg = g.createLinearGradient(0, deckY-rise, 0, footY);
  bg.addColorStop(0,'#2a3a6b'); bg.addColorStop(0.5,'#1c2a55'); bg.addColorStop(1,'#0e1730');
  g.fillStyle = bg;
  g.beginPath();
  g.moveTo(x0, footY);
  for(var px=x0; px<=x1; px+=3) g.lineTo(px, deck(px));
  g.lineTo(x1, footY);
  g.closePath(); g.fill();

  /* 挖三个桥孔：中间大、两侧小 */
  g.globalCompositeOperation = 'destination-out';
  var arcs = [
    {u:0.44, r: span*0.160},
    {u:0.17, r: span*0.088},
    {u:0.71, r: span*0.100}
  ];
  for(var i=0;i<arcs.length;i++){
    var a = arcs[i], acx = x0 + span*a.u;
    var cy = deck(acx) + deckH + a.r;       /* 拱顶正好贴在桥面下缘 */
    g.beginPath();
    g.moveTo(acx-a.r, cy);
    g.arc(acx, cy, a.r, Math.PI, 0);
    g.lineTo(acx+a.r, footY+60);
    g.lineTo(acx-a.r, footY+60);
    g.closePath(); g.fill();
  }
  g.globalCompositeOperation = 'source-over';

  /* 拱圈石：沿每个拱描一条亮边。
     用 source-atop 让描边只落在桥体上，不会有半截弧飘在空中。 */
  g.save();
  g.globalCompositeOperation = 'source-atop';
  g.strokeStyle = 'rgba(170,200,250,.22)'; g.lineWidth = 2.0;
  for(var k=0;k<arcs.length;k++){
    var a2 = arcs[k], ax2 = x0 + span*a2.u;
    var cy2 = deck(ax2) + deckH + a2.r;
    g.beginPath(); g.arc(ax2, cy2, a2.r, Math.PI, 0); g.stroke();
  }
  g.restore();

  /* 桥面与栏杆 */
  g.strokeStyle = 'rgba(170,205,255,.30)'; g.lineWidth = 1.5;
  g.beginPath();
  for(var p2=x0; p2<=x1; p2+=3){ if(p2===x0) g.moveTo(p2, deck(p2)); else g.lineTo(p2, deck(p2)); }
  g.stroke();
  var railH = H*0.024;
  var step = Math.max(11, span/20);
  for(var p3=x0+step*0.4; p3<x1; p3+=step){
    var dy = deck(p3);
    g.fillStyle = '#1b2a56';
    g.fillRect(p3-1.1, dy-railH, 2.2, railH);
    g.fillStyle = 'rgba(180,210,255,.22)';
    g.fillRect(p3-1.1, dy-railH, 2.2, 1.2);
  }
  g.strokeStyle = 'rgba(160,195,255,.34)'; g.lineWidth = 1.2;
  g.beginPath();
  for(var p4=x0; p4<=x1; p4+=3){
    var yy = deck(p4)-railH;
    if(p4===x0) g.moveTo(p4, yy); else g.lineTo(p4, yy);
  }
  g.stroke();

  /* 桥上的小灯 */
  for(var m=0;m<6;m++){
    var lx = x0 + span*(0.08 + m*0.165);
    if(lx > x1) break;
    var ly = deck(lx) - railH - H*0.008;
    var lg = g.createRadialGradient(lx,ly,0,lx,ly,H*0.034);
    lg.addColorStop(0,'rgba(255,200,120,.70)');
    lg.addColorStop(1,'rgba(255,170,80,0)');
    g.fillStyle = lg;
    g.beginPath(); g.arc(lx,ly,H*0.034,0,Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,230,175,.95)';
    g.beginPath(); g.arc(lx,ly,1.8,0,Math.PI*2); g.fill();
  }

  /* 水里的倒影：把桥面那条弧压扁、淡淡地映下去 */
  g.save();
  g.globalAlpha = 0.20;
  g.translate(0, base*2 + H*0.012);
  g.scale(1, -0.45);
  g.strokeStyle = '#7fb4ff'; g.lineWidth = 3;
  g.beginPath();
  for(var p5=x0; p5<=x1; p5+=4){ if(p5===x0) g.moveTo(p5, deck(p5)); else g.lineTo(p5, deck(p5)); }
  g.stroke();
  g.restore();
  g.globalAlpha = 1;

  bridgeImg = oc;
}

function drawCity(t, alpha){
  if(alpha <= 0 || !cityImg) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha,0,1);
  ctx.drawImage(cityImg, 0, 0, W, cityImg.height/DPR);
  /* 少量实时闪烁的窗与航空灯，让城市是"活"的 */
  for(var i=0;i<cityWins.length;i++){
    var wn = cityWins[i];
    if(wn.blink){
      ctx.fillStyle = 'rgba(255,120,110,'+(0.30+0.45*Math.sin(t*3+i))+')';
      ctx.beginPath(); ctx.arc(wn.x, wn.y, wn.r, 0, TAU()); ctx.fill();
    }else{
      var fl = 0.55 + 0.45*Math.sin(t*1.25 + i*2.1);
      ctx.fillStyle = 'rgba(255,214,140,'+(wn.a*0.62*fl)+')';
      ctx.fillRect(wn.x, wn.y, wn.w, wn.h);
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBridge(t, alpha){
  if(alpha <= 0 || !bridgeImg) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha,0,1);
  ctx.drawImage(bridgeImg, 0, 0, W, H);
  ctx.restore();
  ctx.globalAlpha = 1;
}


/* =========================================================
   灯笼：数量更多、样式更精致（宫灯：金顶金座 + 竹骨 + 流苏）
   灯身预渲染成贴图，每帧只贴图 + 旋转，才撑得起这么多盏。
   ========================================================= */
var lanternImg = null, lanternImgH = 0;

function buildLanternImg(h){
  var SS = 2, HH = h*SS;
  var w = HH*0.74;
  var pad = HH*0.55;
  var oc = document.createElement('canvas');
  oc.width  = Math.ceil(w + pad*2);
  oc.height = Math.ceil(HH*2.35);
  var g = oc.getContext('2d');
  var cx = oc.width/2, cy = HH*0.95;

  /* 提绳 */
  g.strokeStyle = 'rgba(255,220,170,.45)'; g.lineWidth = HH*0.028;
  g.beginPath(); g.moveTo(cx, cy-HH*0.86); g.lineTo(cx, cy-HH*0.52); g.stroke();
  /* 顶座 */
  g.fillStyle = '#c9962f';
  g.fillRect(cx-w*0.20, cy-HH*0.56, w*0.40, HH*0.09);
  g.fillStyle = '#e0b34a';
  g.fillRect(cx-w*0.26, cy-HH*0.50, w*0.52, HH*0.055);

  /* 灯身 */
  var lb = g.createLinearGradient(cx-w/2, 0, cx+w/2, 0);
  lb.addColorStop(0,   '#9e2f12');
  lb.addColorStop(0.22,'#d8551f');
  lb.addColorStop(0.46,'#ffb05e');
  lb.addColorStop(0.70,'#e0651f');
  lb.addColorStop(1,   '#93290f');
  g.fillStyle = lb;
  ell2(g, cx, cy-HH*0.22, w/2, HH*0.30); g.fill();

  /* 竹骨：几条竖向的弧 */
  g.strokeStyle = 'rgba(120,42,8,.30)'; g.lineWidth = HH*0.020;
  for(var k=-2;k<=2;k++){
    var rx = Math.abs(k)*w*0.115 + w*0.03;
    ell2(g, cx, cy-HH*0.22, rx, HH*0.30); g.stroke();
  }
  /* 上下缘暗边 */
  g.strokeStyle = 'rgba(110,36,6,.45)'; g.lineWidth = HH*0.022;
  ell2(g, cx, cy-HH*0.22, w/2, HH*0.30); g.stroke();

  /* 底座 */
  g.fillStyle = '#e0b34a';
  g.fillRect(cx-w*0.26, cy+HH*0.045, w*0.52, HH*0.055);
  g.fillStyle = '#c9962f';
  g.fillRect(cx-w*0.20, cy+HH*0.10, w*0.40, HH*0.075);

  /* 流苏：一束细线 + 结 */
  g.strokeStyle = '#e8b04a'; g.lineWidth = HH*0.026; g.lineCap='round';
  for(var f=-2;f<=2;f++){
    g.beginPath();
    g.moveTo(cx+f*w*0.045, cy+HH*0.175);
    g.quadraticCurveTo(cx+f*w*0.085, cy+HH*0.34, cx+f*w*0.075, cy+HH*0.46);
    g.stroke();
  }
  g.fillStyle = '#d8a53c';
  ell2(g, cx, cy+HH*0.185, w*0.11, HH*0.045); g.fill();

  lanternImg = oc;
  lanternImgH = h;
  lanternImg.__cx = cx; lanternImg.__cy = cy;
  return oc;
}

function buildLanterns(){
  lanterns = [];
  var n = 8;
  for(var i=0;i<n;i++){
    var far = (i % 3 === 1);                 /* 穿插几盏远处的小灯笼，做出层次 */
    lanterns.push({
      bx: W*(0.07 + 0.86*(i/(n-1))) + rnd(-W*0.03, W*0.03),
      by: H*(far ? rnd(0.345,0.435) : rnd(0.415,0.545)),
      s : (far ? rnd(0.17,0.23) : rnd(0.28,0.40)),
      ph: Math.random()*TAU(),
      sp: rnd(0.45,0.85),
      a : far ? 0.55 : 1
    });
  }
}

function drawLanterns(t, alpha){
  if(alpha <= 0) return;
  var base = clamp(W/360, 0.78, 1.35);
  var unit = 26;                              /* 灯身基准高度（局部单位） */
  if(!lanternImg || Math.abs(lanternImgH - unit*2) > 1) buildLanternImg(unit*2);
  var iw = lanternImg.width/2, ih = lanternImg.height/2;   /* 贴图是 2 倍超采样 */
  var ax = lanternImg.__cx/2, ay = lanternImg.__cy/2;

  ctx.save();
  ctx.globalAlpha = clamp(alpha,0,1);
  for(var i=0;i<lanterns.length;i++){
    var L = lanterns[i];
    var sway = Math.sin(t*L.sp + L.ph);
    var x = L.bx + sway*W*0.026;
    var y = L.by + Math.sin(t*0.8 + L.ph)*7 - Math.sin(t*0.35)*4;
    var s = L.s * base;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(sway*0.09);
    ctx.scale(s, s);
    /* 光晕 */
    var ga = ctx.globalAlpha;
    ctx.globalAlpha = ga * L.a;
    blob(SOFT_WARM, 0, 0, unit*1.9, 0.30*L.a);
    ctx.globalAlpha = ga * L.a;
    ctx.drawImage(lanternImg, -ax, -ay, iw, ih);
    ctx.globalAlpha = ga;
    ctx.restore();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}


/* =========================================================
   绘制：夜空 / 月亮 / 水面 / 小船 / 灯笼 / 城市 / 烟花
   ========================================================= */
function drawSky(t){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,   '#040817');
  g.addColorStop(0.42,'#0b1738');
  g.addColorStop(0.72,'#132c58');
  g.addColorStop(1,   '#0a1832');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var a = s.a * (0.55 + 0.45*Math.sin(t*s.sp + s.ph));
    ctx.globalAlpha = clamp(a,0,1);
    ctx.fillStyle = '#dce9ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU()); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   月亮：月面 + 月中剪影（嫦娥 / 玉兔捣药 / 桂树）
   月面是预渲染好的贴图，每帧只贴一次；光晕仍然实时画，保留呼吸感。
   ========================================================= */
var moonImg = null, moonImgR = 0;

/* 给任意 ctx 用的椭圆（不依赖 ctx.ellipse，老内核也能跑） */
function ell2(g,x,y,rx,ry){
  if(rx<=0||ry<=0) return;
  g.save(); g.translate(x,y); g.scale(1, ry/rx);
  g.beginPath(); g.arc(0,0,rx,0,Math.PI*2); g.restore();
}

/* 月中的剪影：坐标以月心为原点，R 为半径 */
function drawMoonFigures(g, R){
  var SIL = 'rgba(198,168,108,.50)';
  var SIL2= 'rgba(198,168,108,.38)';
  g.fillStyle = SIL; g.strokeStyle = SIL; g.lineCap = 'round';

  /* ---- 桂树（左下） ---- */
  g.fillStyle = SIL2;
  g.beginPath();
  g.moveTo(-0.70*R, 0.74*R);
  g.quadraticCurveTo(-0.64*R, 0.34*R, -0.58*R, 0.06*R);
  g.lineTo(-0.46*R, 0.06*R);
  g.quadraticCurveTo(-0.52*R, 0.36*R, -0.56*R, 0.74*R);
  g.closePath(); g.fill();
  ell2(g, -0.62*R, -0.06*R, 0.20*R, 0.145*R); g.fill();
  ell2(g, -0.42*R, -0.13*R, 0.165*R, 0.12*R); g.fill();
  ell2(g, -0.56*R, -0.26*R, 0.135*R, 0.10*R); g.fill();

  /* ---- 嫦娥（中上，向右侧身，水袖与飘带往左后方甩） ---- */
  g.fillStyle = SIL;
  /* 裙与身 */
  g.beginPath();
  g.moveTo(0.13*R, -0.40*R);
  g.quadraticCurveTo(0.27*R, -0.16*R, 0.21*R,  0.10*R);
  g.quadraticCurveTo(0.13*R,  0.36*R, -0.14*R, 0.40*R);
  g.quadraticCurveTo(0.01*R,  0.18*R, 0.015*R,-0.04*R);
  g.quadraticCurveTo(0.02*R, -0.28*R, 0.05*R, -0.40*R);
  g.closePath(); g.fill();
  /* 头与发髻 */
  g.beginPath(); g.arc(0.095*R, -0.485*R, 0.072*R, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(0.045*R, -0.575*R, 0.045*R, 0, Math.PI*2); g.fill();
  /* 举起的水袖 */
  g.beginPath();
  g.moveTo(0.115*R, -0.33*R);
  g.quadraticCurveTo(0.30*R, -0.46*R, 0.44*R, -0.36*R);
  g.quadraticCurveTo(0.41*R, -0.28*R, 0.32*R, -0.28*R);
  g.quadraticCurveTo(0.22*R, -0.26*R, 0.12*R, -0.25*R);
  g.closePath(); g.fill();
  /* 两条飘带 */
  g.lineWidth = 0.030*R;
  g.beginPath();
  g.moveTo(0.15*R, -0.26*R);
  g.bezierCurveTo(-0.02*R,-0.20*R, -0.14*R,-0.44*R, -0.34*R,-0.34*R);
  g.stroke();
  g.lineWidth = 0.024*R;
  g.beginPath();
  g.moveTo(0.13*R, -0.12*R);
  g.bezierCurveTo(-0.04*R,-0.02*R, -0.20*R,-0.16*R, -0.34*R,-0.05*R);
  g.stroke();

  /* ---- 玉兔捣药（右下） ---- */
  /* 石臼 */
  g.beginPath();
  g.moveTo(0.33*R, 0.74*R); g.lineTo(0.62*R, 0.74*R);
  g.lineTo(0.575*R, 0.565*R); g.lineTo(0.375*R, 0.565*R);
  g.closePath(); g.fill();
  /* 兔身 */
  ell2(g, 0.355*R, 0.475*R, 0.135*R, 0.105*R); g.fill();
  /* 兔头 */
  g.beginPath(); g.arc(0.245*R, 0.395*R, 0.072*R, 0, Math.PI*2); g.fill();
  /* 两只长耳 */
  g.save(); g.translate(0.225*R, 0.345*R); g.rotate(-0.42);
  ell2(g, 0, -0.125*R, 0.026*R, 0.125*R); g.fill(); g.restore();
  g.save(); g.translate(0.275*R, 0.345*R); g.rotate(-0.14);
  ell2(g, 0, -0.115*R, 0.024*R, 0.115*R); g.fill(); g.restore();
  /* 举着的杵 */
  g.lineWidth = 0.030*R;
  g.beginPath(); g.moveTo(0.295*R, 0.315*R); g.lineTo(0.455*R, 0.555*R); g.stroke();
}

function buildMoonImg(r){
  var SS = 2;                                  /* 超采样，边缘才利落 */
  var R  = r*SS, S = Math.ceil(R*2)+4;
  var c = document.createElement('canvas');
  c.width = c.height = S;
  var g = c.getContext('2d');
  var cx = S/2, cy = S/2;
  g.translate(cx, cy);

  /* 月体 */
  var gm = g.createRadialGradient(-R*0.30, -R*0.34, R*0.12, 0, 0, R*1.05);
  gm.addColorStop(0,'#fffdf1'); gm.addColorStop(0.5,'#fdf2cf'); gm.addColorStop(1,'#f1d491');
  g.fillStyle = gm;
  g.beginPath(); g.arc(0,0,R,0,Math.PI*2); g.fill();

  g.save();
  g.beginPath(); g.arc(0,0,R,0,Math.PI*2); g.clip();
  /* 几个很淡的环形山，别抢剪影 */
  g.fillStyle = 'rgba(228,203,148,.30)';
  var cr = [[-0.34,-0.52,0.13],[0.52,-0.20,0.10],[0.66,0.20,0.075],[-0.12,0.62,0.085]];
  for(var i=0;i<cr.length;i++){
    g.beginPath(); g.arc(cr[i][0]*R, cr[i][1]*R, cr[i][2]*R, 0, Math.PI*2); g.fill();
  }
  drawMoonFigures(g, R);
  g.restore();

  /* 边缘一圈很淡的暗角，月面才有体积 */
  var ge = g.createRadialGradient(0,0,R*0.72, 0,0,R);
  ge.addColorStop(0,'rgba(200,170,110,0)');
  ge.addColorStop(1,'rgba(186,152,92,.28)');
  g.fillStyle = ge;
  g.beginPath(); g.arc(0,0,R,0,Math.PI*2); g.fill();

  moonImg = c; moonImgR = r;
  return c;
}

function drawMoon(x,y,r,t,glow){
  if(glow === undefined) glow = 1;
  /* 光晕（实时，带呼吸） */
  var breathe = 1 + 0.055*Math.sin(t*1.15);
  var gr = ctx.createRadialGradient(x,y,r*0.6, x,y, r*4.6*breathe);
  gr.addColorStop(0,   'rgba(255,232,175,'+(0.34*glow)+')');
  gr.addColorStop(0.35,'rgba(255,214,150,'+(0.13*glow)+')');
  gr.addColorStop(1,   'rgba(255,200,130,0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x,y, r*4.6*breathe, 0, TAU()); ctx.fill();

  /* 月面：按"最大可能半径"预渲染一次，之后只缩放贴图，不再重建 */
  var rMax = clamp(Math.min(W,H)*0.082, 18, 46) * 1.30;
  if(!moonImg || Math.abs(moonImgR - rMax) > 1) buildMoonImg(rMax);
  var S = r*2*1.04;                               /* 贴图四周留了一点余量 */
  ctx.drawImage(moonImg, x - S/2, y - S/2, S, S);
}


var HORIZON = 0.70;   /* 水平线位置（占高度比例） */
function waterY(){ return H*HORIZON; }

function drawWater(t, moonX){
  var wy = waterY();
  var g = ctx.createLinearGradient(0,wy,0,H);
  g.addColorStop(0,   '#123058');
  g.addColorStop(0.35,'#0d2246');
  g.addColorStop(1,   '#07142c');
  ctx.fillStyle = g;
  ctx.fillRect(0, wy, W, H-wy);

  /* 月光在水面的倒影带 */
  if(moonX !== null && moonX !== undefined){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var k=0;k<11;k++){
      var yy = wy + (H-wy)*(k/11) + 2;
      var ww = (W*0.10) * (1 + k*0.23);
      var off = Math.sin(t*1.4 + k*0.8)*W*0.020;
      ctx.globalAlpha = 0.085*(1 - k/13);
      ctx.fillStyle = '#ffe6b0';
      ellPath(moonX+off, yy, ww/2, 1.6);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* 波纹线 */
  ctx.save();
  ctx.lineWidth = 1;
  for(var i=0;i<6;i++){
    var p  = i/6;
    var yb = wy + (H-wy)*(0.06 + p*0.92);
    var amp= 1.6 + p*4.2;
    var len= W/(2.6 - p*1.1);
    ctx.globalAlpha = 0.16 - p*0.016;
    ctx.strokeStyle = '#9fc6ff';
    ctx.beginPath();
    for(var x=0;x<=W;x+=6){
      var y = yb + Math.sin(x/len + t*(1.0+p*0.9) + i)*amp;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* =========================================================
   中式传统木船（乌篷船）
     · 细长木船身，首尾上翘
     · 中间一座半圆的乌篷客舱，篷上有竹骨，舱里透暖光
     · 船尾有橹，船夫戴斗笠摇橹
     · 船头挑一盏红灯笼
   ========================================================= */
function drawBoatShape(g, t, flat){
  /* 局部坐标：船身长约 ±58，吃水线在 y=0 */
  var bob = Math.sin(t*1.5);

  /* ---- 船身 ---- */
  var hull = g.createLinearGradient(0,-6,0,14);
  hull.addColorStop(0,'#8a5a33');
  hull.addColorStop(0.45,'#6b4223');
  hull.addColorStop(1,'#3d2412');
  g.fillStyle = hull;
  g.beginPath();
  g.moveTo(-58,-7);                                  /* 船首尖端 */
  g.quadraticCurveTo(-40,-1, -22,0);                 /* 首部内收 */
  g.lineTo(34,0);
  g.quadraticCurveTo(50,-1, 62,-9);                  /* 船尾上翘 */
  g.quadraticCurveTo(52, 6, 34,11);                  /* 尾部下缘 */
  g.lineTo(-18,11);
  g.quadraticCurveTo(-40,9, -58,-7);                 /* 首部下缘 */
  g.closePath(); g.fill();

  /* 船板横纹 */
  g.strokeStyle = 'rgba(30,16,6,.30)'; g.lineWidth = 0.9;
  for(var k=0;k<2;k++){
    g.beginPath();
    g.moveTo(-50,1.6+k*3.6);
    g.quadraticCurveTo(0,4.0+k*3.6, 54,-0.4+k*3.6);
    g.stroke();
  }
  /* 船舷高光 */
  g.strokeStyle = 'rgba(214,160,104,.75)'; g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(-58,-7);
  g.quadraticCurveTo(-40,-1.2, -22,-0.3);
  g.lineTo(34,-0.3);
  g.quadraticCurveTo(50,-1.2, 62,-9);
  g.stroke();

  /* ---- 乌篷客舱 ---- */
  var cx0=-20, cx1=22, ch=23;
  g.fillStyle = '#2b1d12';
  g.beginPath();
  g.moveTo(cx0, -1);
  g.quadraticCurveTo(cx0, -ch, (cx0+cx1)/2, -ch);
  g.quadraticCurveTo(cx1, -ch, cx1, -1);
  g.closePath(); g.fill();
  /* 篷顶的竹骨 */
  g.strokeStyle = 'rgba(150,116,80,.55)'; g.lineWidth = 1.1;
  for(var i=1;i<=5;i++){
    var px = cx0 + (cx1-cx0)*(i/6);
    var hgt = ch * Math.sin(Math.PI*(i/6)) * 0.98;
    g.beginPath();
    g.moveTo(px, -1);
    g.quadraticCurveTo(px, -hgt-1, px, -hgt-1);
    g.lineTo(px, -1);
    g.stroke();
  }
  /* 篷沿亮边 */
  g.strokeStyle = 'rgba(196,150,96,.7)'; g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(cx0-1.5, -1);
  g.quadraticCurveTo(cx0-1.5, -ch-1.5, (cx0+cx1)/2, -ch-1.5);
  g.quadraticCurveTo(cx1+1.5, -ch-1.5, cx1+1.5, -1);
  g.stroke();
  if(flat){ return; }          /* 倒影到此为止 */
  /* 舱里透出的暖光（窗） */
  g.save();
  g.globalCompositeOperation = 'lighter';
  var wg = g.createRadialGradient(2,-11,0, 2,-11,15);
  wg.addColorStop(0,'rgba(255,196,112,.62)');
  wg.addColorStop(1,'rgba(255,170,80,0)');
  g.fillStyle = wg;
  g.beginPath(); g.arc(2,-11,15,0,Math.PI*2); g.fill();
  g.restore();
  g.fillStyle = 'rgba(255,206,132,.92)';
  g.beginPath();
  g.moveTo(-6,-15); g.lineTo(10,-15); g.lineTo(10,-6); g.lineTo(-6,-6);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(70,44,22,.85)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(2,-15); g.lineTo(2,-6); g.stroke();

  /* ---- 船尾：摇橹的船夫 ---- */
  g.fillStyle = '#241609';
  /* 橹 */
  g.save();
  g.rotate(0.06*bob);
  g.strokeStyle = '#3a2512'; g.lineWidth = 2.2; g.lineCap='round';
  g.beginPath(); g.moveTo(40,-10); g.lineTo(70,10); g.stroke();
  g.fillStyle = '#3a2512';
  g.beginPath();
  g.moveTo(66,7); g.lineTo(78,14); g.lineTo(74,18); g.lineTo(63,11);
  g.closePath(); g.fill();
  g.restore();
  /* 船夫：斗笠 + 身子 */
  g.fillStyle = '#20140a';
  g.beginPath();                                    /* 身子 */
  g.moveTo(33,-3);
  g.quadraticCurveTo(36,-13, 40,-14);
  g.quadraticCurveTo(44,-13, 44,-3);
  g.closePath(); g.fill();
  g.beginPath(); g.arc(40,-16.5, 3.1, 0, Math.PI*2); g.fill();   /* 头 */
  g.beginPath();                                    /* 斗笠 */
  g.moveTo(32,-18); g.quadraticCurveTo(40,-25.5, 48,-18);
  g.quadraticCurveTo(40,-20.5, 32,-18);
  g.closePath(); g.fill();

  /* ---- 船头挑的红灯笼 ---- */
  g.strokeStyle = '#5a3a1e'; g.lineWidth = 1.6;
  g.beginPath();
  g.moveTo(-40,-2); g.quadraticCurveTo(-50,-20, -56,-17);
  g.stroke();
  var lx=-56, ly=-14 + bob*0.6;
  g.save();
  g.globalCompositeOperation='lighter';
  var lg = g.createRadialGradient(lx,ly,0,lx,ly,20);
  lg.addColorStop(0,'rgba(255,150,80,.75)');
  lg.addColorStop(1,'rgba(255,120,60,0)');
  g.fillStyle = lg;
  g.beginPath(); g.arc(lx,ly,20,0,Math.PI*2); g.fill();
  g.restore();
  var lb = g.createLinearGradient(lx-4,0,lx+4,0);
  lb.addColorStop(0,'#c0331c'); lb.addColorStop(.45,'#ff7a4a'); lb.addColorStop(1,'#a82a15');
  g.fillStyle = lb;
  ell2(g, lx, ly, 4.0, 5.0); g.fill();
  g.fillStyle = '#d8a53c';
  g.fillRect(lx-1.8, ly-6.2, 3.6, 1.5);
  g.fillRect(lx-1.8, ly+4.7, 3.6, 1.5);
  g.strokeStyle = '#e8b04a'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(lx, ly+6.2); g.lineTo(lx, ly+10); g.stroke();
}

function drawBoat(t){
  var wy = waterY();
  /* 左右缓慢漂移 + 随波上下浮动 + 轻微摇摆 */
  var driftT = (t*0.055*TUNE.boatStep) % 2;
  var dx = driftT < 1 ? driftT : 2-driftT;
  var x = W*(0.24 + 0.52*eio(dx));
  var y = wy + (H-wy)*0.30 + Math.sin(t*1.5)*3.2;
  var rot = Math.sin(t*1.5 + 0.6)*0.045;
  var s = clamp(W/360, 0.70, 1.30) * 0.80;

  /* 倒影 */
  ctx.save();
  ctx.translate(x, y+9*s);
  ctx.rotate(rot);
  ctx.scale(s, -s*0.5);
  ctx.globalAlpha = 0.15;
  drawBoatShape(ctx, t, true);   /* 倒影只画大形，省掉细节 */
  ctx.restore();
  ctx.globalAlpha = 1;

  /* 船体 */
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s, s);
  drawBoatShape(ctx, t);
  ctx.restore();
  return {x:x, y:y};
}







/* 预先画好的柔光圆（只做一次），云、灯笼、河灯的光晕都用它贴，
   比每帧 createRadialGradient 快很多 */
function makeSoft(r,g,b){
  var c = document.createElement('canvas');
  c.width = c.height = 128;
  var x = c.getContext('2d');
  var gr = x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,   'rgba('+r+','+g+','+b+',1)');
  gr.addColorStop(0.45,'rgba('+r+','+g+','+b+',0.45)');
  gr.addColorStop(1,   'rgba('+r+','+g+','+b+',0)');
  x.fillStyle = gr; x.fillRect(0,0,128,128);
  return c;
}
var SOFT_BLUE = null, SOFT_WARM = null;
function buildSoft(){
  if(!SOFT_BLUE) SOFT_BLUE = makeSoft(142,176,234);
  if(!SOFT_WARM) SOFT_WARM = makeSoft(255,178,86);
}
function blob(sprite, x, y, r, a){
  ctx.globalAlpha = a;
  ctx.drawImage(sprite, x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
}

/* =========================================================
   氛围：薄云 / 桂花瓣 / 水上的河灯 / 偶尔一颗流星
   都很淡，只负责让画面不那么空，不抢主角
   ========================================================= */

/* ---------- 薄云 ---------- */
var clouds = [];
function buildClouds(){
  clouds = [];
  var defs = [
    {y:0.150, w:0.95, h:0.052, a:0.095, sp:0.0050, layer:0},
    {y:0.300, w:1.15, h:0.066, a:0.080, sp:0.0034, layer:0},
    {y:0.455, w:1.00, h:0.058, a:0.062, sp:0.0026, layer:0},
    {y:0.200, w:0.80, h:0.026, a:0.075, sp:0.0072, layer:1}
  ];
  for(var i=0;i<defs.length;i++){
    var d = defs[i];
    clouds.push({
      x: Math.random()*(W + W*d.w) - W*d.w,
      y: H*d.y, w: W*d.w, h: H*d.h, a: d.a, sp: d.sp, layer: d.layer
    });
  }
}
function updateClouds(dt){
  for(var i=0;i<clouds.length;i++){
    var c = clouds[i];
    c.x += c.sp * W * dt * 6;
    if(c.x > W + c.w) c.x = -c.w;
  }
}
function drawClouds(layer){
  for(var i=0;i<clouds.length;i++){
    var c = clouds[i];
    if(c.layer !== layer) continue;
    /* 四团柔和的光斑叠起来，就是一条薄云 */
    for(var k=0;k<4;k++){
      var cx = c.x + c.w*(0.16 + k*0.23);
      var cy = c.y + (k===1 || k===2 ? -c.h*0.24 : c.h*0.12);
      var r  = c.h * (k===1 ? 2.0 : (k===2 ? 1.75 : 1.35));
      blob(SOFT_BLUE, cx, cy, r, c.a);
    }
  }
}

/* ---------- 桂花瓣 ---------- */
var petals = [];
function buildPetals(){
  petals = [];
  var n = clamp(Math.round(W*H/14000), 12, 22);
  for(var i=0;i<n;i++){
    petals.push({
      x: Math.random()*W,
      y: Math.random()*H,
      vy: rnd(9, 22),
      ph: Math.random()*TAU(),
      sw: rnd(0.45, 1.15),
      amp: rnd(6, 17),
      sz: rnd(1.7, 3.3),
      rot: Math.random()*TAU(),
      vr: rnd(-1.1, 1.1),
      a:  rnd(0.26, 0.60)
    });
  }
}
function drawPetals(dt, t){
  for(var i=0;i<petals.length;i++){
    var p = petals[i];
    p.y += p.vy*dt;
    p.rot += p.vr*dt;
    if(p.y > H*1.03){ p.y = -12; p.x = Math.random()*W; }
    var px = p.x + Math.sin(t*p.sw + p.ph)*p.amp;
    /* 快落到水面时淡出，像落进水里了 */
    var fade = (p.y > H*0.82) ? clamp(1 - (p.y - H*0.82)/(H*0.20), 0, 1) : 1;
    ctx.globalAlpha = p.a*fade;
    ctx.fillStyle = '#ffdf9e';
    ctx.save();
    ctx.translate(px, p.y);
    ctx.rotate(p.rot);
    ellPath(0, 0, p.sz, p.sz*0.52); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 水上的河灯 ---------- */
var rivers = [];
function buildRivers(){
  rivers = [];
  var defs = [
    {r:0.26, s:0.72, sp:0.0100},
    {r:0.50, s:0.95, sp:0.0070},
    {r:0.75, s:1.18, sp:0.0050}
  ];
  for(var i=0;i<defs.length;i++){
    rivers.push({
      x: Math.random()*W, ratio: defs[i].r, s: defs[i].s,
      sp: defs[i].sp, ph: Math.random()*TAU()
    });
  }
}
function drawRivers(dt, t){
  var wy = waterY();
  var base = clamp(W/360, 0.75, 1.3);
  for(var i=0;i<rivers.length;i++){
    var L = rivers[i];
    L.x += L.sp * W * dt * 6;
    if(L.x > W + 40) L.x = -40;
    var y = wy + (H-wy)*L.ratio + Math.sin(t*1.3 + L.ph)*2.0;
    var s = L.s * base;
    ctx.save();
    ctx.translate(L.x, y);
    /* 灯在水里的倒影 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(var k=1;k<=5;k++){
      ctx.globalAlpha = 0.17*(1 - k/6);
      ctx.fillStyle = '#ffc478';
      ellPath(Math.sin(t*2 + k)*1.2, k*3.6*s, (5 + k*2.6)*s/2, 1.0*s);
      ctx.fill();
    }
    ctx.restore();
    /* 光晕 */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    blob(SOFT_WARM, 0, -3*s, 15*s, 0.5);
    ctx.restore();
    /* 莲花座 + 灯芯 */
    ctx.fillStyle = 'rgba(255,190,112,.9)';
    ctx.beginPath();
    ctx.moveTo(-6.2*s, 0); ctx.lineTo(6.2*s, 0);
    ctx.lineTo(4.0*s, -3.6*s); ctx.lineTo(-4.0*s, -3.6*s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff2cf';
    ctx.beginPath(); ctx.arc(0, -5.6*s, 1.7*s, 0, TAU()); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 流星 ---------- */
var meteor = null, meteorWait = 5;
function updateMeteor(dt){
  if(meteor){
    meteor.t += dt;
    if(meteor.t > meteor.life) meteor = null;
    return;
  }
  meteorWait -= dt;
  if(meteorWait <= 0){
    meteorWait = rnd(10, 20);
    var fromLeft = Math.random() < 0.5;
    meteor = {
      x: fromLeft ? rnd(-0.10, 0.30)*W : rnd(0.70, 1.10)*W,
      y: rnd(0.03, 0.20)*H,
      dx: (fromLeft ? 1 : -1) * rnd(0.50, 0.85)*W,
      dy: rnd(0.16, 0.30)*H,
      t: 0, life: rnd(0.9, 1.3)
    };
  }
}
function drawMeteor(){
  if(!meteor) return;
  var pr = clamp(meteor.t/meteor.life, 0, 1);
  var e  = eo(pr);
  var hx = meteor.x + meteor.dx*e;
  var hy = meteor.y + meteor.dy*e;
  var nx = meteor.dx, ny = meteor.dy;
  var nl = Math.sqrt(nx*nx + ny*ny) || 1;
  nx /= nl; ny /= nl;
  var len = W*0.20*Math.sin(Math.PI*pr) + 8;
  var alpha = Math.sin(Math.PI*pr);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var gm2 = ctx.createLinearGradient(hx - nx*len, hy - ny*len, hx, hy);
  gm2.addColorStop(0, 'rgba(180,215,255,0)');
  gm2.addColorStop(1, 'rgba(228,242,255,'+(0.85*alpha)+')');
  ctx.strokeStyle = gm2; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hx - nx*len, hy - ny*len); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#eaf4ff';
  ctx.beginPath(); ctx.arc(hx, hy, 1.7, 0, TAU()); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- 烟花 ---------- */
var FW_COLORS = [
  [255,214,132],  /* 暖金 */
  [232,158,255],  /* 粉紫 */
  [143,216,255],  /* 天蓝 */
  [255,178,150],  /* 珊瑚 */
  [255,240,200]   /* 米白 */
];
var TEXT_COLORS = [
  [255,255,245],
  [255,245,215],
  [255,228,168],
  [255,216,150],
  [255,238,200]
];
var rockets = [], sparks = [];

function launchFirework(){
  launchSound();
  var c = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  rockets.push({
    x: rnd(W*0.12, W*0.88),
    y: waterY() - rnd(H*0.02, H*0.10),
    vy: -rnd(H*0.0060, H*0.0090),
    ty: rnd(H*0.075, H*0.215),
    c : c,
    trail: []
  });
}
function explode(x,y,c){
  var n = Math.round(clamp(W*0.20, 48, 88));
  var type = Math.random();
  for(var i=0;i<n;i++){
    var a = Math.random()*TAU();
    var sp = (type<0.45) ? rnd(0.6,1)*W*0.0075 : (0.55+0.45*Math.random())*W*0.0075;
    sparks.push({
      x:x, y:y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp,
      c: c,
      life: rnd(0.60,1.15),
      max : 1.15,
      sz: rnd(1.1,2.4),
      fk: Math.random()*TAU()
    });
  }
  /* 中心闪光 */
  sparks.push({x:x,y:y,vx:0,vy:0,c:[255,255,255],life:0.22,max:0.22,sz:14,fk:0,flash:true});
  /* 炸得越高 = 越远 = 声音越低沉、余韵越长 */
  popSound(clamp(1 - y/(H*0.30), 0, 1));
}
function updateFireworks(dt, t){
  var i;
  for(i=rockets.length-1;i>=0;i--){
    var r = rockets[i];
    r.x += Math.sin(t*2 + i)*0.24;
    r.y += r.vy*dt*60;
    r.trail.push({x:r.x,y:r.y});
    if(r.trail.length>12) r.trail.shift();
    if(r.y <= r.ty){
      explode(r.x, r.y, r.c);
      rockets.splice(i,1);
    }
  }
  for(i=sparks.length-1;i>=0;i--){
    var s = sparks[i];
    s.life -= dt;
    if(s.life<=0){ sparks.splice(i,1); continue; }
    if(!s.flash){
      s.x += s.vx*dt*60;
      s.y += s.vy*dt*60;
      s.vx *= 0.982;
      s.vy = s.vy*0.982 + H*0.00022*dt*60;
    }
  }
}
function drawFireworks(t){
  var i;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 上升尾迹 */
  for(i=0;i<rockets.length;i++){
    var r = rockets[i];
    for(var k=0;k<r.trail.length;k++){
      var p = k/r.trail.length;
      ctx.globalAlpha = p*0.55;
      ctx.fillStyle = 'rgb('+r.c[0]+','+r.c[1]+','+r.c[2]+')';
      var tr = 1.1+p*1.3;
      ctx.fillRect(r.trail[k].x-tr, r.trail[k].y-tr, tr*2, tr*2);
    }
  }
  /* 爆开粒子 */
  for(i=0;i<sparks.length;i++){
    var s = sparks[i];
    var lp = s.life/s.max;
    if(s.flash){
      ctx.globalAlpha = lp*0.85;
      var g = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.sz*2.4);
      g.addColorStop(0,'rgba(255,255,255,.9)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.sz*2.4,0,TAU()); ctx.fill();
      continue;
    }
    var fk = 0.65 + 0.35*Math.sin(t*22 + s.fk);
    ctx.globalAlpha = clamp(lp*fk,0,1);
    ctx.fillStyle = 'rgb('+s.c[0]+','+s.c[1]+','+s.c[2]+')';
    var ss = s.sz*(0.4+0.6*lp);
    ctx.fillRect(s.x-ss, s.y-ss, ss*2, ss*2);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- 粒子聚字 ---------- */
/* 把文字画到离屏画布，取像素点当作粒子目标位置 */
function sampleText(text, maxW, yCenter){
  var oc = document.createElement('canvas');
  var fs = Math.round(clamp(W*0.115, 20, 54));
  var oh = Math.round(fs*2.0);
  oc.width = Math.max(2, Math.round(maxW));
  oc.height = oh;
  var oct = oc.getContext('2d');
  var font = function(px){ return '700 '+px+'px -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif'; };
  oct.font = font(fs);
  /* 自动缩字，保证一行放得下 */
  var guard = 0;
  while(oct.measureText(text).width > maxW*0.84 && fs > 11 && guard < 40){
    fs -= 1; guard++;
    oct.font = font(fs);
  }
  oc.height = Math.round(fs*2.0);
  oct = oc.getContext('2d');
  oct.font = font(fs);
  oct.textAlign = 'center';
  oct.textBaseline = 'middle';
  oct.fillStyle = '#ffd9a5';        /* 暖金：这张图后面还要当辉光底层用 */
  oct.fillText(text, oc.width/2, oc.height/2);

  var data;
  try { data = oct.getImageData(0,0,oc.width,oc.height).data; }
  catch(e){ return []; }

  var pts = [];
  var step = 2;   /* 采样加密，笔画才连得起来 */
  for(var y=0;y<oc.height;y+=step){
    for(var x=0;x<oc.width;x+=step){
      if(data[(y*oc.width+x)*4+3] > 130){
        pts.push({ x: x + rnd(-0.6,0.6), y: yCenter - oc.height/2 + y + rnd(-0.6,0.6) });
      }
    }
  }
  /* 有了底层辉光，粒子可以少一点、也更均匀，反而更清楚 */
  var CAP = 560;
  if(pts.length > CAP){
    var out = [], stride = pts.length/CAP;
    for(var i=0;i<CAP;i++) out.push(pts[Math.floor(i*stride)]);
    pts = out;
  }
  /* 连同这张离屏文字图一起返回，绘制时垫在粒子下面当辉光 */
  return { pts: pts, fs: fs, img: oc, ox: 0, oy: yCenter - oc.height/2 };
}

function TextBurst(text, yCenter){
  this.parts = [];
  this.state = 'gather';       /* gather -> hold -> release -> done */
  this.tt = 0;
  var sm = sampleText(text, W, yCenter);
  var pts = sm.pts;
  /* 字小时粒子也要小一点，笔画才不会糊在一起 */
  var szBase = clamp(sm.fs/30, 0.72, 1.45);
  this.img = sm.img; this.ox = sm.ox; this.oy = sm.oy;
  this.glow = 0;
  var ox = rnd(W*0.35, W*0.65), oy = rnd(H*0.16, H*0.30);
  for(var i=0;i<pts.length;i++){
    var a = Math.random()*TAU(), d = Math.random()*W*0.55;
    /* 文字粒子偏暖白，和背后的烟花区分开，手机上更好认 */
    var c = TEXT_COLORS[Math.floor(Math.random()*TEXT_COLORS.length)];
    this.parts.push({
      sx: ox + Math.cos(a)*d, sy: oy + Math.sin(a)*d*0.7,
      tx: pts[i].x, ty: pts[i].y,
      x: 0, y: 0,
      dl: Math.random()*0.28,
      c: c,
      sz: szBase*0.95 + rnd(0, 0.34),   /* 尺寸更统一，边缘不毛糙 */
      fk: Math.random()*TAU(),
      vx: 0, vy: 0, a: 1
    });
  }
}
TextBurst.prototype.release = function(){
  if(this.state !== 'hold' && this.state !== 'gather') return;
  this.state = 'release'; this.tt = 0;
  for(var i=0;i<this.parts.length;i++){
    var p = this.parts[i];
    p.vx = rnd(-0.6,0.6);
    p.vy = rnd(-0.5,0.35);
  }
};
TextBurst.prototype.update = function(dt,t){
  this.tt += dt;
  var GATHER = 1.05;
  for(var i=0;i<this.parts.length;i++){
    var p = this.parts[i];
    if(this.state === 'gather'){
      var pr = clamp((this.tt - p.dl)/GATHER, 0, 1);
      var e  = eo(pr);
      p.x = p.sx + (p.tx - p.sx)*e;
      p.y = p.sy + (p.ty - p.sy)*e;
      p.a = 0.25 + 0.75*pr;
    } else if(this.state === 'hold'){
      p.x = p.tx + Math.sin(t*2.4 + p.fk)*0.9;
      p.y = p.ty + Math.cos(t*2.0 + p.fk)*0.9;
      p.a = 1;
    } else if(this.state === 'release'){
      p.vy += H*0.00020*dt*60;
      p.x += p.vx*dt*60;
      p.y += p.vy*dt*60;
      p.a = clamp(1 - this.tt/1.1, 0, 1);
    }
  }
  /* 底层字形辉光：聚拢到一半才慢慢浮出来，散开时先一步淡掉 */
  if(this.state === 'gather')      this.glow = clamp((this.tt - GATHER*0.45)/(GATHER*0.65), 0, 1);
  else if(this.state === 'hold')   this.glow = 1;
  else if(this.state === 'release')this.glow = clamp(1 - this.tt/0.42, 0, 1);
  else                             this.glow = 0;

  if(this.state === 'gather' && this.tt > GATHER + 0.30){ this.state='hold'; this.tt=0; }
  if(this.state === 'release' && this.tt > 1.15){ this.state='done'; }
};
TextBurst.prototype.draw = function(t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  /* 先垫一层很淡的字形辉光 —— 粒子还是主角，但字一眼就认得出来 */
  if(this.img && this.glow > 0.01){
    ctx.globalAlpha = 0.44 * this.glow;
    ctx.drawImage(this.img, this.ox, this.oy);
  }
  for(var i=0;i<this.parts.length;i++){
    var p = this.parts[i];
    if(p.a <= 0) continue;
    var fk = 0.72 + 0.28*Math.sin(t*16 + p.fk);
    ctx.globalAlpha = clamp(p.a*fk, 0, 1);
    ctx.fillStyle = 'rgb('+p.c[0]+','+p.c[1]+','+p.c[2]+')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz, 0, TAU()); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
};

/* 名字点亮时的星光小爆点 */
var twinkles = [];
function spawnTwinkle(){
  twinkles = [];
  var cx = W/2, cy = H*0.40;
  for(var i=0;i<70;i++){
    var a = Math.random()*TAU(), d = rnd(0, W*0.34);
    twinkles.push({
      x: cx+Math.cos(a)*d, y: cy+Math.sin(a)*d*0.5,
      life: rnd(0.6,1.8), max:1.8, sz: rnd(0.8,2.0), fk: Math.random()*TAU()
    });
  }
}
function drawTwinkles(dt,t){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(var i=twinkles.length-1;i>=0;i--){
    var p = twinkles[i];
    p.life -= dt;
    if(p.life<=0){ twinkles.splice(i,1); continue; }
    var lp = p.life/p.max;
    ctx.globalAlpha = clamp(lp*(0.6+0.4*Math.sin(t*10+p.fk)),0,1);
    ctx.fillStyle = '#fff3d0';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,TAU()); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* =========================================================
   声音：BGM + 烟花轻爆音（WebAudio 现场合成，不需要音频文件）
   ========================================================= */
var bgm = $('bgm'), muted = false, actx = null;
/* 背景音乐的数据放在文件最末尾（见 </body> 前那段脚本）。
   放最后是为了让页面先渲染出来，不必等那一大坨 base64 下载完才显示。 */
var BGM_B64 = '';
function attachBgm(){
  if(!bgm) return;
  /* 用 mode 而不是「挂过了没」来判断：
     慢网下用户可能在音乐数据到达之前就点了开始，那时只能先挂同目录的文件；
     等内嵌数据到了要能换过来，否则音乐永远不会响。 */
  var mode = BGM_B64 ? 'embed' : 'file';
  if(bgm.getAttribute('data-mode') === mode) return;
  try{
    bgm.src = BGM_B64 ? dataUrlToBlobUrl(BGM_B64) : './mid-autumn-bgm.mp3';
    bgm.setAttribute('data-mode', mode);
    bgm.load();
  }catch(e){}
}
/* 文件末尾那段脚本加载完会回调这里，把三段音频数据一起送进来 */
window.__onMediaData = function(m){
  if(!m) return;
  BGM_B64      = m.bgm   || '';
  FX_BLAST_B64 = m.blast || '';
  FX_AMB_B64   = m.amb   || '';
  attachBgm();
  if(bgmWanted) playBgm();      /* 已经点过「开始」的话，数据一到就补播 */
  if(actx) loadEmbeddedFx();    /* 烟花音效也补上 */
};
var bgmWanted = false;
var BGM_VOL = 0.30;   /* 背景音乐音量。换成节奏感强的曲子后调低了一档，免得盖过烟花和老师的语音 */
var bgmFadeTimer = null;

function initAudio(){
  /* 必须在用户点击后调用，微信才允许出声 */
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC && !actx) actx = new AC();
    if(actx && actx.state === 'suspended' && actx.resume) actx.resume();
  }catch(e){ actx = null; }
  playBgm();
  unlockVoice();      /* 微信/iOS 必须在真实手势里解锁一次，之后点喇叭才放得出来 */
  decodeVoiceBuf();   /* 顺便解码好，点喇叭时直接用 Web Audio 播 */
  loadEmbeddedFx();   /* 解码内嵌的真实烟花音效 */
  loadRealFx();       /* 同目录要是放了 firework.mp3，就覆盖掉内嵌的单发音效 */
}
/* 音量渐变：直接切音量会"啪"一下，淡入淡出才顺 */
function fadeBgmTo(target, ms){
  if(!bgm) return;
  if(bgmFadeTimer){ clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
  var from = 0;
  try{ from = bgm.volume; }catch(e){}
  var t0 = Date.now();
  bgmFadeTimer = setInterval(function(){
    var k = Math.min(1, (Date.now()-t0)/(ms||800));
    try{ bgm.volume = from + (target-from)*k; }catch(e){}
    if(k >= 1){ clearInterval(bgmFadeTimer); bgmFadeTimer = null; }
  }, 50);
}
function playBgm(){
  if(!bgm) return;
  bgmWanted = true;
  attachBgm();
  if(!bgm.getAttribute('data-mode')) return;   /* 还没东西可挂，等回调 */
  try{
    bgm.volume = 0;                          /* 从 0 起，2.5 秒淡进来 */
    var p = bgm.play();
    if(p && p['catch']) p['catch'](function(){ /* 没有音频文件也不报错 */ });
    fadeBgmTo(BGM_VOL, 2500);
  }catch(e){}
}
/* =========================================================
   烟花音效
   ---------------------------------------------------------
   真实的烟花声不是"一下"，而是四层叠在一起：
     ① 一声脆裂的爆点（高频瞬态）
     ② 一记低频的"咚"（胸口那下）
     ③ 一团中频的轰鸣，亮度迅速衰下去
     ④ 一串噼啪的余韵（火星炸开的细碎声）
   再加上一点混响做"远处"的距离感，听起来才不像电子音。
   每一发的音高、亮度、噼啪密度都随机，所以连放不会腻。

   ★想用真实录音？★
   把一个音效文件放在与本 HTML 同目录，命名 firework.mp3 即可，
   页面会自动改用它（并且每发随机变一点音高和音量，不会听着重复）。
   免费可商用的素材可以去 pixabay.com/sound-effects 或 mixkit.co 找。
   ========================================================= */
var fxBus = null, fxConv = null, fxNoise = null, fxReal = null, fxActive = 0;
var fxOut = null;
var blastBuf = null;                 /* 内嵌的单发爆炸 */
var ambBuf = null, ambNode = null, ambGain = null, ambOn = false;   /* 整体环境声 */
var AMB_VOL = 0.34;                  /* 环境烟花声的音量，觉得吵就调小 */
var FX_VOL  = 2.0;                   /* 烟花音效总音量。后面挂了限幅，调到 2.6 也不会削顶 */

function fxInit(){
  if(!actx || fxBus) return;
  try{
    fxBus = actx.createGain();
    fxBus.gain.value = FX_VOL;
    /* 总限幅：二十发齐放时把峰值按住，不会削顶炸耳朵 */
    var lim = null;
    try{
      if(actx.createDynamicsCompressor){
        lim = actx.createDynamicsCompressor();
        if(lim.threshold) lim.threshold.value = -6;
        if(lim.knee)      lim.knee.value      = 4;
        if(lim.ratio)     lim.ratio.value     = 12;
        if(lim.attack)    lim.attack.value    = 0.003;
        if(lim.release)   lim.release.value   = 0.25;
      }
    }catch(e){ lim = null; }
    if(lim){ fxBus.connect(lim); lim.connect(actx.destination); fxOut = lim; }
    else   { fxBus.connect(actx.destination); fxOut = fxBus; }
    /* 生成一段衰减噪声当混响冲激响应 —— 廉价但很有效的"室外远处"感 */
    if(actx.createConvolver){
      var sr = actx.sampleRate, n = Math.floor(sr*1.5);
      var ir = actx.createBuffer(2, n, sr);
      for(var c=0;c<2;c++){
        var d = ir.getChannelData(c);
        for(var i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.8);
      }
      fxConv = actx.createConvolver();
      fxConv.buffer = ir;
      var wet = actx.createGain();
      wet.gain.value = 0.5;
      fxConv.connect(wet);
      wet.connect(fxBus);      /* 混响也走总限幅 */
    }
  }catch(e){ fxBus = null; }
}

/* 共用一段噪声，每次换个起点和速率就是一段新声音（比每次新建 buffer 省很多） */
function fxNoiseBuf(){
  if(fxNoise) return fxNoise;
  var sr = actx.sampleRate, n = Math.floor(sr*2);
  fxNoise = actx.createBuffer(1, n, sr);
  var d = fxNoise.getChannelData(0);
  for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
  return fxNoise;
}

/* 一段带包络的滤波噪声 */
function fxNoiseHit(t0, dur, type, f0, f1, q, peak, wet){
  try{
    var s = actx.createBufferSource();
    s.buffer = fxNoiseBuf();
    s.loop = true;
    s.playbackRate.value = 0.75 + Math.random()*0.6;
    var f = actx.createBiquadFilter();
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0);
    if(f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0+dur);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(0.012, dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(fxBus);
    if(wet && fxConv) g.connect(fxConv);
    s.start(t0, Math.random()*1.6);
    s.stop(t0 + dur + 0.03);
  }catch(e){}
}

/* 低频的那一记"咚"：正弦从高快速滑到低 */
function fxBoom(t0, f0, f1, dur, peak){
  try{
    var o = actx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(f1, t0 + dur*0.5);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(fxBus);
    if(fxConv) g.connect(fxConv);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}

/* 发射：一声由低往高的"嗖" */
function launchSound(){
  if(!actx || muted) return;
  fxInit();
  if(!fxBus) return;
  try{
    var t = actx.currentTime;
    var dur = 0.5 + Math.random()*0.3;
    var s = actx.createBufferSource();
    s.buffer = fxNoiseBuf(); s.loop = true;
    s.playbackRate.value = 0.9;
    var f = actx.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 3.2;
    f.frequency.setValueAtTime(330, t);
    f.frequency.exponentialRampToValueAtTime(1400 + Math.random()*800, t + dur);
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.042, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(fxBus);
    if(fxConv) g.connect(fxConv);
    s.start(t, Math.random()*1.5);
    s.stop(t + dur + 0.03);
  }catch(e){}
}

/* base64 → AudioBuffer */
function decodeB64Audio(b64, cb){
  try{
    /* 认最后一个 "base64," —— 万一前缀被写重了也还能解出来 */
    var k = b64.lastIndexOf('base64,');
    var c = k >= 0 ? k + 7 : (b64.indexOf(',') + 1);
    var bin = window.atob(b64.slice(c));
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    var ok = function(b){ cb(b); };
    var pr = actx.decodeAudioData(arr.buffer, ok, function(){});
    if(pr && pr.then) pr.then(ok)['catch'](function(){});
  }catch(e){}
}
var fxDecoding = false;
function loadEmbeddedFx(){
  if(!actx || fxDecoding) return;
  if(!FX_BLAST_B64 && !FX_AMB_B64) return;   /* 数据还没到，等回调 */
  fxDecoding = true;                          /* 解码是异步的，别重复发起 */
  if(!blastBuf) decodeB64Audio(FX_BLAST_B64, function(b){ blastBuf = b; });
  if(!ambBuf)   decodeB64Audio(FX_AMB_B64,   function(b){ ambBuf = b; if(ambOn) ambStart(); });
}

/* 整体烟花环境声：一段无缝循环，淡入淡出 */
function ambStart(){
  ambOn = true;
  if(!actx || !ambBuf || ambNode) return;
  fxInit();
  if(!fxBus) return;
  try{
    ambGain = actx.createGain();
    ambGain.gain.setValueAtTime(0.0001, actx.currentTime);
    ambGain.gain.exponentialRampToValueAtTime(muted ? 0.0001 : AMB_VOL, actx.currentTime + 2.2);
    ambNode = actx.createBufferSource();
    ambNode.buffer = ambBuf;
    ambNode.loop = true;
    ambNode.connect(ambGain);
    ambGain.connect(fxBus);
    ambNode.start(0, Math.random()*8);
  }catch(e){ ambNode = null; }
}
function ambSet(v, sec){
  if(!ambGain || !actx) return;
  try{
    ambGain.gain.cancelScheduledValues(actx.currentTime);
    ambGain.gain.setValueAtTime(Math.max(0.0001, ambGain.gain.value), actx.currentTime);
    ambGain.gain.exponentialRampToValueAtTime(Math.max(0.0001, v), actx.currentTime + (sec||0.5));
  }catch(e){}
}
function ambStop(){
  ambOn = false;
  if(!ambNode) return;
  ambSet(0.0001, 0.8);
  var n = ambNode, g = ambGain;
  ambNode = null; ambGain = null;
  setTimeout(function(){ try{ n.stop(0); }catch(e){} }, 1100);
}

/* 如果同目录放了 firework.mp3，就用它覆盖单发音效 */
function loadRealFx(){
  if(!actx || fxReal) return;
  try{
    var x = new XMLHttpRequest();
    x.open('GET', './firework.mp3', true);
    x.responseType = 'arraybuffer';
    x.onload = function(){
      if(!x.response || x.response.byteLength < 500) return;
      try{
        var ok = function(b){ fxReal = b; };
        var pr = actx.decodeAudioData(x.response, ok, function(){});
        if(pr && pr.then) pr.then(ok)['catch'](function(){});
      }catch(e){}
    };
    x.onerror = function(){};
    x.send();
  }catch(e){}
}

/* size: 0~1，越大表示炸得越高越远，低频越多、余韵越长 */
function popSound(size){
  if(!actx || muted) return;
  fxInit();
  if(!fxBus) return;
  if(size === undefined) size = 0.5;
  var big = clamp(size, 0, 1);

  /* 同时响的发数太多时自动减配，低端机才不会卡 */
  fxActive++;
  var busy = fxActive;
  setTimeout(function(){ fxActive = Math.max(0, fxActive-1); }, 1800);

  /* 光先到、声音后到，才像真的在远处 */
  var t = actx.currentTime + 0.05 + Math.random()*0.14;

  /* 优先用真实录音：老师放的 firework.mp3 > 内嵌的那段。
     每发随机改一点音高和音量，连放二十发也不会听着像复读。 */
  var sample = fxReal || blastBuf;
  if(sample){
    try{
      var sx = actx.createBufferSource();
      sx.buffer = sample;
      /* 炸得越高越远 → 放慢一点，听起来更低沉 */
      sx.playbackRate.value = (1.06 - big*0.16) * (0.92 + Math.random()*0.16);
      var gx = actx.createGain();
      var lvl = (0.26 + big*0.16) * (0.85 + Math.random()*0.3);
      if(busy > 4) lvl *= 0.55;      /* 齐放时压一压，别糊成一片 */
      gx.gain.value = lvl;
      sx.connect(gx); gx.connect(fxBus);
      if(fxConv){
        var wetx = actx.createGain();
        wetx.gain.value = lvl * 0.35;   /* 少量混响，拉开距离 */
        gx.connect(wetx); wetx.connect(fxConv);
      }
      sx.start(t);
      return;
    }catch(e){}
  }

  var vol = 0.085 + big*0.085;

  /* ① 脆裂的爆点 */
  fxNoiseHit(t, 0.045, 'highpass', 2400 + Math.random()*1400, 0, 0.7, vol*1.25, false);
  /* ② 低频的"咚" */
  fxBoom(t, 140 + (1-big)*100 + Math.random()*40, 32 + big*10, 0.32 + big*0.2, vol*1.0);
  /* ③ 中频轰鸣，亮度迅速掉下去 */
  fxNoiseHit(t + 0.005, 0.28 + big*0.16, 'lowpass', 2600 + Math.random()*900, 300, 0.6, vol*0.85, true);
  /* ④ 噼啪余韵 —— 这一层是"像不像真烟花"的关键 */
  if(busy <= 4){
    var n = 16 + Math.floor(Math.random()*16);
    for(var i=0;i<n;i++){
      var dt = 0.07 + Math.pow(Math.random(), 1.7) * (0.85 + big*0.8);
      var a = vol * 0.5 * (0.4 + Math.random()*0.8) * Math.max(0, 1 - dt/1.9);
      if(a < 0.0008) continue;
      var hz = 2200 + Math.random()*3800;
      fxNoiseHit(t + dt, 0.010 + Math.random()*0.022, 'highpass', hz, 0, 1.3, a, true);
    }
  }
}

/* 点一下白色数字：换下一个值 + 立刻让画面动起来 */
function bindTapVal(span, tap){
  span.addEventListener('click', function(e){

    TUNE[tap.key] = vals[(i + 1) % vals.length];

    if(scene === SC.START) return;

var cpBody = $('cpBody'), cpNow = $('cpNow');
