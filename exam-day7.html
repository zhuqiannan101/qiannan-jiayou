<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>9元课导新人训 · Day7 赛考体系结业考试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:#f2f4f8; color:#1f2937; min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header { background:linear-gradient(135deg,#9333ea,#db2777); color:#fff; border-radius:16px; padding:26px 24px; margin-bottom:20px; }

  header p { font-size:13px; opacity:.92; line-height:1.7; }
  /* 登录页 */
  .login { background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .login h2 { font-size:16px; margin-bottom:16px; }
  .frow { margin-bottom:14px; }
  .frow label { display:block; font-size:13px; color:#6b7280; margin-bottom:6px; }
  .frow input { width:100%; border:1.5px solid #e5e7eb; border-radius:10px; padding:11px 14px; font-size:15px; outline:none; }
  .frow input:focus { border-color:#9333ea; }
  .btn { border:none; border-radius:10px; padding:12px 24px; font-size:15px; font-weight:600; cursor:pointer; background:#9333ea; color:#fff; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.gray { background:#e5e7eb; color:#4b5563; }
  /* 考试中 */
  .exam-top { display:none; background:#fff; border-radius:14px; padding:14px 18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .exam-top.show { display:flex; }
  .who { font-size:14px; font-weight:600; }
  .who small { color:#9ca3af; font-weight:400; }
  .prog { font-size:13px; color:#6b7280; }
  .card { display:none; background:#fff; border-radius:14px; padding:22px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .card.show { display:block; }
  .qmeta { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .qtype { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .qtype.single { background:#ede9fe; color:#6d28d9; }
  .qtype.multi { background:#fce7f3; color:#be185d; }
  .qtype.judge { background:#dcfce7; color:#15803d; }
  .qtype.fill { background:#fef3c7; color:#b45309; }
  .qtext { font-size:15px; font-weight:600; line-height:1.7; margin-bottom:14px; }
  .qtext .blank { color:#b45309; }
  .opt { display:block; border:1.5px solid #e5e7eb; border-radius:10px; padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:14px; line-height:1.5; transition:.12s; user-select:none; }
  .opt:hover { border-color:#d8b4fe; }
  .opt.sel { border-color:#9333ea; background:#faf5ff; }
  .fill-row { margin-bottom:10px; }
  .fill-input { width:100%; border:1.5px solid #e5e7eb; border-radius:10px; padding:11px 14px; font-size:14px; outline:none; }
  .fill-input:focus { border-color:#9333ea; }
  .nav { display:flex; justify-content:space-between; gap:10px; }
  /* 结果页 */
  .result { display:none; background:#fff; border-radius:16px; padding:28px 24px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .result.show { display:block; }
  .result .score { text-align:center; font-size:52px; font-weight:800; margin-bottom:4px; }
  .result .line { text-align:center; color:#6b7280; font-size:14px; margin-bottom:18px; line-height:1.8; }
  .review-item { border-top:1px solid #f3f4f6; padding:14px 0; font-size:14px; line-height:1.7; }
  .review-item .tag { font-size:11px; padding:1px 8px; border-radius:999px; font-weight:600; margin-right:6px; }
  .tag.ok { background:#dcfce7; color:#15803d; }
  .tag.no { background:#fee2e2; color:#b91c1c; }
  .review-item .your { color:#b45309; }
  .review-item .ans { color:#15803d; font-weight:600; }
  .warn { background:#fef3c7; border-radius:10px; padding:10px 14px; font-size:13px; color:#92400e; margin-bottom:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📝 9元课导新人训 · Day7 赛考体系结业考试</h1>
    <p>随机 30 题 · 单选 / 多选 / 判断 / 填空混合 · 满分 100 分（按准确率计算）<br>题池 105 题随机抽 30，每人卷面不同；80 分及以上通过</p>
  </header>

  <!-- 登录 -->
  <div class="login" id="login">
    <h2>考生信息</h2>
    <div class="frow"><label>姓名（必填）</label><input id="f-name" placeholder="请输入真实姓名" autocomplete="off"></div>
    <div class="frow"><label>班级 / 工号（选填）</label><input id="f-cls" placeholder="如：图形化1期 / 8001" autocomplete="off"></div>
    <div class="warn">⚠️ 共 30 题，交卷后立即出分且不可重考（每次进入题目都会重新随机）。请确认时间充裕后开始。</div>
    <button class="btn" id="start-btn" onclick="startExam()">开始考试</button>
  </div>

  <!-- 考试 -->
  <div class="exam-top" id="exam-top">
    <div class="who" id="who"></div>
    <div class="prog" id="prog"></div>
  </div>
  <div class="card" id="card"></div>

  <!-- 结果 -->
  <div class="result" id="result">
    <div class="score" id="score">--</div>
    <div class="line" id="score-line"></div>
    <div style="text-align:center;margin-bottom:18px"><button class="btn gray" onclick="copyResult()">📋 复制成绩单（发给培训负责人）</button></div>
    <div id="review"></div>
  </div>
</div>

<script>
const BANK = [{"t":"single","q":"什么是科技特长生？","o":["学校自行评选的科技爱好者","经教育厅、教育局发文，有正式定义、享有特殊招生政策的学生群体","参加过编程比赛的学生","学过机器人的学生"],"a":[1],"e":"科技特长生是经过教育厅、教育局发文，有正式定义的、享有特殊招生政策的学生群体。在科技领域有特长或获奖，可被重点高中以特长生身份录取。","src":"赛考体系"},{"t":"single","q":"科技特长生政策主要适用的升学阶段是？","o":["初升高","小学低年级","幼升小","小升初"],"a":[0],"e":"科技特长生政策主要在「初升高」阶段有政策；小升初阶段可作为简历加分。截至 2024 年政策已覆盖全国 88% 的省市。","src":"赛考体系"},{"t":"single","q":"白名单赛事是谁公布的竞赛活动？","o":["工业和信息化部","中国计算机学会","共青团中央","教育部"],"a":[3],"e":"白名单赛事是教育部每年公布的面向 6-18 岁学生的竞赛活动，有严格评判标准、含金量高、成绩官方认可。","src":"赛考体系"},{"t":"single","q":"2022-2025 教育部白名单赛事中，科学素养类占比约为？","o":["27%","21%","52%","35%"],"a":[2],"e":"白名单赛事类别占比：科学素养类 52%、人文综合素养类 27%、体育类 21%——科学素养类过半，是占比最大的一类。","src":"赛考体系"},{"t":"single","q":"白名单赛事的价值不包括以下哪项？","o":["科技特长生认定条件","强基计划入围参考","保送生认定依据","直接免除中考"],"a":[3],"e":"白名单赛事四大价值：科技特长生认定条件、强基计划入围参考、保送生认定依据、小升初简历核心素材。白名单证书不能直接免除中考。","src":"赛考体系"},{"t":"single","q":"强基计划覆盖多少所一流大学？","o":["49 所","59 所","29 所","39 所"],"a":[3],"e":"强基计划是我国重大高等教育招生改革试点，覆盖清北等 39 所一流大学，选拔有志于服务国家重大战略需求且综合素质优秀或基础学科拔尖的学生。","src":"赛考体系"},{"t":"single","q":"强基计划的录取方式是？","o":["仅看高考成绩","仅看竞赛成绩","高考成绩 × 85% + 校考/面试 × 15%","高考成绩 × 50% + 校考 × 50%"],"a":[2],"e":"强基计划录取方式：高考成绩 × 85% + 校考/面试 × 15% = 按得分排名录取。核心优势：降分录取机会、39 所双一流、优于提前批前录取。","src":"赛考体系"},{"t":"single","q":"升学路径分层中，小升初阶段编程证书的核心作用是？","o":["直接免试入学","丰富履历、入选名校专班","直接认定科技特长生","保送重点高中"],"a":[1],"e":"升学路径分层：小升初走「丰富履历」（简历筛选、荣誉证书是隐形选拔的核心依据）→ 初升高走「科技特长生」（重点高中降分录取）→ 高升大走「强基计划」（名校敲门砖）。","src":"赛考体系"},{"t":"single","q":"初升高阶段走的是哪条路径？","o":["国际赛事","丰富履历","科技特长生，重点高中降分录取","强基计划"],"a":[2],"e":"初升高走「科技特长生」路径——重点高中降分录取；强基计划是高考阶段（高升大）的路径。","src":"赛考体系"},{"t":"single","q":"高升大阶段走的是哪条路径？","o":["科技特长生","强基计划，名校敲门砖","学区房","丰富履历"],"a":[1],"e":"高升大走「强基计划」路径——名校敲门砖；信奥赛拿过相应奖项、过一本线就可以报强基。","src":"赛考体系"},{"t":"single","q":"2022 年新课改后，信息科技课的地位变化是？","o":["信息科技课成为独立学科","被彻底取消","仅作为选修兴趣课","从独立学科降为实践活动"],"a":[0],"e":"2022 年新课标大改革：信息科技课成为独立学科（义务教育信息科技课程标准 2022 年版）；对比 2011 年旧版，信息技术仅包含于实践活动、无独立课标。","src":"赛考体系"},{"t":"single","q":"核桃主流赛考分为四大类，其中属于「考试」的是？","o":["白名单赛事","信息学奥赛","等级考试","图灵杯"],"a":[2],"e":"四大分类：等级考试（属于「考试」，YCL、CTL、GESP）、国家级赛事（属于「竞赛」，图灵杯）、白名单赛事（属于「竞赛」）、信息学奥赛（属于「竞赛」，难度极高仅适合少数拔尖学员）。","src":"赛考体系"},{"t":"single","q":"CTL 的全称是？","o":["青少年人工智能编程水平测试","全国青少年计算思维等级测评","中国计算机学会编程能力等级认证","全国青少年编程及人工智能挑战活动"],"a":[1],"e":"CTL 全称「全国青少年计算思维等级测评」；A 是 YCL、C 是 GESP、D 是图灵杯。","src":"赛考体系"},{"t":"single","q":"CTL 的主办单位是？","o":["中国计算机学会","工业和信息化部教育与考试中心","中国光华科技基金会","中国电子学会"],"a":[2],"e":"CTL 由共青团中央直属单位中国光华科技基金会主办，清华大学计算机科学与技术系作为指导单位。","src":"赛考体系"},{"t":"single","q":"CTL 的指导单位是？","o":["清华大学计算机科学与技术系","中国科学院计算机技术研究所","浙江大学计算机学院","北京大学信息科学技术学院"],"a":[0],"e":"CTL 与图灵杯的指导单位都是清华大学计算机科学与技术系；考试标准由主办方联合清华计算机系共同制定。","src":"赛考体系"},{"t":"single","q":"CTL 的测评语言覆盖？","o":["仅图形化","图形化、Python、C++","仅 Python 和 C++","仅 C++"],"a":[1],"e":"CTL 测评语言：图形化、Python、C++ 三种；等级设置：图形化 1-4 级、Python 1-6 级、C++ 1-6 级。","src":"赛考体系"},{"t":"single","q":"CTL 的年龄范围是？","o":["8-16 岁","12-18 岁","5-12 岁","6-18 岁"],"a":[3],"e":"CTL 面向 6-18 岁青少年，线上机考形式。","src":"赛考体系"},{"t":"single","q":"CTL 的报考规则是？","o":["满分 100 分，60 分视为通过，逐级报考","满分 150 分，90 分通过","不设及格线","满分 100 分，80 分通过"],"a":[0],"e":"CTL 报考规则：满分 100 分、60 分视为通过、逐级报考；题型分布为单选题、判断题、编程题。","src":"赛考体系"},{"t":"single","q":"CTL 的考试时长是？","o":["120 分钟固定不变","30 分钟","60 分钟","90 分钟"],"a":[3],"e":"CTL 考试时长 90min（不同级别考试时长有差异，以实际通知为准；文档表亦标注 90/120/180min 分级）。","src":"赛考体系"},{"t":"single","q":"CTL 测评结果获得什么等级的选手可入选光华人才库？","o":["及格","良好","优秀","参赛即可"],"a":[2],"e":"CTL 各等级测评结果获得「优秀等级」的选手可进入光华人才库，入库人才将优先推荐参与团中央系列活动。","src":"赛考体系"},{"t":"multi","q":"白名单赛事的定义要点包括？","o":["教育部每年公布","面向 6-18 岁学生","有严格评判标准，含金量高","赛事成绩官方认可"],"a":[0,1,2,3],"e":"白名单四要点：教育部每年公布、面向 6-18 岁、严格评判标准含金量高、成绩官方认可。","src":"赛考体系"},{"t":"multi","q":"升学路径三阶段分层正确的有？","o":["小升初——丰富履历，入选名校专班","初升高——科技特长生，重点高中降分录取","高升大——强基计划，名校敲门砖","高升大——丰富履历"],"a":[0,1,2],"e":"三层路径：小升初丰富履历 → 初升高科技特长生 → 高升大强基计划。D 错误——丰富履历是小升初的路径。","src":"赛考体系"},{"t":"multi","q":"编程学习路径与文化课学习路径的对应关系正确的有？","o":["文化课：日常学习 → 期末考试 → 中考 → 高考","编程：日常学习 → 等级考试 → 国家级赛事 → 信奥赛","等级考试类似期末考试，是阶段性检验","可以跳过等级考试直接冲信奥赛"],"a":[0,1,2],"e":"没有人会说「期末考试没用，直接准备高考」——每一步考试都是学习的检验、能力的积累、信心的建立。D 错误——等级考试和国家级赛事是通往更高目标的必经之路，不可跳过。","src":"赛考体系"},{"t":"multi","q":"等级考试的作用包括？","o":["系统检验知识点掌握程度","建立阶段性学习目标和成就感","获得官方认证的能力证书","为高阶赛事打下扎实基础"],"a":[0,1,2,3],"e":"等级考试是「夯实基础」的引擎：检验知识点、建立阶段目标与成就感、官方认证证书、为高阶赛事打基础，还能培养应试心态和时间管理。","src":"赛考体系"},{"t":"multi","q":"国家级赛事的作用包括？","o":["真实场景下的实战能力锻炼","与全国优秀选手同台竞技","积累宝贵的赛事经验和履历","获奖证书为升学加分添彩"],"a":[0,1,2,3],"e":"国家级赛事是「提升能力」的引擎：实战锻炼、同台竞技、积累经验履历、开阔视野激发动力、获奖证书为升学添彩。两者相辅相成缺一不可。","src":"赛考体系"},{"t":"multi","q":"CTL 的含金量亮点包括？","o":["光华人才库：优秀等级选手可入选团中央认证的光华人才库","官方双章认证：中国光华科技基金会与组委会联合双章","考试标准权威：主办方联合清华大学计算机系共同制定","能力可视化：检验同年龄段真实编程水平"],"a":[0,1,2,3],"e":"CTL 四大含金量：光华人才库、官方双章认证、考试标准权威（联合清华共同制定）、能力可视化——一个都不能说错。","src":"赛考体系"},{"t":"multi","q":"关于图灵杯的基本信息，正确的有？","o":["全称：全国青少年编程及人工智能挑战活动","主办：中国光华科技基金会","指导：清华大学计算机科学与技术系","参赛语言：图形化、Python、C++"],"a":[0,1,2,3],"e":"图灵杯信息一览：主办中国光华科技基金会（共青团中央直属、正厅级公募基金会）、指导清华计算机系、参赛语言图形化/Python/C++、报名费 300 元、线上机考。","src":"赛考体系"},{"t":"multi","q":"图灵杯的三大核心卖点包括？","o":["清华大学计算机系牵头赛事命题和评审","国赛一等奖可参加 985 高校人工智能学院教授科研项目","全国选拔阶段一等奖直接进入光华科技人才数据库","获奖直接保送清华北大"],"a":[0,1,2],"e":"图灵杯三大核心卖点：清华牵头命题评审、国赛一等奖参加 985 教授科研项目、全国选拔一等奖进光华人才库。D 错误——图灵杯没有直接保送清北的说法，不能对家长做这种承诺。","src":"赛考体系"},{"t":"multi","q":"图灵杯初赛的奖项设置为？","o":["一等奖比例 10%","二等奖比例 25%","三等奖比例 35%","优秀奖比例 30%，前 10% 选手可进入决赛"],"a":[0,1,2,3],"e":"图灵杯初赛：一、二、三等奖、优秀奖，比例为 10%、25%、35%、30%，其中前 10% 选手可进入决赛。","src":"赛考体系"},{"t":"multi","q":"图灵杯决赛的奖项设置为？","o":["一等奖比例 10%","二等奖比例 40%","三等奖比例 50%","设优秀奖"],"a":[0,1,2],"e":"图灵杯决赛：一、二、三等奖，比例为 10%、40%、50%，不设优秀奖。D 错误——优秀奖是初赛才有的奖项。","src":"赛考体系"},{"t":"multi","q":"关于图灵杯的比赛周期，正确的有？","o":["每年 2 场","上半年：3-7 月初赛，8 月决赛","下半年：9-1 月初赛，2 月决赛","每月均可参赛"],"a":[0,1,2],"e":"图灵杯每年 2 场：上半年 3-7 月初赛、8 月决赛；下半年 9-1 月初赛、2 月决赛（具体以组委会每年同步赛制为准）。D 错误——每月可报的是 CTL 等考。","src":"赛考体系"},{"t":"multi","q":"关于 YCL 的基本信息，正确的有？","o":["全称：青少年人工智能编程水平测试","主办：工业和信息化部教育与考试中心、中国电子教育学会联合主办","是行业中唯一由中央部委直属单位主办的等级考试","试题研发：中国科学院计算机技术研究所"],"a":[0,1,2,3],"e":"YCL 四要点：工信部教育与考试中心 + 中国电子教育学会联合主办（双章认证）、唯一中央部委直属单位主办的等级考试、中科院计算机所负责考试体系和试题研发、报名费 300 元（1-2 级 300、3-8 级 400）。","src":"赛考体系"},{"t":"multi","q":"关于 YCL 的等级设置与规则，正确的有？","o":["共 8 个级别","图形化 1-3 级，Python/C++ 4-8 级","60 分视为通过","题型为单选题、判断题、编程题"],"a":[0,1,2,3],"e":"YCL 等级设置：共 8 级，图形化 1-3 级、Python/C++ 4-8 级；规则：逐级报考、60 分通过（满分 100）；题型客观题 + 编码题，时长 60-90min。","src":"赛考体系"},{"t":"multi","q":"YCL 的作用包括？","o":["检验孩子编程水平","为后续白名单赛事积攒比赛经验","高含金量证书为评奖评优简历添色","为走科技特长生升学之路打好基础"],"a":[0,1,2,3],"e":"YCL 五大作用（取其四）：检验编程水平、积攒大赛经验、履历闪光评奖评优、为升学之路打基础，还能让家长在人才数据库查到证书。","src":"赛考体系"},{"t":"multi","q":"关于 GESP 的基本信息，正确的有？","o":["主办：中国计算机学会 CCF","考试语言：图形化、Python、C++","每年 4 次考试：3 月、6 月、9 月、12 月","考试地点均为线下"],"a":[0,1,2,3],"e":"GESP（中国计算机学会编程能力等级认证）：CCF 主办，与 CSP-J/S 同主办单位；语言图形化/Python/C++；每年 3/6/9/12 月四次；均为线下考试；一级 300 元逐级加 20 元。","src":"赛考体系"},{"t":"multi","q":"白名单赛事中核桃组织学员参加的赛事包括？","o":["全国青少年人工智能创新挑战赛","全国青少年心理成长知识与应用创新大赛","全国中学生信息学奥林匹克竞赛 NOI","全国中小学信息技术创新与实践大赛 NOC"],"a":[0,1,2,3],"e":"核桃涉及的白名单赛事四项及主办方：人工智能创新挑战赛（中国少年儿童发展服务中心）、心理成长知识与应用创新大赛（中国心理卫生协会）、NOI（中国计算机学会）、NOC（中国人工智能学会）；共 47 项竞赛中 17 项用到编程、占三分之一。","src":"赛考体系"},{"t":"multi","q":"信奥赛 NOI 系列的晋级链条正确的是？","o":["CSP 是参加信息学奥赛的预选赛","CSP-S 优秀成绩可获得 NOIP 参赛资格","NOIP 成绩用于省队筛选","NOI 国赛前五名有望进入国家队征战 IOI"],"a":[0,1,2,3],"e":"晋级链：CSP 预选赛 → CSP-S 优秀获 NOIP 资格 → NOIP 省队筛选 → NOI 国赛 → 国赛前五名有望进国家队征战 IOI。信奥赛是五大学科竞赛之一，C++ 是唯一参赛语言。","src":"赛考体系"},{"t":"judge","q":"赛考的三重业务价值包括：拉齐赛事认知、检验学习效果、增强长期规划意愿，其中招报等于小续报。","a":[0],"e":"赛考三重价值：拉齐赛事认知（参赛是编程学习必经之路）、检验学习效果（以考促学）、增强长期规划意愿（招报 = 小续报）。","src":"赛考体系"},{"t":"judge","q":"小升初阶段真的「没有政策」，证书完全没用。","a":[1],"e":"不是没有政策，而是政策不允许公开选拔——优质学校仍需拔尖，简历筛选、荣誉证书、点招是隐形选拔的核心依据，所以证书和履历反而更重要。","src":"赛考体系"},{"t":"judge","q":"跟家长沟通科技特长生时，可以说孩子一定能被认定。","a":[1],"e":"我们同步的是「初步具备资格和可能性」，具体能否认定要看当地学校政策；需被学校认定的比赛才算，各地区标准不同，不能用确定性表述。","src":"赛考体系"},{"t":"judge","q":"强基计划录取中，高考成绩占 85%，校考面试占 15%。","a":[0],"e":"强基计划录取公式：高考成绩 × 85% + 校考/面试 × 15% = 按得分排名录取。","src":"赛考体系"},{"t":"judge","q":"编程是所有课外班中，唯一一个从小学到高中、甚至到未来工作都持续有效的赛道。","a":[0],"e":"对比舞蹈/音乐/体育（兴趣培养为主、升学助力有限、职业路径窄），编程贯穿小学到高中、升学全程助力、辅助语数学科、未来职业刚需。","src":"赛考体系"},{"t":"judge","q":"跟家长做规划时，可以张嘴就承诺「强基计划、清华北大」。","a":[1],"e":"规划要落地不要空谈——落地在思维培养 + 学习习惯，顺道拿证书检验学习效果，不能空喊强基清北。","src":"赛考体系"},{"t":"judge","q":"信奥赛属于「考试」类，适合大多数学员参加。","a":[1],"e":"信奥赛 NOI 属于「竞赛」且难度极高，仅适合少数拔尖学员参加；适合大多数学员的是等级考试。","src":"赛考体系"},{"t":"judge","q":"图灵杯是国家级赛事，由共青团中央直属单位主办，行政级别是正厅级。","a":[0],"e":"图灵杯主办单位中国光华科技基金会是共青团中央主管下的全国性公募基金会，行政级别正厅级；其设立的「光华科技奖」产生过两院院士 99 人。","src":"赛考体系"},{"t":"judge","q":"图灵杯的参赛形式是线上机考，报名费用 300 元。","a":[0],"e":"图灵杯报名费 300 元，参赛形式线上机考（线上 & 线下结合，核桃组织以线上为主）。","src":"赛考体系"},{"t":"judge","q":"图灵杯初赛前 10% 选手可以进入决赛。","a":[0],"e":"初赛奖项比例 10%、25%、35%、30%，其中前 10% 选手晋级决赛；决赛一、二、三等奖比例为 10%、40%、50%。","src":"赛考体系"},{"t":"judge","q":"CTL 每月均可报名参加。","a":[0],"e":"CTL 报考频次：每月均可报名参加。对比：GESP 每年 4 次（3/6/9/12 月）、图灵杯每年 2 场。","src":"赛考体系"},{"t":"judge","q":"GESP 达到一定级别可以免试 CSP 对应认证，它与 CSP-J/S、信奥赛是同一主办单位。","a":[0],"e":"GESP 主办方 CCF 与 CSP-J/S、信奥赛同源，考纲难度对标 CSP-J/S，达到相应级别可获 CSP 免试资格，参加 GESP 就是给晋级 CSP-J/S 多几个机会。","src":"赛考体系"},{"t":"judge","q":"图形化课程共 2 个阶段共 1 年，赛考交付上每个阶段对应一场考级加一场赛事。","a":[0],"e":"图形化共 2 个阶段（1 年），每阶段对应「一场考级 + 一场赛事」，半年具备 2 张国家级证书水平。","src":"赛考体系"},{"t":"judge","q":"图形化一阶段主要履约的考和赛是 CTL 和图灵杯。","a":[0],"e":"图形化一阶段履约 CTL（等考）+ 图灵杯（赛事），这是本阶段赛考履约的重点组合。","src":"赛考体系"},{"t":"judge","q":"图灵杯初级组的题型是单选 10 道加编程 3 道，考试时长 90 分钟。","a":[0],"e":"图灵杯组别题量：初级组（7-9 岁）单选 10 + 编程 3；中级组（10-12 岁）单选 10 + 编程 4；进阶/高级组单选 10 + 编程 5；均 90min。","src":"赛考体系"},{"t":"judge","q":"YCL 的证书可以在国家人才数据库查到，类似大学英语四六级，是编程学习能力的权威证明。","a":[0],"e":"YCL 话术：工信部教育与考试中心 + 中国电子教育学会联合盖章，证书国家人才数据库可查——不一定是什么加分神器，但绝对是编程学习能力的权威证明。","src":"赛考体系"},{"t":"judge","q":"图灵杯和 CTL 等考都来源于青少年人工智能素养提升公益计划，该计划由共青团中央主管的中国光华科技基金会发起。","a":[0],"e":"赛事和等考来源：青少年人工智能素养提升公益计划——由共青团中央主管的中国光华科技基金会发起，活动包含「图灵杯」全国青少年编程及人工智能挑战活动及全国青少年计算思维等级测评（CTL）等专项活动。","src":"赛考体系"},{"t":"judge","q":"图灵杯的赛道设置覆盖智能算法、创意编程、智能硬件、AIGC 四个赛道。","a":[0],"e":"图灵杯赛项覆盖智能算法、创意编程（创意设计）、智能硬件、AIGC 四个赛道，聚焦人工智能议题，培养定义问题、解决问题的能力。","src":"赛考体系"},{"t":"judge","q":"图灵杯是由共青团中央主管的公募基金会主办、清华大学计算机系技术指导、北京中企至信科技有限公司负责运营的全国性赛事。","a":[0],"e":"图灵杯三主体：主办——共青团中央主管的公募基金会中国光华科技基金会；技术指导——清华大学计算机科学与技术系；运营——北京中企至信科技有限公司。","src":"赛考体系"},{"t":"judge","q":"讲好图灵杯和 CTL 的底层逻辑三步是：先讲是什么、再讲为什么、最后讲有什么。","a":[0],"e":"如何讲好「图灵杯」+「CTL 等级测评」的底层逻辑：①是什么——讲清楚赛事、赛制；②为什么——赛事亮点含金量；③有什么——能带给孩子什么东西。","src":"赛考体系"},{"t":"judge","q":"图灵杯初赛和决赛的获奖选手都将获得纸质版证书。","a":[1],"e":"初赛、决赛获奖选手获得的是【电子版证书】，不是纸质版。","src":"赛考体系"},{"t":"judge","q":"图灵杯国赛一等奖获奖学员可参加 985 高校人工智能学院教授的科研项目。","a":[0],"e":"图灵杯核心卖点：国赛一等奖获奖学员可参加 985 高校人工智能学院教授的科研项目，深度参与科研、接触前沿技术、提早科研立志。","src":"赛考体系"},{"t":"judge","q":"教育部信息科技课标组组长熊璋领衔图灵杯专家委员会，985 高校计算机和人工智能领域的 30 多位专家全程参与评审。","a":[0],"e":"图灵杯辅助卖点：教育部信息科技课标组组长、人工智能教育权威专家熊璋领衔专家委员会，985 高校计算机和人工智能领域 30 多位专家全程参与，保障评审质量与赛事公平。","src":"赛考体系"},{"t":"judge","q":"中国光华科技基金会设立的「光华科技奖」奖励国防科技领域人才 2600 余人，从中产生两院院士共 99 人。","a":[0],"e":"主办单位背景：中国光华科技基金会是共青团中央主管下的全国性公募基金会（正厅级），其「光华科技奖」奖励国防科技领域人才 2600 余人，从中产生两院院士 99 人——主办实力雄厚。","src":"赛考体系"},{"t":"judge","q":"中国光华科技基金会曾多次举办北斗杯、智航杯等白名单赛事，办赛经验丰富。","a":[0],"e":"中国光华科技基金会多次成功举办【北斗杯】全国青少年空天科技体验与创新大赛、【智航杯】全国无人机智能算法竞赛等白名单赛事，办赛经验丰富。","src":"赛考体系"},{"t":"judge","q":"共青团系统所举办的各类比赛在中小学中具有更高的认可度，因为少先队和共青团员的相关管理评选工作由共青团负责。","a":[0],"e":"为什么共青团主办的赛事学校更认可：中国共产主义青年团是党领导的先进青年群团组织，少年先锋队队员、共青团员的管理和评选（如红领巾奖章、十佳少先队员）由共青团负责，因此共青团系统举办的比赛在中小学认可度更高。","src":"赛考体系"},{"t":"judge","q":"家长不愿为虚无缥缈的素质教育买单，赛事证书能给孩子带来确定的择优机会，这是报名图灵杯和 CTL 的核心心理。","a":[0],"e":"家长痛点：不愿为虚无缥缈的素质教育买单，需要证书等实物证明学习成果；点招分数太高未必能走，但科创履历丰富就可能被择优选走——证书就是家长要的确定性，通过赛事给孩子赢得一次机会。","src":"赛考体系"},{"t":"judge","q":"图灵杯赛事定位对标蓝桥 STEMA，同为国家级赛事，核桃在该类赛事成绩行业排名第一。","a":[0],"e":"核桃赛事成绩：图灵杯定位国家级赛事、对标蓝桥 STEMA，核桃在同类赛事行业排名第一；2025 年助力 104050 名学员拿下科技特长生入场券，四年翻 31 倍。","src":"赛考体系"},{"t":"judge","q":"科特线学员一年具备考 4 张国家级证书的水平，即半年 2 证。","a":[0],"e":"核桃拿证效率：科特线一年具备考 4 张国家级证书水平（半年 2 证）；思维线一年 3 张（半年 1 证）。这也是图形化一阶段 CTL+图灵杯履约的底气。","src":"赛考体系"},{"t":"judge","q":"核桃赛考服务包括：备赛阶段建立专属微信群答疑、冲刺阶段直播讲解答题技巧、比赛过程远程伴考、成绩公布后提醒查询。","a":[0],"e":"核桃赛事服务六项：赛考全流程护航、专属赛考规划、备赛阶段专属微信群答疑、冲刺阶段直播技术讲解与答题技巧、远程伴考服务第一时间响应、成绩/证书查询提醒。","src":"赛考体系"},{"day":3,"tag":"升学路径","src":"Day7变式","t":"fill","q":"升学路径分层：小升初走「丰富履历」，初升高走「____」，高升大走「强基计划」。","a":["科技特长生"],"e":"三层路径：小升初丰富履历（简历隐形选拔）→ 初升高科技特长生（重点高中降分录取）→ 高升大强基计划（名校敲门砖）。"},{"day":3,"tag":"升学路径","src":"Day7变式","t":"single","q":"初升高阶段走的升学路径是？","o":["丰富履历","科技特长生","强基计划","国际赛事"],"a":[1],"e":"初升高走「科技特长生」——重点高中降分录取；小升初走丰富履历，高升大走强基计划。"},{"day":3,"tag":"科技特长生","src":"Day7变式","t":"fill","q":"科技特长生是经过____、教育局发文，有正式定义、享有特殊招生政策的学生群体。","a":["教育厅"],"e":"科技特长生定义：经教育厅、教育局发文，有正式定义、享有特殊招生政策的学生群体；覆盖全国 88% 省市。"},{"day":3,"tag":"科技特长生","src":"Day7变式","t":"judge","q":"跟家长沟通时可以承诺孩子一定能被认定科技特长生。","a":[1],"e":"只能同步「初步具备资格和可能性」，具体看当地学校政策，不能用确定性表述。"},{"day":3,"tag":"白名单","src":"Day7变式","t":"fill","q":"白名单赛事是____每年公布的面向 6-18 岁学生的竞赛活动，成绩官方认可。","a":["教育部"],"e":"白名单赛事：教育部每年公布，面向 6-18 岁，严格评判标准含金量高，成绩官方认可。"},{"day":3,"tag":"白名单","src":"Day7变式","t":"multi","q":"白名单赛事的价值包括？","o":["科技特长生认定条件","强基计划入围参考","保送生认定依据","小升初简历核心素材"],"a":[0,1,2,3],"e":"白名单四大价值：科特认定条件、强基入围参考、保送认定依据、小升初简历核心素材。"},{"day":3,"tag":"白名单占比","src":"Day7变式","t":"fill","q":"教育部白名单赛事中科学素养类占比约____%，是占比最大的一类。","a":["52"],"e":"白名单类别占比：科学素养类 52%、人文综合素养类 27%、体育类 21%。"},{"day":3,"tag":"强基计划","src":"Day7变式","t":"fill","q":"强基计划覆盖清北等____所一流大学，高考成绩占 85%、校考面试占 15%。","a":["39|三十九"],"e":"强基计划：39 所双一流，85% 高考 + 15% 校测，降分录取机会、优于提前批前录取。"},{"day":3,"tag":"小升初话术","src":"Day7变式","t":"judge","q":"小升初不是没有政策，而是政策不允许公开选拔，所以证书和履历反而更重要。","a":[0],"e":"核心逻辑：九年义务教育不允许公开选拔，但优质学校仍需拔尖——简历筛选、荣誉证书是隐形选拔核心依据。"},{"day":3,"tag":"编程赛道","src":"Day7变式","t":"judge","q":"编程是所有课外班中唯一从小学到高中甚至未来工作都持续有效的赛道。","a":[0],"e":"对比舞蹈/音乐/体育（兴趣为主、升学助力有限），编程贯穿小学到高中、升学全程助力、辅助语数学科、未来职业刚需。"},{"day":3,"tag":"赛考分类","src":"Day7变式","t":"fill","q":"核桃主流赛考四大类：等级考试、国家级赛事、白名单赛事、____。","a":["信息学奥赛|信奥赛"],"e":"四大分类：等级考试（考试）、国家级赛事（竞赛）、白名单赛事（竞赛）、信息学奥赛（竞赛，难度极高）。"},{"day":3,"tag":"赛考分类","src":"Day7变式","t":"single","q":"四大类中属于「考试」的是？","o":["白名单赛事","信息学奥赛","等级考试","图灵杯"],"a":[2],"e":"只有等级考试属于「考试」（适合大多数学员）；国家级赛事、白名单、信奥赛都属于「竞赛」。"},{"day":3,"tag":"学习路径","src":"Day7变式","t":"fill","q":"编程学习路径：日常学习 → 等级考试 → 国家级赛事 → ____。","a":["信奥赛|信息学奥赛"],"e":"编程路径对应文化课路径（日常→期末→中考→高考）；每一步都是学习的检验、能力的积累、信心的建立。"},{"day":3,"tag":"CTL基础","src":"Day7变式","t": const answers = {};   // idx -> {picked:[], fillVals:[], correct:bool}

function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function letters(arr){ return arr.map(i=>String.fromCharCode(65+i)).sort().join(""); }
function normAns(s){ return String(s).trim().toLowerCase().replace(/\s+/g,"").replace(/[。，,．.、！!？?：:；;]/g,""); }

function startExam(){
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('请填写姓名'); return; }
  student = { name, cls: document.getElementById('f-cls').value.trim() };
  // 抽题：题干去重
  const pool = shuffle(BANK);
  const seen = new Set(); PAPER = [];
  for (const q of pool) { if (PAPER.length >= N) break; if (seen.has(q.q)) continue; seen.add(q.q); PAPER.push(q); }
  document.getElementById('login').style.display = 'none';
  document.getElementById('exam-top').classList.add('show');
  document.getElementById('who').innerHTML = esc(student.name) + (student.cls ? ' <small>· ' + esc(student.cls) + '</small>' : '');
  cur = 0;
  renderQ();
  window.scrollTo({top:0});
}

function renderQ(){
  const q = PAPER[cur];
  document.getElementById('prog').textContent = '第 ' + (cur+1) + ' / ' + PAPER.length + ' 题';
  const card = document.getElementById('card');
  let html = '<div class="qmeta"><span class="qtype ' + q.t + '">' + TYPE_LABEL[q.t] + (q.t==='multi'?'（多选）':'') + '</span>' +
    (q.src ? '<span style="font-size:11px;color:#9ca3af">' + esc(q.src) + '</span>' : '') + '</div>';
  const qHtml = q.t === 'fill' ? esc(q.q).replace(/____/g,'<span class="blank">＿＿＿</span>') : esc(q.q);
  html += '<div class="qtext">' + qHtml + '</div>';
  if (q.t === 'fill') {
    const blanks = q.a.length;
    for (let i=0;i<blanks;i++) html += '<div class="fill-row"><input class="fill-input" data-i="' + i + '" placeholder="第 ' + (i+1) + ' 空" autocomplete="off"></div>';
    html += '<div class="nav"><button class="btn gray" onclick="prevQ()" ' + (cur===0?'disabled':'') + '>上一题</button>' +
            '<button class="btn" onclick="saveFill()">' + (cur===PAPER.length-1?'交卷':'下一题') + '</button></div>';
  } else {
    const opts = q.t === 'judge' ? JOPTS : q.o;
    opts.forEach((o,oi) => {
      html += '<div class="opt" data-oi="' + oi + '" onclick="pick(this)">' + String.fromCharCode(65+oi) + '. ' + esc(o) + '</div>';
    });
    html += '<div class="nav"><button class="btn gray" onclick="prevQ()" ' + (cur===0?'disabled':'') + '>上一题</button>' +
            '<button class="btn" onclick="nextQ()">' + (cur===PAPER.length-1?'交卷':'下一题') + '</button></div>';
  }
  card.innerHTML = html;
  // 恢复已答
  const a = answers[cur];
  if (a) {
    if (q.t === 'multi' || q.t === 'single' || q.t === 'judge') {
      document.querySelectorAll('.opt').forEach(o => { if (a.picked.includes(+o.dataset.oi)) o.classList.add('sel'); });
    } else {
      document.querySelectorAll('.fill-input').forEach(inp => { inp.value = a.fillVals[+inp.dataset.i] || ''; });
    }
  }
}

function pick(el){
  const q = PAPER[cur];
  if (q.t === 'multi') { el.classList.toggle('sel'); return; }
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  savePick([+el.dataset.oi]);
  if (cur < PAPER.length - 1) setTimeout(nextQ, 150);
}
function savePick(picked){
  const q = PAPER[cur];
  const correct = letters(picked) === letters(q.a) && picked.length === q.a.length;
  answers[cur] = { picked, correct };
}
function nextQ(){
  const q = PAPER[cur];
  if (q.t !== 'fill') {
    const sel = [...document.querySelectorAll('.opt.sel')].map(e=>+e.dataset.oi);
    if (!sel.length && answers[cur] === undefined) { alert('请先作答'); return; }
    if (sel.length) savePick(sel);
  }
  if (cur === PAPER.length - 1) { submit(); return; }
  cur++; renderQ(); window.scrollTo({top:0});
}
function prevQ(){ if (cur > 0) { cur--; renderQ(); window.scrollTo({top:0}); } }
function saveFill(){
  const q = PAPER[cur];
  const inputs = [...document.querySelectorAll('.fill-input')];
  const vals = inputs.map(i => i.value);
  if (vals.some(v => !v.trim())) { alert('请填写所有空'); return; }
  let correct = true;
  q.a.forEach((acc, i) => {
    const ok = acc.split('|').map(x=>normAns(x)).includes(normAns(vals[i]));
    if (!ok) correct = false;
  });
  answers[cur] = { fillVals: vals, correct };
  if (cur === PAPER.length - 1) { submit(); return; }
  cur++; renderQ(); window.scrollTo({top:0});
}

function submit(){
  // 未答的题记为错
  PAPER.forEach((q,i) => { if (answers[i] === undefined) answers[i] = {picked:[], fillVals:[], correct:false}; });
  const rightN = PAPER.filter((q,i) => answers[i].correct).length;
  const score = Math.round(rightN / PAPER.length * 100);
  // 展示
  document.getElementById('exam-top').classList.remove('show');
  document.getElementById('card').style.display = 'none';
  const sc = document.getElementById('score');
  sc.textContent = score + ' 分';
  sc.style.color = score>=80 ? '#16a34a' : score>=60 ? '#d97706' : '#dc2626';
  const wrong = PAPER.length - rightN;
  document.getElementById('score-line').innerHTML =
    '考生：' + esc(student.name) + (student.cls ? '（' + esc(student.cls) + '）' : '') +
    '　｜　答对 ' + rightN + ' / ' + PAPER.length + '　｜　答错 ' + wrong +
    '　｜　' + (score>=80?'🎉 通过':score>=60?'💪 及格':'📖 未通过，需复习重考');
  // 回顾
  const rv = PAPER.map((q,i) => {
    const a = answers[i];
    const ansTxt = q.t==='fill'
      ? q.a.map(x=>x.split('|')[0]).join('；')
      : q.a.map(k=>String.fromCharCode(65+k)).sort().join('');
    let your = '';
    if (q.t === 'fill') your = (a.fillVals||[]).join('；');
    else if ((a.picked||[]).length) your = a.picked.map(k=>String.fromCharCode(65+k)).sort().join('');
    else your = '未作答';
    const tag = a.correct ? '<span class="tag ok">✓ 对</span>' : '<span class="tag no">✗ 错</span>';
    return '<div class="review-item">' + tag + (i+1) + '. ' + esc(q.q) +
      '<br><span class="your">你的答案：' + esc(your) + '</span>　<span class="ans">正确答案：' + esc(ansTxt) + '</span>' +
      '<br><span style="color:#9ca3af;font-size:13px">💡 ' + esc(q.e) + '</span></div>';
  }).join('');
  document.getElementById('review').innerHTML = '<h3 style="font-size:15px;margin-bottom:6px">逐题回顾</h3>' + rv;
  document.getElementById('result').classList.add('show');
  window.__result = {name: student.name, cls: student.cls, score, rightN, total: PAPER.length, examId: EXAM_ID, time: new Date().toLocaleString('zh-CN')};
  // 本地留存
  try {
    const hist = JSON.parse(localStorage.getItem('exam_history') || '[]');
    hist.push(window.__result);
    localStorage.setItem('exam_history', JSON.stringify(hist));
  } catch(e) {}
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

function copyResult(){
  const r = window.__result;
  const txt = '【' + EXAM_ID + ' 考试成绩】\n姓名：' + r.name + (r.cls ? '\n班级/工号：' + r.cls : '') +
    '\n得分：' + r.score + ' 分（' + r.rightN + '/' + r.total + '，按准确率计算）\n交卷时间：' + r.time;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('已复制，粘贴发给培训负责人即可'));
  else {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); alert('已复制，粘贴发给培训负责人即可');
  }
}
</script>
